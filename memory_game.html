<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神経衰弱 — Memory Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #0c0a1e;
      --surf:  rgba(255,255,255,.05);
      --bord:  rgba(255,255,255,.1);
      --text:  rgba(255,255,255,.92);
      --mute:  rgba(255,255,255,.4);
      --vio:   #7c3aed;
      --vio2:  #a78bfa;
      --teal:  #06b6d4;
      --ora:   #f97316;
      --gold:  #eab308;
      --green: #22c55e;
    }

    body {
      font-family: 'Nunito', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 14px 52px;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 65% 50% at 15% 5%,  rgba(124,58,237,.22)  0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 85% 95%,  rgba(6,182,212,.15)  0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 75% 15%,  rgba(234,179,8,.1)   0%, transparent 50%);
    }

    /* ── layout ── */
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 580px; }

    /* ── header ── */
    header { text-align: center; margin-bottom: 24px; }
    .logo { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900; letter-spacing: 3px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8, #a78bfa);
      background-size: 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: hdrShimmer 5s linear infinite; }
    @keyframes hdrShimmer { to { background-position: 200%; } }
    .logo-sub { font-size: .72rem; color: var(--mute); letter-spacing: 4px; margin-top: 3px; }

    /* ── size selector ── */
    .size-bar {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .size-btn {
      padding: 9px 22px;
      background: var(--surf);
      border: 1px solid var(--bord);
      border-radius: 50px;
      color: var(--mute);
      font-family: inherit; font-size: .88rem; font-weight: 800;
      cursor: pointer;
      transition: all .18s;
      letter-spacing: 1px;
    }
    .size-btn:hover { border-color: var(--vio2); color: var(--vio2); }
    .size-btn.active {
      background: linear-gradient(135deg, var(--vio), #5b21b6);
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 18px rgba(124,58,237,.45);
    }

    /* ── HUD ── */
    .hud {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-bottom: 18px;
    }
    .hud-box {
      background: var(--surf);
      border: 1px solid var(--bord);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .hud-lbl { font-size: .6rem; font-weight: 700; letter-spacing: 2px; color: var(--mute); margin-bottom: 3px; }
    .hud-val { font-size: 1.3rem; font-weight: 900; line-height: 1; }
    .hud-val.c-teal  { color: var(--teal); }
    .hud-val.c-ora   { color: var(--ora); }
    .hud-val.c-gold  { color: var(--gold); }

    /* best sub-row */
    .best-row {
      display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .best-chip {
      font-size: .68rem; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
      background: var(--surf); border: 1px solid var(--bord);
      color: var(--mute); letter-spacing: .5px;
      white-space: nowrap;
    }
    .best-chip span { color: var(--gold); margin-left: 4px; }

    /* ── grid ── */
    .grid-wrap {
      width: 100%;
      display: flex; justify-content: center;
    }
    .grid {
      display: grid;
      gap: clamp(6px, 1.8vw, 10px);
      width: 100%;
    }

    /* ── card ── */
    .card {
      aspect-ratio: 1;
      perspective: 900px;
      cursor: pointer;
    }
    .card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.4,0,.2,1);
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-back, .card-front {
      position: absolute; inset: 0;
      border-radius: clamp(8px, 2vw, 12px);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* BACK — decorative purple */
    .card-back {
      background: linear-gradient(145deg, #3b0764, #5b21b6, #4c1d95);
      overflow: hidden;
    }
    .card-back::before {
      content: '';
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(45deg,  rgba(255,255,255,.04) 0, rgba(255,255,255,.04) 1px, transparent 1px, transparent 14px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.04) 0, rgba(255,255,255,.04) 1px, transparent 1px, transparent 14px);
    }
    .card-back::after {
      content: '';
      position: absolute; inset: 5px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: calc(clamp(8px,2vw,12px) - 3px);
      background: radial-gradient(circle at 50% 40%, rgba(167,139,250,.12) 0%, transparent 65%);
    }

    /* FRONT */
    .card-front {
      transform: rotateY(180deg);
      background: linear-gradient(145deg, #1e1b4b, #2d2867);
      border: 2px solid rgba(167,139,250,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(20px, 6vw, 40px);
      transition: box-shadow .3s, border-color .3s;
    }

    .card.matched .card-front {
      border-color: rgba(34,197,94,.55);
      box-shadow: 0 0 18px rgba(34,197,94,.4), inset 0 0 14px rgba(34,197,94,.1);
      animation: matchPop .35s cubic-bezier(.18,1.4,.5,1);
    }
    @keyframes matchPop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    .card.wrong .card-inner {
      animation: wrongShake .4s ease;
    }
    @keyframes wrongShake {
      0%,100% { transform: rotateY(180deg) translateX(0); }
      25%      { transform: rotateY(180deg) translateX(-5px); }
      75%      { transform: rotateY(180deg) translateX(5px); }
    }

    .card:not(.flipped):not(.matched):hover .card-back {
      background: linear-gradient(145deg, #4c1d95, #6d28d9, #5b21b6);
      box-shadow: 0 4px 20px rgba(124,58,237,.4);
    }

    /* ── progress bar ── */
    .progress-wrap {
      width: 100%; height: 6px;
      background: rgba(255,255,255,.08);
      border-radius: 4px;
      margin: 14px 0 0;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--vio), var(--teal));
      border-radius: 4px;
      transition: width .4s ease;
      width: 0%;
    }

    /* ── new game button ── */
    .new-btn-wrap { display: flex; justify-content: center; margin-top: 20px; }
    .new-btn {
      padding: 13px 40px;
      background: linear-gradient(135deg, #5b21b6, #7c3aed);
      border: none; border-radius: 50px;
      color: #fff; font-family: inherit; font-size: 1rem; font-weight: 800;
      cursor: pointer; letter-spacing: 2px;
      box-shadow: 0 6px 22px rgba(124,58,237,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .new-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124,58,237,.55); }
    .new-btn:active { transform: translateY(0); }

    /* ── win modal ── */
    .modal-bg {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-bg.hidden { display: none; }

    .modal {
      background: linear-gradient(160deg, #1e1b4b, #1a1040);
      border: 1px solid rgba(167,139,250,.25);
      border-radius: 22px;
      padding: 36px 32px 40px;
      text-align: center;
      width: clamp(300px, 88vw, 420px);
      box-shadow: 0 24px 70px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
      position: relative; overflow: hidden;
    }
    .modal::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4, #22c55e, #eab308);
    }

    .modal-trophy { font-size: 3.5rem; margin-bottom: 10px; animation: trophyBounce .8s cubic-bezier(.18,1.4,.5,1); }
    @keyframes trophyBounce {
      from { transform: scale(0) rotate(-20deg); }
      to   { transform: scale(1) rotate(0); }
    }

    .modal-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; letter-spacing: 2px; }
    .modal-size  { font-size: .75rem; color: var(--mute); letter-spacing: 3px; margin-bottom: 24px; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .stat-box {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px 10px;
    }
    .stat-lbl { font-size: .62rem; font-weight: 700; color: var(--mute); letter-spacing: 2px; margin-bottom: 4px; }
    .stat-val { font-size: 1.5rem; font-weight: 900; line-height: 1; }

    .new-record {
      display: inline-block;
      background: linear-gradient(135deg, #eab308, #f59e0b);
      color: #000;
      font-size: .62rem; font-weight: 900;
      padding: 2px 8px; border-radius: 20px;
      letter-spacing: 1px; margin-left: 6px;
      vertical-align: middle;
      animation: recPulse .6s ease infinite alternate;
    }
    @keyframes recPulse { to { transform: scale(1.08); } }

    .modal-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .mbtn {
      padding: 13px 28px; border: none; border-radius: 50px;
      font-family: inherit; font-size: .95rem; font-weight: 800;
      cursor: pointer; transition: transform .15s, box-shadow .15s; letter-spacing: 1px;
    }
    .mbtn:hover { transform: translateY(-2px); }
    .mbtn.primary {
      background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff;
      box-shadow: 0 6px 20px rgba(124,58,237,.4);
    }
    .mbtn.secondary { background: rgba(255,255,255,.08); color: var(--mute); }
    .mbtn.primary:hover { box-shadow: 0 10px 28px rgba(124,58,237,.55); }

    /* ── confetti ── */
    .confetti-piece {
      position: fixed; top: 0;
      pointer-events: none; z-index: 600;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* responsive */
    @media (max-width: 400px) {
      .modal { padding: 28px 18px 32px; }
      .stat-grid { gap: 8px; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="logo">🃏 神経衰弱</div>
    <div class="logo-sub">MEMORY CARD GAME</div>
  </header>

  <div class="size-bar" id="sizeBar">
    <button class="size-btn active" data-size="4x4" onclick="selectSize('4x4')">4 × 4</button>
    <button class="size-btn"        data-size="4x6" onclick="selectSize('4x6')">4 × 6</button>
    <button class="size-btn"        data-size="6x6" onclick="selectSize('6x6')">6 × 6</button>
  </div>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-lbl">タイム</div>
      <div class="hud-val c-teal" id="timerDisp">00:00</div>
    </div>
    <div class="hud-box">
      <div class="hud-lbl">めくった回数</div>
      <div class="hud-val c-ora" id="movesDisp">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-lbl">残りペア</div>
      <div class="hud-val c-gold" id="pairsDisp">—</div>
    </div>
  </div>

  <div class="best-row" id="bestRow"></div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="new-btn-wrap">
    <button class="new-btn" onclick="newGame()">🔀 新しいゲーム</button>
  </div>

</div>

<!-- Win Modal -->
<div class="modal-bg hidden" id="modal">
  <div class="modal">
    <div class="modal-trophy">🏆</div>
    <div class="modal-title">クリア！</div>
    <div class="modal-size" id="modalSize"></div>
    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-lbl">クリアタイム</div>
        <div class="stat-val c-teal" id="mTime"></div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">めくった回数</div>
        <div class="stat-val c-ora" id="mMoves"></div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">ベストタイム</div>
        <div class="stat-val c-gold" id="mBestTime"></div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">ベスト回数</div>
        <div class="stat-val c-gold" id="mBestMoves"></div>
      </div>
    </div>
    <div id="newRecordMsg" style="font-size:.82rem;color:#eab308;font-weight:700;margin-bottom:14px;min-height:20px"></div>
    <div class="modal-btns">
      <button class="mbtn primary" id="playAgainBtn" onclick="newGame(); closeModal()">もう一度</button>
      <button class="mbtn secondary" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ═══════════ CONFIG ═══════════ */
const CONFIGS = {
  '4x4': { cols: 4, rows: 4, pairs: 8  },
  '4x6': { cols: 4, rows: 6, pairs: 12 },
  '6x6': { cols: 6, rows: 6, pairs: 18 },
};

const EMOJI_POOL = [
  '🦊','🐼','🦋','🌺','⭐','🎸','🚀','💎',
  '🌈','🔥','🎯','🏆','🎀','🍀','🐸','🦁',
  '🎭','🌙',
];

/* ═══════════ STATE ═══════════ */
let currentSize = '4x4';
let cardData    = [];   // { id, emoji, el }
let flippedIds  = [];   // up to 2 active flips
let matchedSet  = new Set();
let moves       = 0;
let totalPairs  = 0;
let locked      = false;
let timerInt    = null;
let startTime   = null;
let elapsed     = 0;   // seconds
let gameStarted = false;

/* ═══════════ BEST SCORES ═══════════ */
function bestKey(size, type) { return `mem_best_${size}_${type}`; }
function getBest(size, type) {
  const v = localStorage.getItem(bestKey(size, type));
  return v !== null ? parseInt(v) : null;
}
function saveBest(size, type, val) {
  const cur = getBest(size, type);
  if (cur === null || val < cur) {
    localStorage.setItem(bestKey(size, type), val);
    return true;
  }
  return false;
}
function fmtTime(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function updateBestRow() {
  const row = document.getElementById('bestRow');
  const sizes = ['4x4','4x6','6x6'];
  row.innerHTML = sizes.map(s => {
    const bt = getBest(s, 'time');
    const bm = getBest(s, 'moves');
    const label = s.replace('x','×');
    const t = bt !== null ? fmtTime(bt) : '--:--';
    const m = bm !== null ? bm + '回' : '--';
    return `<span class="best-chip">${label} <span>${t} / ${m}</span></span>`;
  }).join('');
}

/* ═══════════ INIT ═══════════ */
function selectSize(size) {
  currentSize = size;
  document.querySelectorAll('.size-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.size === size));
  newGame();
}

function newGame() {
  clearTimer();
  const cfg = CONFIGS[currentSize];
  totalPairs = cfg.pairs;
  moves = 0; flippedIds = []; matchedSet.clear(); locked = false;
  elapsed = 0; gameStarted = false;

  updateMovesDisp();
  updatePairsDisp();
  updateProgressBar();
  document.getElementById('timerDisp').textContent = '00:00';

  const emojis = EMOJI_POOL.slice(0, cfg.pairs);
  const deck   = shuffle([...emojis, ...emojis]);
  cardData = deck.map((emoji, i) => ({ id: i, emoji }));

  renderGrid(cfg.cols, cfg.rows);
  updateBestRow();
}

/* ═══════════ RENDER ═══════════ */
function renderGrid(cols, rows) {
  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  cardData.forEach(({ id, emoji }) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = id;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front">${emoji}</div>
      </div>`;
    card.addEventListener('click',      () => flipCard(id));
    card.addEventListener('touchstart', e => { e.preventDefault(); flipCard(id); }, { passive: false });
    grid.appendChild(card);
    cardData[id].el = card;
  });
}

/* ═══════════ GAME LOGIC ═══════════ */
function flipCard(id) {
  if (locked) return;
  if (matchedSet.has(id)) return;
  if (flippedIds.includes(id)) return;
  if (flippedIds.length === 2) return;

  // Start timer on first flip
  if (!gameStarted) { gameStarted = true; startTimer(); }

  const card = cardData[id].el;
  card.classList.add('flipped');
  flippedIds.push(id);
  moves++;
  updateMovesDisp();

  if (flippedIds.length === 2) {
    locked = true;
    setTimeout(checkMatch, 700);
  }
}

function checkMatch() {
  const [a, b] = flippedIds;
  if (cardData[a].emoji === cardData[b].emoji) {
    // ✅ Match
    cardData[a].el.classList.add('matched');
    cardData[b].el.classList.add('matched');
    matchedSet.add(a); matchedSet.add(b);
    flippedIds = [];
    locked = false;
    updatePairsDisp();
    updateProgressBar();
    if (matchedSet.size === totalPairs * 2) setTimeout(winGame, 300);
  } else {
    // ❌ No match
    cardData[a].el.classList.add('wrong');
    cardData[b].el.classList.add('wrong');
    setTimeout(() => {
      cardData[a].el.classList.remove('flipped','wrong');
      cardData[b].el.classList.remove('flipped','wrong');
      flippedIds = [];
      locked = false;
    }, 600);
  }
}

/* ═══════════ WIN ═══════════ */
function winGame() {
  clearTimer();
  const newTime  = saveBest(currentSize, 'time',  elapsed);
  const newMoves = saveBest(currentSize, 'moves', moves);
  const bestT = getBest(currentSize, 'time');
  const bestM = getBest(currentSize, 'moves');
  const label = currentSize.replace('x','×');

  document.getElementById('modalSize').textContent  = `サイズ: ${label}`;
  document.getElementById('mTime').textContent       = fmtTime(elapsed);
  document.getElementById('mMoves').textContent      = moves + ' 回';
  document.getElementById('mBestTime').textContent   = fmtTime(bestT);
  document.getElementById('mBestMoves').textContent  = bestM + ' 回';

  let recMsg = '';
  if (newTime)  recMsg += '🥇 タイム新記録！ ';
  if (newMoves) recMsg += '🎯 回数新記録！';
  document.getElementById('newRecordMsg').innerHTML = recMsg ?
    recMsg + '<span class="new-record">NEW RECORD</span>' : '';

  document.getElementById('playAgainBtn').textContent = '🔀 もう一度（' + label + '）';
  document.getElementById('modal').classList.remove('hidden');
  launchConfetti();
  updateBestRow();
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

/* ═══════════ TIMER ═══════════ */
function startTimer() {
  startTime = Date.now() - elapsed * 1000;
  timerInt = setInterval(() => {
    elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timerDisp').textContent = fmtTime(elapsed);
  }, 500);
}
function clearTimer() {
  clearInterval(timerInt); timerInt = null;
}

/* ═══════════ HUD ═══════════ */
function updateMovesDisp() {
  document.getElementById('movesDisp').textContent = moves;
}
function updatePairsDisp() {
  const remaining = totalPairs - matchedSet.size / 2;
  document.getElementById('pairsDisp').textContent = remaining;
}
function updateProgressBar() {
  const pct = totalPairs > 0 ? (matchedSet.size / 2 / totalPairs) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

/* ═══════════ CONFETTI ═══════════ */
const CONFETTI_COLORS = ['#7c3aed','#06b6d4','#22c55e','#eab308','#f97316','#ec4899','#a78bfa'];

function launchConfetti() {
  for (let i = 0; i < 90; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      const size = 6 + Math.random() * 8;
      p.style.cssText = `
        left: ${Math.random() * 100}vw;
        width: ${size}px; height: ${size * (1 + Math.random())}px;
        background: ${CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]};
        animation-duration: ${1.5 + Math.random() * 2}s;
        animation-delay: ${Math.random() * .5}s;
        transform-origin: center;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }, i * 18);
  }
}

/* ═══════════ UTILS ═══════════ */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
