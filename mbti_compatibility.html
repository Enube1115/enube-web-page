<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI相性診断 - パーソナリティ完全ガイド</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F0F2F8;--card:#fff;--text:#2D3748;--sub:#718096;--border:#E2E8F0;
  --shadow:0 4px 24px rgba(0,0,0,0.08);--r:16px;
  --analyst:#4A90D9;--diplomat:#52B788;--sentinel:#F4A261;--explorer:#E76F51;
}
body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
/* HERO */
.hero{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f64f59 100%);padding:64px 20px 100px;text-align:center;color:#fff}
.hero h1{font-size:clamp(2em,5vw,3.2em);font-weight:900;letter-spacing:-1px;margin-bottom:14px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.hero p{font-size:1.05em;opacity:.9;line-height:1.7}
/* QUIZ */
.quiz-wrap{max-width:680px;margin:-60px auto 40px;padding:0 16px}
.quiz-card{background:#fff;border-radius:var(--r);padding:40px;box-shadow:var(--shadow)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-bottom:28px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:3px;transition:width .4s}
.q-num{font-size:.8em;font-weight:700;color:var(--sub);margin-bottom:10px;letter-spacing:1px}
.q-text{font-size:1.2em;font-weight:700;line-height:1.55;margin-bottom:26px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt-btn{padding:15px 18px;border:2px solid var(--border);border-radius:12px;background:#fff;cursor:pointer;text-align:left;font-size:.97em;font-family:inherit;color:var(--text);transition:all .2s}
.opt-btn:hover{border-color:#667eea;background:#f8f7ff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,.18)}
.opt-btn.sel{border-color:#667eea;background:linear-gradient(135deg,rgba(102,126,234,.1),rgba(118,75,162,.08));color:#667eea;font-weight:600}
/* RESULT */
.result-wrap{text-align:center}
.mbti-badge{display:inline-block;font-size:2.8em;font-weight:900;padding:18px 40px;border-radius:20px;margin-bottom:18px;letter-spacing:4px}
.analyst-bg{background:linear-gradient(135deg,#4A90D9,#357ABD);color:#fff}
.diplomat-bg{background:linear-gradient(135deg,#52B788,#3A9E6A);color:#fff}
.sentinel-bg{background:linear-gradient(135deg,#F4A261,#D4813F);color:#fff}
.explorer-bg{background:linear-gradient(135deg,#E76F51,#C74F31);color:#fff}
.type-name-big{font-size:1.7em;font-weight:800;margin-bottom:6px}
.type-emoji-big{font-size:2.2em;display:block;margin-bottom:14px}
.type-desc-text{color:var(--sub);line-height:1.75;max-width:480px;margin:0 auto 22px;font-size:.97em}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px}
.tag{padding:5px 14px;border-radius:20px;font-size:.82em;font-weight:700;background:#f0f0ff;color:#667eea}
.retake-btn{background:none;border:2px solid #667eea;color:#667eea;padding:10px 28px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:700;font-size:.95em;transition:all .2s;margin-right:10px}
.retake-btn:hover{background:#667eea;color:#fff}
.start-btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:16px 40px;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:700;font-size:1.05em;box-shadow:0 4px 15px rgba(102,126,234,.4);transition:all .2s;margin-top:20px}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,.5)}
/* NAV */
.main-nav{background:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.nav-inner{max-width:1000px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.nav-tab{padding:16px 18px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-size:.88em;font-weight:600;color:var(--sub);white-space:nowrap;transition:all .2s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:#667eea;border-bottom-color:#667eea}
/* CONTENT */
.content{max-width:1000px;margin:0 auto;padding:36px 16px}
.section{display:none;animation:fadeIn .35s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sec-header{margin-bottom:28px}
.sec-header h2{font-size:1.75em;font-weight:800;margin-bottom:6px}
.sec-header p{color:var(--sub);font-size:.95em}
/* CARDS */
.card{background:#fff;border-radius:var(--r);padding:28px;box-shadow:var(--shadow);margin-bottom:20px}
.card-title{font-size:1.1em;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
/* TYPE GRID */
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:24px}
.tg-group{margin-bottom:4px}
.tg-label{font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:4px;display:inline-block;margin-bottom:6px}
.analyst-lbl{background:#EBF5FF;color:#4A90D9}
.diplomat-lbl{background:#F0FDF4;color:#52B788}
.sentinel-lbl{background:#FFF8EE;color:#F4A261}
.explorer-lbl{background:#FFF0EE;color:#E76F51}
.type-btn{padding:11px 6px;border:2px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;text-align:center;font-family:inherit;font-weight:800;font-size:.92em;letter-spacing:1px;transition:all .2s;color:var(--sub)}
.type-btn:hover,.type-btn.sel{color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.type-btn.analyst:hover,.type-btn.analyst.sel{background:var(--analyst)}
.type-btn.diplomat:hover,.type-btn.diplomat.sel{background:var(--diplomat)}
.type-btn.sentinel:hover,.type-btn.sentinel.sel{background:var(--sentinel)}
.type-btn.explorer:hover,.type-btn.explorer.sel{background:var(--explorer)}
/* COMPAT */
.compat-selectors{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.sel-label{font-size:.8em;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.compat-display{padding:28px;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);margin-bottom:20px}
.compat-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.type-chip{padding:10px 18px;border-radius:10px;font-weight:900;font-size:1.3em;letter-spacing:2px;color:#fff}
.vs-txt{font-size:1.3em;color:var(--sub);font-weight:700}
.score-circle{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:900;color:#fff;flex-shrink:0;margin-left:auto}
.score-label-row{display:flex;justify-content:space-between;font-size:.82em;font-weight:600;margin-bottom:6px}
.score-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:20px}
.score-bar-fill{height:100%;border-radius:5px;transition:width .9s ease}
.pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.pros-box,.cons-box{padding:16px;border-radius:12px}
.pros-box{background:#f0fdf4;border:1px solid #bbf7d0}
.cons-box{background:#fef2f2;border:1px solid #fecaca}
.pros-box h4{color:#16a34a;margin-bottom:10px;font-size:.93em}
.cons-box h4{color:#dc2626;margin-bottom:10px;font-size:.93em}
.pc-list{list-style:none;font-size:.88em;line-height:2}
.pros-box .pc-list li::before{content:"✓ ";color:#16a34a}
.cons-box .pc-list li::before{content:"✗ ";color:#dc2626}
.advice-box{background:linear-gradient(135deg,#f8f7ff,#f0f0ff);border:1px solid #e0e0ff;border-radius:12px;padding:16px}
.advice-box h4{color:#667eea;margin-bottom:10px;font-size:.93em}
.advice-list{list-style:none;font-size:.88em;line-height:2}
.advice-list li::before{content:"💡 ";color:#667eea}
/* RANKING */
.rank-item{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:9px;cursor:pointer;transition:transform .2s}
.rank-item:hover{transform:translateX(4px)}
.rank-num{font-size:1.1em;font-weight:900;width:30px;text-align:center;color:var(--sub)}
.rank-num.gold{color:#F59E0B}
.rank-num.silver{color:#9CA3AF}
.rank-num.bronze{color:#B45309}
.rank-chip{font-weight:800;font-size:1em;letter-spacing:1px;padding:6px 12px;border-radius:8px;color:#fff;flex-shrink:0}
.rank-name{flex:1;font-size:.88em;color:var(--sub)}
.rank-score{font-weight:700;font-size:.97em;width:40px;text-align:right}
.rank-bar-wrap{width:90px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:3px}
/* INFO GRID */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.info-card{background:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.info-card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.info-card-icon{font-size:1.8em}
.info-card h3{font-size:1em;font-weight:700}
.info-chip{display:inline-block;padding:3px 10px;border-radius:6px;font-size:.75em;font-weight:700;color:#fff;margin-bottom:10px}
.info-list{list-style:none;font-size:.88em;line-height:2;color:var(--sub)}
.info-list li::before{content:"→ ";color:#667eea}
/* PLACEHOLDER */
.placeholder-msg{text-align:center;padding:60px 20px;color:var(--sub)}
.placeholder-msg .big{font-size:3em;margin-bottom:12px}
.placeholder-msg p{font-size:1em}
/* RESPONSIVE */
@media(max-width:600px){
  .hero{padding:50px 16px 90px}
  .type-grid{grid-template-columns:repeat(2,1fr)}
  .compat-selectors{grid-template-columns:1fr}
  .pros-cons{grid-template-columns:1fr}
  .quiz-card{padding:24px}
}
/* SCORE COLORS */
.s95,.s90{background:linear-gradient(135deg,#FF6B6B,#FF8E53)}
.s85,.s80{background:linear-gradient(135deg,#667eea,#764ba2)}
.s75,.s70{background:linear-gradient(135deg,#11998e,#38ef7d)}
.s65,.s60{background:linear-gradient(135deg,#F7971E,#FFD200)}
.s55,.s50{background:linear-gradient(135deg,#bdc3c7,#95a5a6)}
.f95,.f90{background:linear-gradient(90deg,#FF6B6B,#FF8E53)}
.f85,.f80{background:linear-gradient(90deg,#667eea,#764ba2)}
.f75,.f70{background:linear-gradient(90deg,#11998e,#38ef7d)}
.f65,.f60{background:linear-gradient(90deg,#F7971E,#FFD200)}
.f55,.f50{background:linear-gradient(90deg,#bdc3c7,#95a5a6)}
/* COMPAT select type grid (smaller) */
.sel-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sel-type-btn{padding:8px 4px;border:2px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-family:inherit;font-weight:800;font-size:.82em;letter-spacing:.5px;transition:all .2s;color:var(--sub)}
.sel-type-btn:hover,.sel-type-btn.sel{color:#fff;border-color:transparent}
.sel-type-btn.analyst:hover,.sel-type-btn.analyst.sel{background:var(--analyst)}
.sel-type-btn.diplomat:hover,.sel-type-btn.diplomat.sel{background:var(--diplomat)}
.sel-type-btn.sentinel:hover,.sel-type-btn.sentinel.sel{background:var(--sentinel)}
.sel-type-btn.explorer:hover,.sel-type-btn.explorer.sel{background:var(--explorer)}
</style>
</head>
<body>

<div class="hero">
  <h1>✨ MBTI 相性診断</h1>
  <p>20問の診断でタイプを特定 → 256パターンの相性・恋愛・仕事・友情を完全分析</p>
</div>

<!-- QUIZ -->
<div class="quiz-wrap">
  <div class="quiz-card" id="quizArea"></div>
</div>

<!-- NAV -->
<nav class="main-nav">
  <div class="nav-inner">
    <button class="nav-tab active" onclick="switchTab(this,'compatibility')">💞 相性診断</button>
    <button class="nav-tab" onclick="switchTab(this,'ranking')">🏆 相性ランキング</button>
    <button class="nav-tab" onclick="switchTab(this,'study')">📚 勉強法・仕事</button>
    <button class="nav-tab" onclick="switchTab(this,'stress')">🌿 ストレス対策</button>
    <button class="nav-tab" onclick="switchTab(this,'love')">❤️ 恋愛傾向</button>
    <button class="nav-tab" onclick="switchTab(this,'friends')">🤝 友達の作り方</button>
  </div>
</nav>

<div class="content">
  <div id="sec-compatibility" class="section active"></div>
  <div id="sec-ranking" class="section"></div>
  <div id="sec-study" class="section"></div>
  <div id="sec-stress" class="section"></div>
  <div id="sec-love" class="section"></div>
  <div id="sec-friends" class="section"></div>
</div>

<script>
// ===== DATA =====
const TYPES = ['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
const GROUPS = {
  analyst:['INTJ','INTP','ENTJ','ENTP'],
  diplomat:['INFJ','INFP','ENFJ','ENFP'],
  sentinel:['ISTJ','ISFJ','ESTJ','ESFJ'],
  explorer:['ISTP','ISFP','ESTP','ESFP']
};
function getGroup(t){for(const g in GROUPS)if(GROUPS[g].includes(t))return g;return'analyst'}
const GROUP_COLORS={analyst:'#4A90D9',diplomat:'#52B788',sentinel:'#F4A261',explorer:'#E76F51'};

const TYPE_DATA = {
  INTJ:{name:'建築家',emoji:'🏛️',desc:'戦略的思考と強固な意志を持つビジョナリー。複雑な問題を独自の視点で解き、長期目標へ着実に進む完璧主義者。',keys:['戦略的','独立心','完璧主義','革新的','意志強固'],
    study:{title:'体系的・独学型',pts:['全体像を掴んでから詳細へ','目標を設定し逆算して学習計画','静かな環境で長時間の集中作業','なぜそうなるかを徹底的に理解','複数の情報源を比較して深掘り']},
    work:{title:'戦略的専門家・リーダー',pts:['長期戦略の立案と実行が得意','独立して作業することを好む','非効率なプロセスを積極的に改善','高い基準でチームを牽引する','細かい管理より大局的ビジョンを重視']},
    stress:{causes:['無能や非効率なシステム','感情的な不合理な批判','マイクロマネジメント','予期しない計画の崩壊','過度な社交的義務'],
      relief:['一人で思考を整理する時間','新たな知的プロジェクト','読書や専門知識の深掘り','長期目標の見直し','自然の中でのソロ活動']},
    love:{tend:'知的なつながりを最重視。感情表現は不得意だが、パートナーには深い誠実さで接する。独立性と知性を持つ相手を求める。',pts:['感情より行動で愛情を示す','知的な会話で絆を深める','パートナーの自律性を尊重','長期的・真剣な関係を望む','批判的になりすぎに注意']},
    friends:{tend:'少数精鋭の深い友人関係を好む。共通の知的興味を持つ人と長く深く付き合い、友情には高い忠誠心を持つ。',pts:['知的な趣味を共有できる人を探す','一対一の深い会話を大切に','グループより個人的なつながり重視','友情は量より質','一度築いた友情は長続きする']}},
  INTP:{name:'論理学者',emoji:'🔬',desc:'客観的・分析的思考で真実を追求する理論家。複雑なシステムや概念を愛し、既存の考えに常に疑問を持つ。',keys:['分析的','客観的','独創的','理論家','探究心'],
    study:{title:'理論探求・自由研究型',pts:['興味が湧いたら深く掘り下げる','体系的な理論から理解を構築','自分のペースで学ぶことが重要','実験や実証を通じて概念を確認','複数分野を横断して学ぶ']},
    work:{title:'研究者・システム設計者',pts:['複雑な問題の論理的分析が得意','単独で深く集中する作業を好む','理論とシステム設計に強みを発揮','革新的なアイデアを生み出す','締め切り管理や事務処理は苦手']},
    stress:{causes:['感情的な議論や非論理的な要求','社交的な義務や雑談の多い環境','ルーティン作業の繰り返し','自分の考えを否定される','完成できないまま放置されること'],
      relief:['一人で問題を分析する時間','新しい知的パズルや謎に挑む','好きな分野の本や論文を読む','静かな環境でのプログラミング・設計','概念的な議論ができる友人と話す']},
    love:{tend:'知的な刺激と自律性を大切にする。感情表現が苦手だが、パートナーをとても大切に思っている。共に成長できる関係を求める。',pts:['論理的な問題解決でパートナーを助ける','感情より行動で示す愛情','互いの独立性を尊重する関係','知的な議論が多い関係を楽しむ','嫉妬や束縛を好まない']},
    friends:{tend:'少人数の深い関係を好む。表面的な会話より深い議論を好み、共通の知的関心を持つ人と長続きする友情を育てる。',pts:['共通の知的趣味がある人に近づく','深い議論から友情が生まれることが多い','オンライングループや趣味コミュが有効','まず自分から話題を提供してみる','時間をかけてゆっくり関係を育てる']}},
  ENTJ:{name:'指揮官',emoji:'👑',desc:'生まれながらのリーダーで、カリスマ性と戦略的思考を持つ。目標達成に向けてチームを率い、効率的に結果を出す。',keys:['リーダーシップ','戦略的','決断力','効率重視','カリスマ'],
    study:{title:'目標志向・効率的学習',pts:['明確な目標を設定して逆算学習','グループ学習やディスカッションで理解深化','要点を押さえた効率的なインプット','学んだことをすぐに実践で活用','苦手分野も克服しようとする向上心']},
    work:{title:'経営者・プロジェクトリーダー',pts:['大局的な戦略と目標設定が得意','チームを率いて成果を最大化','非効率を見つけて改善するスピードが速い','高い基準を設定し自他に要求する','数字と結果で物事を評価する']},
    stress:{causes:['無能な人材や非効率なプロセス','コントロールを失う状況','感情的すぎる対立や批判','長期にわたる停滞や進展のなさ','自分のビジョンが理解されないこと'],
      relief:['新しい課題への挑戦','戦略計画を立てて見通しを持つ','運動や身体的な活動','信頼できる人との率直な議論','達成した成果を振り返る']},
    love:{tend:'パートナーに高い基準を持ち、共に成長できる関係を求める。頼もしいリーダーとして、愛する人を全力でサポートする。',pts:['パートナーの成長を積極的にサポート','長期的なビジョンを持った関係を望む','感情より実際の行動で愛情を示す','批判的な言動が相手を傷つけることも','相手の感情的なニーズへの配慮が必要']},

// APP STATE
let userType = null;
let answers = {};
let currentQ = 0;
let quizDone = false;

let compatType2 = null;

// ===== QUIZ LOGIC =====
function initQuiz(){
  answers={};currentQ=0;quizDone=false;
  renderQuiz();
}

function renderQuiz(){
  const area=document.getElementById('quizArea');
  if(currentQ>=QUESTIONS.length){
    finishQuiz();
    return;
  }
  const q=QUESTIONS[currentQ];
  const pct=Math.round((currentQ/QUESTIONS.length)*100);
  area.innerHTML=`
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-num">Q${currentQ+1} / ${QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="opts">
      <button class="opt-btn" onclick="answerQ('${q.av}')">A: ${q.a}</button>
      <button class="opt-btn" onclick="answerQ('${q.bv}')">B: ${q.b}</button>
    </div>
  `;
}

function answerQ(val){
  const q=QUESTIONS[currentQ];
  if(!answers[q.dim]) answers[q.dim]={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  answers[q.dim][val]=(answers[q.dim][val]||0)+1;
  currentQ++;
  renderQuiz();
}

function finishQuiz(){
  const totals={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  Object.values(answers).forEach(dimObj=>{
    Object.entries(dimObj).forEach(([k,v])=>totals[k]+=v);
  });
  userType=(totals.E>=totals.I?'E':'I')+(totals.S>=totals.N?'S':'N')+(totals.T>=totals.F?'T':'F')+(totals.J>=totals.P?'J':'P');
  quizDone=true;
  renderResult();
  updateAllSections();
}

function renderResult(){
  const t=TYPE_DATA[userType];
  if(!t) return;
  const grp=getGroup(userType);
  const color=GROUP_COLORS[grp];
  const area=document.getElementById('quizArea');
  area.innerHTML=`
    <div class="result-wrap fade-in">
      <div class="mbti-badge ${grp}-bg">${userType}</div>
      <span class="type-emoji-big">${t.emoji}</span>
      <div class="type-name-big">「${t.name}」タイプ</div>
      <div class="type-desc-text">${t.desc}</div>
      <div class="tags">${t.keys.map(k=>`<span class="tag">${k}</span>`).join('')}</div>
      <button class="retake-btn" onclick="initQuiz()">もう一度診断する</button>
    </div>
  `;
  compatType1=userType;
}

// ===== TAB SWITCHING =====
function switchTab(btn,sec){
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+sec).classList.add('active');
  renderSection(sec);
}

function renderSection(sec){
  switch(sec){
    case 'compatibility': renderCompatibility(); break;
    case 'ranking': renderRanking(); break;
    case 'study': renderStudy(); break;
    case 'stress': renderStress(); break;
    case 'love': renderLove(); break;
    case 'friends': renderFriends(); break;
  }
}

function updateAllSections(){
  compatType1=userType;
  renderCompatibility();
  renderRanking();
  renderStudy();
  renderStress();
  renderLove();
  renderFriends();
}

function typeGridHTML(selectedType,prefix,onClickFn){
  const grpOrder=[['analyst','アナリスト'],['diplomat','外交官'],['sentinel','番人'],['explorer','探検家']];
  let html='';
  grpOrder.forEach(([g,gname])=>{
    html+=`<div class="tg-group" style="grid-column:1/-1"><span class="tg-label ${g}-lbl">${gname}</span></div>`;
    GROUPS[g].forEach(t=>{
      const sel=t===selectedType?' sel':'';
      html+=`<button class="type-btn ${g}${sel}" onclick="${onClickFn}('${t}')">${t}</button>`;
    });
  });
  return html;
}

function smallTypeGrid(selectedType,onClickFn){
  let html='';
  TYPES.forEach(t=>{
    const g=getGroup(t);
    const sel=t===selectedType?' sel':'';
    html+=`<button class="sel-type-btn ${g}${sel}" onclick="${onClickFn}('${t}')">${t}</button>`;
  });
  return html;
}

  if(s>=70)return'70';
  if(s>=65)return'65';
  if(s>=60)return'60';
  return'55';
}
function scoreLabel(s){
  if(s>=90)return'💖 最高の相性';
  if(s>=80)return'💕 とても良い相性';
  if(s>=70)return'👍 良い相性';
  if(s>=60)return'🤝 普通の相性';
  return'⚡ 課題あり・成長できる相性';
}
function getScore(t1,t2){
  if(COMPAT[t1]&&COMPAT[t1][t2]!==undefined) return COMPAT[t1][t2];
  return 60;
}

// ===== COMPATIBILITY PROS/CONS GENERATOR =====
function generateCompatData(t1,t2){
  const d1={EI:t1[0],SN:t1[1],TF:t1[2],JP:t1[3]};
  const d2={EI:t2[0],SN:t2[1],TF:t2[2],JP:t2[3]};
  const pros=[],cons=[],advice=[];
  const score=getScore(t1,t2);

  // EI
  if(d1.EI!==d2.EI){
    pros.push('外向きと内向きのバランスが取れる');
    pros.push(d1.EI==='E'?'あなたがパートナーを新しい世界に引き込む':'相手があなたを外の世界へ連れ出してくれる');
    cons.push('社交的な活動量の好みが違うことがある');
    advice.push('お互いのエネルギーパターンを理解して尊重する');
  } else if(d1.EI==='E'){
    pros.push('一緒に活発に外出・交流を楽しめる');
    pros.push('会話が途切れずエネルギッシュな関係');
    cons.push('互いに話したがり、聞き手が不足しがち');
  } else {
    pros.push('二人の静かで落ち着いた時間を大切にできる');
    pros.push('深い対話と内省的な関係を楽しめる');
    cons.push('新しい出会いや変化が少なくなりがち');
  }

  // SN
  if(d1.SN!==d2.SN){
    pros.push('現実的な視点と創造的な視点が融合して補い合う');
    pros.push(d1.SN==='S'?'あなたの現実感覚が相手の夢に形を与える':'相手の実践力があなたのアイデアを実現する');
    cons.push('「現実的すぎる」vs「夢見がち」と感じることがある');
    cons.push('話が噛み合わないと感じる瞬間がある');
    advice.push('お互いの視点の違いを「補完」と捉え、強みとして活かす');
  } else if(d1.SN==='S'){
    pros.push('現実的・実践的な共通言語で話し合える');
    pros.push('今ここにある具体的なことを一緒に楽しめる');
    cons.push('新しいアイデアや革新への挑戦が少なくなりがち');
  } else {
    pros.push('未来や可能性について無限に語り合える');
    pros.push('創造的なプロジェクトで最高のパートナーに');
    cons.push('現実的な問題への対処が後回しになることがある');
  }

  // TF
  if(d1.TF!==d2.TF){
    if(d1.TF==='T'){
      pros.push('論理と感情のバランスが絶妙に取れる');
      cons.push('あなたの論理的な言動が冷たく映ることがある');
      advice.push('論理的に正しいことより、相手の気持ちを先に認める');
    } else {
      pros.push('感情と理性のバランスが取れた判断ができる');
      cons.push('相手の率直な批判に傷つくことがある');
      advice.push('相手の批判は「攻撃」ではなく「問題解決」だと理解する');
    }
  } else if(d1.TF==='T'){
    pros.push('論理的・客観的な議論が気持ちよくできる');
    pros.push('感情に流されない冷静な判断ができる');
    cons.push('感情的なケアやサポートが双方に不足することがある');
    advice.push('意識的に感謝や愛情を言葉で伝える時間を作る');
  } else {
    pros.push('感情的なつながりが非常に深い');
    pros.push('互いに共感し支え合える安心感がある');
    cons.push('難しい決断を避けたり、率直な意見を言い合えないことがある');
    advice.push('愛情があるからこそ、正直な意見を伝えることを恐れない');
  }

  // JP
  if(d1.JP!==d2.JP){
    if(d1.JP==='J'){
      pros.push('計画性と柔軟性がバランスよく補い合える');
      cons.push('あなたが計画したことを相手が変更してストレスになることがある');
      advice.push('全部計画しなくていい部分を意識的に相手に任せてみる');
    } else {
      pros.push('自由度と構造のバランスが取れた生活スタイル');
      cons.push('相手の締め切り重視にプレッシャーを感じることがある');
      advice.push('大切な締め切りや約束だけはしっかり守ることを心がける');
    }
  } else if(d1.JP==='J'){
    pros.push('計画的で安定した生活・関係を共に築ける');
    pros.push('重要な約束や目標への取り組みが揃っている');
    cons.push('臨機応変に対応することが難しいと感じることがある');
    advice.push('時には計画を外してサプライズや自発的な行動を楽しんで');
  } else {
    pros.push('柔軟で自由な、束縛のない関係が築ける');
    pros.push('新しい体験や変化を共に楽しめる');
    cons.push('重要なことを先延ばしにしがちになる');
    advice.push('共通の目標や締め切りを設けて、互いに責任感を持つ');
  }

  // score based advice
  if(score>=88){
    advice.push('この組み合わせは自然なケミストリーがある。お互いを信じて！');
  } else if(score>=78){
    advice.push('違いを理解し尊重し合えば、とても豊かな関係が築ける');
  } else if(score>=65){
    advice.push('コミュニケーションを丁寧に積み重ねることで良い関係に育つ');
  } else {
    advice.push('意識的な努力が必要だが、その分大きく成長できる関係');
    advice.push('違いを批判せず、相手の価値観を学ぶ姿勢を大切に');
  }

  // Golden pair bonus
  const goldenBonuses={
    'INFJ-ENTP':'補完的な認知機能を持つ最高のペア。INFJの深い洞察とENTPの論理的な挑戦が見事に噛み合う。',
    'ENTP-INFJ':'INFJの深い洞察とENTPの論理的な挑戦が見事に噛み合う。',
    'INTJ-ENFP':'ENFPの情熱がINTJのビジョンを燃え上がらせ、INTJの戦略がENFPの夢を実現する。',
    'ENFP-INTJ':'ENFPの情熱がINTJのビジョンを燃え上がらせ、INTJの戦略がENFPの夢を実現する。',
    'INFP-ENFJ':'ENFJの温かいサポートがINFPの才能を開花させ、INFPの深さがENFJに新たな意味をもたらす。',
    'ENFJ-INFP':'ENFJの温かいサポートがINFPの才能を開花させる。',
    'INTP-ENTJ':'INTPの革新的な理論をENTJが実現する最強の知的コンビ。',
    'ENTJ-INTP':'INTPの革新的な理論をENTJが実現する最強の知的コンビ。',
    'ISFJ-ESFP':'ESFPがISFJに新鮮な体験をもたらし、ISFJがESFPに安心と安定を提供する。',
    'ESFP-ISFJ':'ISFJの安心感とESFPの活気が見事に融合する。',
  };
  const bonusKey=`${t1}-${t2}`;
  if(goldenBonuses[bonusKey]){
    advice.unshift('⭐ '+goldenBonuses[bonusKey]);
  }

  return {pros,cons,advice};
}
