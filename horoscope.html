<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 星座占い</title>
<style>
:root{
  --bg:#06060f;--surf:rgba(255,255,255,.04);--surf2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.15);
  --text:#eceeff;--muted:#7880a8;--muted2:#a0a8cc;
  --gold:#f6c94e;--gold2:#e89b20;
  --p:#9d7dfc;--p2:#d46eea;--p3:#56c8f5;
  --green:#34d399;--pink:#f472b6;--orange:#fb923c;
  --r5:#fbbf24;--r4:#a78bfa;--r3:#38bdf8;--r2:#94a3b8;--r1:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}

/* ── STARFIELD ── */
#stars-canvas{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  width:100%;height:100%;
}

/* ── NEBULA ORBS ── */
.nebula{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.nb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.12;animation:nb-drift 20s ease-in-out infinite}
.nb1{width:700px;height:700px;background:radial-gradient(#7c3aed,transparent 70%);top:-200px;left:-200px}
.nb2{width:600px;height:600px;background:radial-gradient(#be185d,transparent 70%);bottom:-150px;right:-150px;animation-delay:-8s}
.nb3{width:500px;height:500px;background:radial-gradient(#0e7490,transparent 70%);top:30%;left:40%;animation-delay:-14s;opacity:.09}
@keyframes nb-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}

/* ── LAYOUT ── */
.wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:20px 18px 60px}

/* ── HEADER ── */
header{text-align:center;padding:50px 0 36px}
.h-date{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(246,201,78,.08);border:1px solid rgba(246,201,78,.2);
  color:var(--gold);border-radius:50px;padding:6px 20px;
  font-size:.8rem;font-weight:700;letter-spacing:.08em;margin-bottom:18px;
}
h1{
  font-size:clamp(2rem,6vw,3rem);font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(130deg,#d4bbff 0%,#f9a8fa 40%,#fcd68a 80%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;
}
.h-sub{color:var(--muted2);font-size:.97rem;line-height:1.7}

/* ── SIGN SELECTOR ── */
.selector-title{
  text-align:center;font-size:.8rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:18px;
}
.sign-grid{
  display:grid;grid-template-columns:repeat(6,1fr);
  gap:10px;margin-bottom:40px;
}
.sign-btn{
  background:var(--surf);border:1px solid var(--border);
  border-radius:16px;padding:14px 6px 10px;
  cursor:pointer;text-align:center;
  transition:all .22s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.sign-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(157,125,252,.1),rgba(212,110,234,.07));
  opacity:0;transition:opacity .22s;pointer-events:none;
}
.sign-btn:hover::before{opacity:1}
.sign-btn:hover{border-color:rgba(157,125,252,.35);transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
.sign-btn.active{
  background:linear-gradient(135deg,rgba(157,125,252,.2),rgba(212,110,234,.15));
  border-color:var(--p);
  box-shadow:0 0 0 2px rgba(157,125,252,.3),0 10px 32px rgba(0,0,0,.4);
  transform:translateY(-4px);
}
.sign-glyph{font-size:1.6rem;line-height:1}
.sign-name{font-size:.68rem;font-weight:700;color:var(--muted2);line-height:1;letter-spacing:.02em}
.sign-date{font-size:.58rem;color:var(--muted);line-height:1}
.sign-btn.active .sign-name{color:var(--text)}

/* ── RESULT SECTION ── */
#result{
  display:none;
  animation:fade-up .55s cubic-bezier(.22,1,.36,1) both;
}
#result.show{display:block}
@keyframes fade-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

/* Hero card */
.r-hero{
  background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.025));
  border:1px solid var(--border2);border-radius:28px;
  padding:40px 30px 32px;margin-bottom:16px;
  text-align:center;position:relative;overflow:hidden;
}
.r-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% -10%,rgba(157,125,252,.18),transparent 65%);
  pointer-events:none;
}
.r-hero-top{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px}
.r-hero-date{
  font-size:.78rem;color:var(--muted2);font-weight:600;
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:50px;padding:4px 14px;
}
.r-glyph{font-size:5.5rem;line-height:1;margin-bottom:6px;display:block;
  filter:drop-shadow(0 0 24px rgba(157,125,252,.6));
  animation:glyph-float 4s ease-in-out infinite;
}
@keyframes glyph-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.04)}}
.r-sign-name{
  font-size:2rem;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(130deg,#c4b8ff,#f0a8f8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px;
}
.r-sign-en{font-size:.88rem;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}

/* Overall stars */
.r-overall-stars{
  display:flex;gap:6px;justify-content:center;margin-bottom:8px;
}
.star-icon{font-size:1.8rem;animation:star-pop .3s ease both}
@keyframes star-pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0deg)}}
.r-overall-score{font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:14px}
.r-overall-msg{
  font-size:1rem;color:var(--muted2);line-height:1.75;
  max-width:480px;margin:0 auto 24px;
}

/* Today's word */
.r-word{
  display:inline-block;
  background:linear-gradient(135deg,rgba(246,201,78,.12),rgba(251,146,60,.08));
  border:1px solid rgba(246,201,78,.25);
  border-radius:14px;padding:12px 28px;
  font-size:.95rem;font-weight:700;color:var(--gold);
  letter-spacing:.04em;
}

/* Fortune grid */
.fortune-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.f-card{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:20px;padding:22px 20px;
  position:relative;overflow:hidden;transition:transform .2s;
}
.f-card:hover{transform:translateY(-3px)}
.f-card::before{content:'';position:absolute;inset:0;opacity:.06;pointer-events:none}
.f-card.love::before{background:radial-gradient(circle at 100% 0%,#f472b6,transparent 70%)}
.f-card.work::before{background:radial-gradient(circle at 100% 0%,#60a5fa,transparent 70%)}
.f-card.money::before{background:radial-gradient(circle at 100% 0%,#34d399,transparent 70%)}
.f-card.spirit::before{background:radial-gradient(circle at 100% 0%,#a78bfa,transparent 70%)}
.fc-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
}
.fc-label{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em}
.fc-icon{font-size:1.1rem}
.fc-stars{display:flex;gap:2px}
.fc-star{font-size:.95rem}
.fc-star.on{filter:drop-shadow(0 0 3px currentColor)}
.fc-msg{font-size:.86rem;color:var(--muted2);line-height:1.7}

/* Lucky section */
.lucky-section{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:20px;padding:24px 22px;margin-bottom:16px;
}
.lucky-title{
  font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.lucky-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lucky-item{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:14px;padding:16px 10px;text-align:center;
}
.lucky-em{font-size:1.5rem;margin-bottom:6px}
.lucky-label{font-size:.67rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.lucky-val{font-size:.9rem;font-weight:700;color:var(--text);line-height:1.3}
.lucky-color-dot{
  width:28px;height:28px;border-radius:50%;margin:0 auto 6px;
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 0 12px var(--dot-color,#fff);
}

/* Daily message */
.daily-msg{
  background:linear-gradient(135deg,rgba(157,125,252,.08),rgba(212,110,234,.05));
  border:1px solid rgba(157,125,252,.2);
  border-radius:20px;padding:22px 24px;margin-bottom:16px;
  position:relative;overflow:hidden;
}
.daily-msg::before{
  content:'"';position:absolute;top:-10px;left:14px;
  font-size:5rem;color:rgba(157,125,252,.12);font-family:Georgia,serif;line-height:1;
}
.dm-head{font-size:.75rem;font-weight:700;color:var(--p);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.dm-text{font-size:.95rem;color:var(--muted2);line-height:1.8;font-style:italic;padding-left:4px}

/* Star colors */
.s5{color:var(--gold)}
.s4{color:#c4b5fd}
.s3{color:#7dd3fc}
.s2{color:#94a3b8}
.s1{color:#4b5563}

/* Back btn */
.back-btn{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:var(--muted2);border-radius:12px;padding:11px 22px;
  font-size:.88rem;font-weight:600;cursor:pointer;
  width:fit-content;margin-bottom:28px;
  transition:all .2s;
}
.back-btn:hover{border-color:var(--border2);color:var(--text);background:rgba(255,255,255,.08)}

/* Divider */
.div-line{height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent);margin:28px 0}

@media(max-width:600px){
  .sign-grid{grid-template-columns:repeat(4,1fr)}
  .fortune-grid{grid-template-columns:1fr}
  .lucky-grid{grid-template-columns:repeat(3,1fr)}
  header{padding:36px 0 26px}
  .r-hero{padding:30px 18px 24px}
}
@media(max-width:420px){
  .sign-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div class="nebula"><div class="nb nb1"></div><div class="nb nb2"></div><div class="nb nb3"></div></div>

<div class="wrap">

  </div><!-- /result -->

</div><!-- /wrap -->

<script>
/* ══════════════════════════════════════════════
   STARFIELD
══════════════════════════════════════════════ */
(function(){
  const c=document.getElementById('stars-canvas');
  const ctx=c.getContext('2d');
  let stars=[];
  function resize(){c.width=innerWidth;c.height=innerHeight;initStars()}
  function initStars(){
    stars=[];
    const n=Math.floor(c.width*c.height/5000);
    for(let i=0;i<n;i++){
      stars.push({
        x:Math.random()*c.width,y:Math.random()*c.height,
        r:Math.random()*1.5+.2,
        a:Math.random(),da:(Math.random()-.5)*.005+.002,
        speed:Math.random()*.06+.02,phase:Math.random()*Math.PI*2
      });
    }
  }
  let t=0;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    t+=.016;
    stars.forEach(s=>{
      s.a+=s.da;
      if(s.a>1){s.a=1;s.da=-Math.abs(s.da)}
      if(s.a<.05){s.a=.05;s.da=Math.abs(s.da)}
      const tw=Math.sin(t*s.speed+s.phase)*.4+.6;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,210,255,${s.a*tw})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();draw();
})();

/* ══════════════════════════════════════════════
   SEEDED RNG (Mulberry32)
══════════════════════════════════════════════ */
function createRng(seed){
  let s=seed>>>0;
  return ()=>{
    s+=0x6d2b79f5;
    let t=s;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/0xffffffff;
  };
}

function dateSeed(){
  const d=new Date();
  return d.getFullYear()*10000+((d.getMonth()+1)*100)+d.getDate();
}

function pick(rng,arr){return arr[Math.floor(rng()*arr.length)]}
function pickN(rng,arr,n){
  const cp=[...arr];const out=[];
  for(let i=0;i<n&&cp.length;i++){
    const idx=Math.floor(rng()*cp.length);
    out.push(cp.splice(idx,1)[0]);
  }
  return out;
}

function starsHtml(n,size=''){
  const colors=['','#4b5563','#94a3b8','#7dd3fc','#c4b5fd','#fbbf24'];
  let h='';
  for(let i=1;i<=5;i++){
    const on=i<=n;
    h+=`<span class="fc-star${on?' on':''}" style="${on?'color:'+colors[n]:'color:#2d3748'}">${on?'★':'☆'}</span>`;
  }
  return h;
}

function bigStarsHtml(n){
  const colors=['','#4b5563','#94a3b8','#7dd3fc','#c4b5fd','#fbbf24'];
  const labels=['','★','★★','★★★','★★★★','★★★★★'];
  return{
    html:[...Array(5)].map((_,i)=>{
      const on=i<n;
      const delay=i*.08+'s';
      return `<span class="star-icon" style="color:${on?colors[n]:'#1f2937'};animation-delay:${delay}">${on?'★':'☆'}</span>`;
    }).join(''),
    label:labels[n]+`（${n}/5）`,
  };
}

function showFortune(idx,btn){

  document.querySelectorAll('.sign-btn').forEach(b=>b.classList.remove('active'));

  const sign=SIGNS[idx];
  const seed=dateSeed()*31+idx*7919;
  const rng=createRng(seed);

  // Generate scores (1-5)
  const scores={
    overall:Math.floor(rng()*5)+1,
    love:Math.floor(rng()*5)+1,
    work:Math.floor(rng()*5)+1,
    money:Math.floor(rng()*5)+1,
    spirit:Math.floor(rng()*5)+1,
  };

  // Pick messages based on score (index 0-4 → score 1-5)
  const omsg=pick(rng,MSGS_OVERALL[scores.overall-1]);
  const lmsg=pick(rng,MSGS_LOVE[scores.love-1]);
  const wmsg=pick(rng,MSGS_WORK[scores.work-1]);
  const mmsg=pick(rng,MSGS_MONEY[scores.money-1]);
  const smsg=pick(rng,MSGS_SPIRIT[scores.spirit-1]);
  const word=pick(rng,WORDS);
  const item=pick(rng,LUCKY_ITEMS);
  const color=pick(rng,LUCKY_COLORS);
  const num=Math.floor(rng()*99)+1;
  const dmsg=pick(rng,DAILY_MSGS);

  // Render hero
  document.getElementById('rDate').textContent=dateStr;
  document.getElementById('rGlyph').textContent=sign.glyph;
  document.getElementById('rName').textContent=sign.name;
  document.getElementById('rEn').textContent=sign.en+' ／ '+sign.planet+'支配';

  const ob=bigStarsHtml(scores.overall);
  document.getElementById('rStars').innerHTML=ob.html;
  document.getElementById('rScore').textContent='総合運 '+ob.label;
  document.getElementById('rMsg').textContent=omsg;
  document.getElementById('rWord').textContent='今日のキーワード：「'+word+'」';

  // Fortune cards
  document.getElementById('loveStars').innerHTML=starsHtml(scores.love);
  document.getElementById('loveMsg').textContent=lmsg;
  document.getElementById('workStars').innerHTML=starsHtml(scores.work);
  document.getElementById('workMsg').textContent=wmsg;
  document.getElementById('moneyStars').innerHTML=starsHtml(scores.money);
  document.getElementById('moneyMsg').textContent=mmsg;
  document.getElementById('spiritStars').innerHTML=starsHtml(scores.spirit);
  document.getElementById('spiritMsg').textContent=smsg;

  // Lucky
  document.getElementById('lItem').textContent=item.e;
  document.getElementById('lItemVal').textContent=item.name;
  const dot=document.getElementById('lColorDot');
  dot.style.background=color.hex;
  dot.style.setProperty('--dot-color',color.hex+'80');
  document.getElementById('lColorVal').textContent=color.name;
  document.getElementById('lNumVal').textContent=num;

  // Daily message
  document.getElementById('dailyMsg').textContent=dmsg;

  // Show result
  const res=document.getElementById('result');

  res.classList.add('show');

  // Scroll

    res.scrollIntoView({behavior:'smooth',block:'start'});
  },50);
}
