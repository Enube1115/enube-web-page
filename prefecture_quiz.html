<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>都道府県クイズ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* ── Screens ─────────────────────────────────────── */
        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        /* ── START ───────────────────────────────────────── */
        #start-screen {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
            background: radial-gradient(ellipse at 50% 0%, rgba(58,123,213,0.18) 0%, transparent 70%);
        }
        .start-icon { font-size: 72px; margin-bottom: 20px; filter: drop-shadow(0 0 30px rgba(58,123,213,0.5)); }
        .start-title { font-size: 34px; font-weight: 800; letter-spacing: 0.12em; margin-bottom: 6px; }
        .start-sub { font-size: 15px; color: #607d8b; margin-bottom: 52px; }
        .start-btn {
            background: linear-gradient(135deg, #3a7bd5 0%, #5c35b0 100%);
            color: #fff;
            border: none;
            padding: 17px 64px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.12em;
            box-shadow: 0 6px 32px rgba(58,123,213,0.5);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 40px rgba(58,123,213,0.65); }
        .start-btn:active { transform: translateY(0); }
        .hs-badge {
            margin-top: 32px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 14px;
            color: #90a4ae;
        }
        .hs-badge .hs-val { color: #ffd54f; font-weight: 700; }

        /* ── QUIZ ────────────────────────────────────────── */
        #quiz-screen { padding: 14px 12px 28px; }

        .hud {
            width: 100%;
            max-width: 660px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 5px 13px;
            font-size: 13px;
            white-space: nowrap;
        }
        .pill b { font-size: 16px; font-weight: 800; }
        .pill.c b { color: #66bb6a; }
        .pill.w b { color: #ef5350; }
        .pill.a b { color: #ffd54f; }
        .prog-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .prog-bar {
            height: 100%;
            background: linear-gradient(90deg, #3a7bd5, #7c4dff);
            border-radius: 3px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .q-num { font-size: 12px; color: #546e7a; white-space: nowrap; }

        /* Question card */
        .q-card {
            width: 100%;
            max-width: 660px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, rgba(58,123,213,0.15), rgba(124,77,255,0.12));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 20px 100px 20px 28px;
            position: relative;
            overflow: hidden;
        }
        .q-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20px;
            width: 140px;
            height: 200%;
            background: rgba(255,255,255,0.02);
            transform: rotate(15deg);
        }
        .q-eyebrow { font-size: 11px; letter-spacing: 0.12em; color: #546e7a; text-transform: uppercase; margin-bottom: 4px; }
        .q-main { font-size: 38px; font-weight: 900; letter-spacing: 0.06em; line-height: 1.1; }
        .q-sub { font-size: 14px; color: #78909c; margin-top: 3px; min-height: 19px; }
        .q-feedback {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0.04em;
            opacity: 0;
            transition: opacity 0.18s;
            text-align: center;
            line-height: 1.3;
        }
        .q-feedback.show { opacity: 1; }
        .q-feedback.ok  { color: #66bb6a; }
        .q-feedback.ng  { color: #ef5350; }

        /* Map */
        .map-wrap { position: relative; width: 100%; max-width: 660px; }
        #japan-map { width: 100%; height: auto; display: block; }

        /* Prefecture states */
        .prefecture {
            cursor: pointer;
            stroke: rgba(255,255,255,0.55);
            stroke-width: 1;
            transition: fill 0.2s, filter 0.15s;
        }
        /* Browse hover */
        .prefecture:hover {
            stroke: #fff;
            stroke-width: 1.8;
            filter: brightness(1.35) drop-shadow(0 0 4px rgba(255,255,255,0.3));
        }
        /* Region colors (browse / after quiz) */
        .hokkaido { fill: #3a7bd5; }
        .tohoku   { fill: #27ae60; }
        .kanto    { fill: #b8860b; }
        .chubu    { fill: #8e44ad; }
        .kinki    { fill: #c0392b; }
        .chugoku  { fill: #16a085; }
        .shikoku  { fill: #d35400; }
        .kyushu   { fill: #c2185b; }
        .okinawa  { fill: #0097a7; }

        /* Quiz mode — flatten all colors */
        body.quiz .prefecture          { fill: #243c59 !important; stroke: rgba(255,255,255,0.35); }
        body.quiz .prefecture:hover    { fill: #3b5a82 !important; stroke: rgba(255,255,255,0.7); filter: none; }
        body.quiz .prefecture.ok       { fill: #2e7d32 !important; filter: brightness(1.6) drop-shadow(0 0 8px #4caf50); }
        body.quiz .prefecture.ng       { fill: #b71c1c !important; filter: brightness(1.4) drop-shadow(0 0 8px #f44336); }
        body.quiz .prefecture.reveal   { fill: #1b5e20 !important; filter: brightness(1.5) drop-shadow(0 0 10px #69f0ae); }

        /* Tooltip */
        #tooltip {
            position: fixed;
            background: rgba(5,20,35,0.92);
            color: #fff;
            padding: 7px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }

        /* ── RESULT ──────────────────────────────────────── */
        #result-screen {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .r-card {
            background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 42px 44px 36px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            animation: popIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes popIn {
            from { transform: scale(0.75) translateY(20px); opacity: 0; }
            to   { transform: scale(1) translateY(0);       opacity: 1; }
        }
        .r-grade {
            font-size: 80px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 6px;
        }
        .r-grade.S { color: #ffd54f; text-shadow: 0 0 32px rgba(255,213,79,0.7); }
        .r-grade.A { color: #aed581; text-shadow: 0 0 28px rgba(174,213,129,0.6); }
        .r-grade.B { color: #4fc3f7; text-shadow: 0 0 28px rgba(79,195,247,0.5); }
        .r-grade.C { color: #f48fb1; }
        .r-grade.D { color: #ef9a9a; }
        .r-msg { font-size: 15px; color: #78909c; margin-bottom: 30px; }
        .r-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .r-stat {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px 6px;
        }
        .r-stat-val { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
        .r-stat-lbl { font-size: 11px; color: #607d8b; letter-spacing: 0.05em; }
        .r-stat.c .r-stat-val { color: #66bb6a; }
        .r-stat.w .r-stat-val { color: #ef5350; }
        .r-stat.a .r-stat-val { color: #ffd54f; }
        .r-wrong-lbl { font-size: 12px; color: #546e7a; text-align: left; margin-bottom: 10px; }
        .r-wrong-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 28px; }
        .r-tag {
            background: rgba(244,67,54,0.12);
            border: 1px solid rgba(244,67,54,0.28);
            border-radius: 8px;
            padding: 4px 11px;
            font-size: 13px;
            color: #ef9a9a;
        }
        .r-perfect {
            font-size: 14px;
            color: #ffd54f;
            margin-bottom: 28px;
            letter-spacing: 0.06em;
        }
        .r-actions { display: flex; gap: 12px; justify-content: center; }
        .r-btn {
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.06em;
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .r-btn:hover { transform: translateY(-2px); }
        .r-btn.primary {
            background: linear-gradient(135deg, #3a7bd5, #5c35b0);
            color: #fff;
            box-shadow: 0 4px 22px rgba(58,123,213,0.45);
        }
        .r-btn.primary:hover { box-shadow: 0 8px 32px rgba(58,123,213,0.6); }
        .r-btn.ghost {
            background: rgba(255,255,255,0.07);
            color: #b0bec5;
            border: 1px solid rgba(255,255,255,0.12);
        }

        /* ── Legend (result screen) ──────────────────────── */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-top: 14px;
            justify-content: center;
            font-size: 12px;
            color: #546e7a;
        }
        .l-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 2px;
            margin-right: 4px;
            vertical-align: middle;
        }
    </style>
</head>

        <span><span class="l-dot" style="background:#3a7bd5"></span>北海道</span>
        <span><span class="l-dot" style="background:#27ae60"></span>東北</span>
        <span><span class="l-dot" style="background:#b8860b"></span>関東</span>
        <span><span class="l-dot" style="background:#8e44ad"></span>中部</span>
        <span><span class="l-dot" style="background:#c0392b"></span>近畿</span>
        <span><span class="l-dot" style="background:#16a085"></span>中国</span>
        <span><span class="l-dot" style="background:#d35400"></span>四国</span>
        <span><span class="l-dot" style="background:#c2185b"></span>九州</span>
        <span><span class="l-dot" style="background:#0097a7"></span>沖縄</span>
    </div>
</div>

<div id="tooltip"></div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const TOTAL = 47;
const LS_KEY = 'pref_quiz_hs';

// ── State ──────────────────────────────────────────────────────────────────
let queue        = [];
let idx          = 0;
let okCount      = 0;
let ngCount      = 0;
let missedNames  = [];
let busy         = false;
let highscore    = parseInt(localStorage.getItem(LS_KEY) || '0', 10);

const prefEls = Array.from(document.querySelectorAll('.prefecture'));

// ── Utilities ──────────────────────────────────────────────────────────────
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function grade(acc) {
    if (acc >= 95) return { g: 'S', msg: '完璧！地理の達人だ！' };
    if (acc >= 80) return { g: 'A', msg: 'すばらしい実力！' };
    if (acc >= 65) return { g: 'B', msg: 'なかなかの健闘！あと一歩！' };
    if (acc >= 50) return { g: 'C', msg: 'もう少し練習しよう！' };
    return             { g: 'D', msg: '地図を見直して再挑戦！' };
}

// ── Quiz flow ──────────────────────────────────────────────────────────────
function startQuiz() {
    queue       = shuffle(prefEls);
    idx         = 0;
    okCount     = 0;
    ngCount     = 0;
    missedNames = [];
    busy        = false;

    document.body.classList.add('quiz');
    show('quiz-screen');
    updateHUD();
    ask();
}

function ask() {
    if (idx >= TOTAL) { finish(); return; }

    const t = queue[idx];
    document.getElementById('q-main').textContent = t.dataset.name;
    document.getElementById('q-sub').textContent  = t.dataset.roman;
    document.getElementById('q-num').textContent  = `${idx + 1} / ${TOTAL}`;
    document.getElementById('prog').style.width   = `${(idx / TOTAL) * 100}%`;

    const fb = document.getElementById('q-fb');
    fb.className  = 'q-feedback';
    fb.textContent = '';
    busy = false;
}

function updateHUD() {
    document.getElementById('h-ok').textContent  = okCount;
    document.getElementById('h-ng').textContent  = ngCount;
    const done = okCount + ngCount;
    document.getElementById('h-acc').textContent = done ? Math.round(okCount / done * 100) + '%' : '—';
}

function answer(clicked) {
    if (busy) return;
    busy = true;

    const target   = queue[idx];
    const correct  = clicked === target;
    const fb       = document.getElementById('q-fb');

    if (correct) {
        okCount++;
        fb.textContent = '正解！';
        fb.className   = 'q-feedback ok show';
        clicked.classList.add('ok');
        setTimeout(() => {
            clicked.classList.remove('ok');
            idx++;
            updateHUD();
            ask();
        }, 650);
    } else {
        ngCount++;
        missedNames.push(target.dataset.name);
        fb.textContent = `不正解…\n→ ${target.dataset.name}`;
        fb.className   = 'q-feedback ng show';
        clicked.classList.add('ng');
        target.classList.add('reveal');
        setTimeout(() => {
            clicked.classList.remove('ng');
            target.classList.remove('reveal');
            idx++;
            updateHUD();
            ask();
        }, 1200);
    }
}

function finish() {
    document.body.classList.remove('quiz');
    document.getElementById('prog').style.width = '100%';

    const acc = Math.round(okCount / TOTAL * 100);
    if (okCount > highscore) {
        highscore = okCount;
        localStorage.setItem(LS_KEY, highscore);
    }

    const { g, msg } = grade(acc);
    const gradeEl = document.getElementById('r-grade');
    gradeEl.textContent = g;
    gradeEl.className   = `r-grade ${g}`;
    document.getElementById('r-msg').textContent  = msg;
    document.getElementById('r-ok').textContent   = okCount;
    document.getElementById('r-ng').textContent   = ngCount;
    document.getElementById('r-acc').textContent  = acc + '%';

    const tagsEl   = document.getElementById('r-wrong-tags');
    const secEl    = document.getElementById('r-wrong-section');
    const perfEl   = document.getElementById('r-perfect');
    tagsEl.innerHTML = '';

    if (missedNames.length === 0) {
        secEl.style.display  = 'none';
        perfEl.style.display = '';
    } else {
        secEl.style.display  = '';
        perfEl.style.display = 'none';
        missedNames.forEach(name => {
            const tag = document.createElement('span');
            tag.className   = 'r-tag';
            tag.textContent = name;
            tagsEl.appendChild(tag);
        });
    }

    show('result-screen');
}

function goStart() {
    document.body.classList.remove('quiz');

    const hsVal = document.getElementById('hs-val');
    const hsBadge = document.getElementById('hs-badge');
    if (highscore > 0) {
        hsVal.textContent  = highscore;
        hsBadge.style.display = '';
    }
    show('start-screen');
}

// ── Tooltip & click binding ────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

prefEls.forEach(el => {
    el.addEventListener('mouseenter', () => {
        if (!document.body.classList.contains('quiz')) {
            tooltip.textContent = `${el.dataset.name}（${el.dataset.roman}）`;
            tooltip.style.display = 'block';
        }
    });
    el.addEventListener('mousemove', e => {
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top  = (e.clientY - 38) + 'px';
    });
    el.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
    });
    el.addEventListener('click', () => {
        if (document.body.classList.contains('quiz')) answer(el);
    });
});

// ── Init high score ────────────────────────────────────────────────────────
if (highscore > 0) {
    document.getElementById('hs-val').textContent   = highscore;
    document.getElementById('hs-badge').style.display = '';
}
</script>
</body>
</html>
