<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚡ 反応速度テスト</title>
<style>
:root{
  --bg:#06080f;--surf:rgba(255,255,255,.05);--surf2:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.18);
  --text:#eceeff;--muted:#6878a8;--muted2:#96a0c8;
  --p:#7c6ffc;--p2:#e963c8;--p3:#38c9f5;
  --gold:#f6c94e;--green:#22d3a0;--red:#f87171;--orange:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{font-family:'Segoe UI',system-ui,sans-serif;touch-action:manipulation}

/* ── BG CANVAS ── */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── MAIN CLICK ZONE ── */
#zone{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s;
  overflow:hidden;
}

/* State backgrounds */
#zone.state-idle    {background:transparent;cursor:default}
#zone.state-waiting {background:rgba(6,8,15,.92);cursor:pointer}
#zone.state-active  {background:#0aff9d;cursor:pointer;animation:flashPulse .12s ease-out}
#zone.state-early   {background:#ff2d55;cursor:pointer;animation:shakePulse .35s ease}
#zone.state-done    {background:transparent;cursor:default}
#zone.state-ranking {background:transparent;cursor:default}

@keyframes flashPulse{
  0%{background:#ffffff}
  40%{background:#0aff9d}
  100%{background:#0aff9d}
}
@keyframes shakePulse{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-8px)}
  80%{transform:translateX(8px)}
}

/* ── SCREENS ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;pointer-events:none;opacity:0;transition:opacity .3s}
.screen.show{pointer-events:auto;opacity:1}
.screen.no-ptr{pointer-events:none}

/* ── IDLE SCREEN ── */
.idle-card{
  background:linear-gradient(145deg,rgba(15,18,35,.95),rgba(20,25,50,.9));
  border:1px solid var(--border2);border-radius:28px;padding:44px 36px;
  max-width:460px;width:100%;text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  position:relative;overflow:hidden;
}
.idle-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(124,111,252,.15),transparent 60%);
  pointer-events:none;
}
.idle-icon{font-size:4.5rem;display:block;margin-bottom:14px;animation:iconFloat 3s ease-in-out infinite}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.idle-title{
  font-size:2rem;font-weight:900;letter-spacing:-.04em;margin-bottom:10px;
  background:linear-gradient(130deg,#b0b8ff,#f0a8fa,#7ee8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.idle-sub{color:var(--muted2);font-size:.95rem;line-height:1.7;margin-bottom:24px}
.idle-rules{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:14px;padding:16px 18px;margin-bottom:28px;text-align:left;
}
.idle-rule{
  display:flex;align-items:flex-start;gap:10px;font-size:.85rem;color:var(--muted2);
  padding:6px 0;
}
.idle-rule:not(:last-child){border-bottom:1px solid var(--border)}
.idle-rule-num{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;font-size:.72rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}

.btn-start{
  width:100%;background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;border:none;border-radius:16px;padding:18px;
  font-size:1.1rem;font-weight:800;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 8px 32px rgba(124,111,252,.4);
  transition:transform .2s,box-shadow .2s;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(124,111,252,.55)}
.btn-start:active{transform:scale(.97)}

.idle-stats{
  margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
}
.idle-stat{
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:10px;padding:8px 16px;text-align:center;min-width:80px;
}
.is-val{font-size:1.1rem;font-weight:800;color:var(--p3)}
.is-label{font-size:.68rem;color:var(--muted);margin-top:1px}

/* ── WAITING SCREEN ── */
.wait-center{text-align:center}
.wait-round{
  font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:20px;
}
.wait-dots{display:flex;gap:10px;justify-content:center;margin-bottom:40px}
.w-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--border2);transition:background .3s;
}
.w-dot.done{background:var(--green)}
.w-dot.active{background:var(--p3);box-shadow:0 0 12px var(--p3);animation:dotPulse 1s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.wait-icon{
  font-size:4rem;margin-bottom:16px;opacity:.6;
  animation:waitBreath 2s ease-in-out infinite;
}
@keyframes waitBreath{0%,100%{opacity:.3;transform:scale(.95)}50%{opacity:.8;transform:scale(1.05)}}
.wait-text{font-size:1.1rem;color:var(--muted2);font-weight:600}

/* ── ACTIVE SCREEN ── */
.active-center{text-align:center;pointer-events:none}
.active-now{
  font-size:clamp(3.5rem,12vw,7rem);font-weight:900;
  color:#001a0d;letter-spacing:-.04em;line-height:1;margin-bottom:8px;
  text-shadow:0 4px 20px rgba(0,0,0,.3);
  animation:nowPop .1s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes nowPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.active-sub{font-size:1.1rem;color:rgba(0,26,13,.7);font-weight:700}

/* ── EARLY SCREEN ── */
.early-center{text-align:center}
.early-icon{font-size:4rem;margin-bottom:10px;animation:earlyBounce .4s ease}
@keyframes earlyBounce{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.early-title{font-size:2rem;font-weight:900;color:#fff;margin-bottom:8px}
.early-sub{font-size:1rem;color:rgba(255,255,255,.75)}
.early-tap{font-size:.85rem;color:rgba(255,255,255,.5);margin-top:20px;animation:tapBlink 1s ease-in-out infinite}
@keyframes tapBlink{0%,100%{opacity:.4}50%{opacity:1}}

/* ── DONE / RESULTS ── */
.results-wrap{
  max-width:500px;width:100%;max-height:90vh;overflow-y:auto;
  scrollbar-width:none;
}
.results-wrap::-webkit-scrollbar{display:none}
.results-card{
  background:linear-gradient(145deg,rgba(15,18,35,.97),rgba(20,25,50,.95));
  border:1px solid var(--border2);border-radius:28px;padding:36px 28px;
  text-align:center;margin:0 auto;
  box-shadow:0 24px 80px rgba(0,0,0,.7);
  position:relative;overflow:hidden;
}
.results-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(34,211,160,.12),transparent 60%);
  pointer-events:none;
}
.res-badge{
  display:inline-block;
  background:linear-gradient(135deg,var(--gold),#f97316);
  color:#000;font-size:.75rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 18px;border-radius:50px;margin-bottom:16px;
}
.res-icon{font-size:4rem;display:block;margin-bottom:8px}
.res-rating{
  font-size:1.5rem;font-weight:900;margin-bottom:6px;
  background:linear-gradient(130deg,#a8ffdf,#6ee7ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.res-avg{
  font-size:4.5rem;font-weight:900;letter-spacing:-.04em;color:var(--green);
  margin:10px 0 4px;text-shadow:0 0 40px rgba(34,211,160,.5);
  animation:avgPop .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes avgPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.res-avg-label{font-size:.88rem;color:var(--muted2);margin-bottom:24px}

/* Round times */
.round-times{
  display:flex;flex-direction:column;gap:8px;margin-bottom:24px;
}
.rt-item{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:12px;padding:10px 16px;
  animation:rtSlide .4s ease both;
}
@keyframes rtSlide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.rt-round{font-size:.75rem;color:var(--muted);font-weight:700;flex-shrink:0;min-width:52px;text-align:left}
.rt-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.rt-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--p3));transition:width 1s ease}
.rt-time{font-size:.9rem;font-weight:800;color:var(--text);min-width:70px;text-align:right}
.rt-best{font-size:.65rem;background:var(--gold);color:#000;border-radius:4px;padding:1px 6px;font-weight:800;margin-left:4px}

/* Stats row */
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.res-stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.rs-val{font-size:1.15rem;font-weight:800;color:var(--p3)}
.rs-label{font-size:.68rem;color:var(--muted);margin-top:2px}

/* Action buttons */
.res-btns{display:flex;gap:10px;margin-top:4px}
.btn-again{
  flex:2;background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;border:none;border-radius:14px;padding:15px;
  font-size:1rem;font-weight:800;cursor:pointer;
  box-shadow:0 6px 24px rgba(124,111,252,.35);transition:transform .2s,opacity .2s;
}
.btn-again:hover{transform:translateY(-2px);opacity:.9}
.btn-rank{
  flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border2);
  color:var(--muted2);border-radius:14px;padding:15px;
  font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;
}
.btn-rank:hover{color:var(--text);border-color:var(--gold);background:rgba(246,201,78,.08)}

/* ── RANKING SCREEN ── */
.ranking-card{
  background:linear-gradient(145deg,rgba(15,18,35,.97),rgba(20,25,50,.95));
  border:1px solid var(--border2);border-radius:28px;padding:32px 24px;
  max-width:460px;width:100%;max-height:90vh;overflow-y:auto;
  scrollbar-width:none;
  box-shadow:0 24px 80px rgba(0,0,0,.7);
}
.ranking-card::-webkit-scrollbar{display:none}
.rank-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;
}
.rank-title{
  font-size:1.3rem;font-weight:900;
  background:linear-gradient(130deg,#fcd68a,#fb923c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.btn-close{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  color:var(--muted2);border-radius:9px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;
  transition:all .2s;
}
.btn-close:hover{color:var(--text);border-color:var(--border2)}
.rank-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.rank-item{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;
  animation:rtSlide .35s ease both;
}
.rank-item.top1{border-color:rgba(246,201,78,.4);background:rgba(246,201,78,.07)}
.rank-item.top2{border-color:rgba(200,200,200,.3);background:rgba(200,200,200,.05)}
.rank-item.top3{border-color:rgba(205,127,50,.3);background:rgba(205,127,50,.06)}
.rank-medal{font-size:1.4rem;width:28px;text-align:center;flex-shrink:0}
.rank-time{font-size:1.2rem;font-weight:900;color:var(--text);flex:1}
.rank-rating{font-size:.75rem;color:var(--muted2);flex-shrink:0}
.rank-date{font-size:.65rem;color:var(--muted);margin-left:8px}
.rank-new{font-size:.65rem;background:var(--p);color:#fff;border-radius:4px;padding:1px 7px;font-weight:800;margin-left:4px;animation:newBlink .8s ease-in-out 3}
@keyframes newBlink{0%,100%{opacity:1}50%{opacity:.3}}
.rank-empty{text-align:center;color:var(--muted);font-size:.9rem;padding:24px}
.btn-rank-back{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border2);
  color:var(--muted2);border-radius:14px;padding:13px;
  font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;
}
.btn-rank-back:hover{color:var(--text);border-color:var(--p)}

/* Progress bar top */
.progress-track{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:200;
  background:var(--border);
  display:none;
}
.progress-track.show{display:block}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--green));transition:width .3s}

/* Flash overlay */
#flash{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:#fff;opacity:0;transition:opacity .08s;
}

/* Round indicator (top right) */
#round-indicator{
  position:fixed;top:16px;right:16px;z-index:50;
  display:flex;gap:6px;opacity:0;transition:opacity .3s;
}
#round-indicator.show{opacity:1}
.ri-dot{
  width:10px;height:10px;border-radius:50%;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  transition:all .3s;
}
.ri-dot.done{background:var(--green);border-color:var(--green);box-shadow:0 0 8px var(--green)}
.ri-dot.current{background:var(--p3);border-color:var(--p3);animation:dotPulse 1s ease-in-out infinite}

@media(max-width:480px){
  .idle-card,.results-card,.ranking-card{border-radius:20px;padding:28px 18px}
  .res-avg{font-size:3.5rem}
  .active-now{font-size:clamp(3rem,15vw,6rem)}
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div id="flash"></div>

<!-- Progress bar -->
<div class="progress-track" id="progressTrack">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<!-- Round indicator -->
<div id="round-indicator">
  <div class="ri-dot" id="rd0"></div>
  <div class="ri-dot" id="rd1"></div>
  <div class="ri-dot" id="rd2"></div>
  <div class="ri-dot" id="rd3"></div>
  <div class="ri-dot" id="rd4"></div>
</div>

<!-- MAIN ZONE -->
<div id="zone" class="state-idle">

  <!-- IDLE -->
  <div class="screen show" id="screen-idle">
    <div class="idle-card">
      <span class="idle-icon">⚡</span>
      <div class="idle-title">反応速度テスト</div>
      <div class="idle-sub">画面が光ったら、できるだけ早くタップ！<br>5回測定して平均タイムを計測します。</div>
      <div class="idle-rules">
        <div class="idle-rule"><div class="idle-rule-num">1</div>「スタート」を押して待機</div>
        <div class="idle-rule"><div class="idle-rule-num">2</div>画面が<b style="color:#0aff9d">緑に光ったら</b>即タップ</div>
        <div class="idle-rule"><div class="idle-rule-num">3</div>光る前にタップすると失敗！やり直しに</div>
        <div class="idle-rule"><div class="idle-rule-num">4</div>5回の平均タイムで実力を判定</div>
      </div>
      <button class="btn-start" id="btnStart">⚡ スタート</button>
      <div class="idle-stats" id="idleStats" style="display:none">
        <div class="idle-stat">
          <div class="is-val" id="statBest">-</div>
          <div class="is-label">自己ベスト</div>
        </div>
        <div class="idle-stat">
          <div class="is-val" id="statSessions">-</div>
          <div class="is-label">プレイ回数</div>
        </div>
        <div class="idle-stat">
          <div class="is-val" id="statAvgAll">-</div>
          <div class="is-label">全体平均</div>
        </div>
      </div>
    </div>
  </div>

  <!-- WAITING -->
  <div class="screen no-ptr" id="screen-waiting">
    <div class="wait-center">
      <div class="wait-round" id="waitRound">ROUND 1 / 5</div>
      <div class="wait-dots" id="waitDots">
        <div class="w-dot"></div><div class="w-dot"></div><div class="w-dot"></div>
        <div class="w-dot"></div><div class="w-dot"></div>
      </div>
      <div class="wait-icon">👁</div>
      <div class="wait-text">画面が光ったらタップ！</div>
    </div>
  </div>

  <!-- ACTIVE -->
  <div class="screen no-ptr" id="screen-active">
    <div class="active-center">
      <div class="active-now">今だ！</div>
      <div class="active-sub">タップ / クリック！</div>
    </div>
  </div>

  <!-- EARLY (false start) -->
  <div class="screen" id="screen-early">
    <div class="early-center">
      <div class="early-icon">⚠️</div>
      <div class="early-title">早すぎ！</div>
      <div class="early-sub">光る前にタップしました。このラウンドをやり直します。</div>
      <div class="early-tap">タップして続ける…</div>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="screen-done">
    <div class="results-wrap">
      <div class="results-card">
        <div class="res-badge">🏁 測定完了</div>
        <span class="res-icon" id="resIcon"></span>
        <div class="res-rating" id="resRating"></div>
        <div class="res-avg" id="resAvg"></div>
        <div class="res-avg-label">平均反応速度</div>

        <div class="round-times" id="roundTimes"></div>

        <div class="res-stats">
          <div class="res-stat">
            <div class="rs-val" id="resBest"></div>
            <div class="rs-label">最速</div>
          </div>
          <div class="res-stat">
            <div class="rs-val" id="resWorst"></div>
            <div class="rs-label">最遅</div>
          </div>
          <div class="res-stat">
            <div class="rs-val" id="resRank"></div>
            <div class="rs-label">自己ベスト順位</div>
          </div>
        </div>

        <div class="res-btns">
          <button class="btn-again" id="btnAgain">⚡ もう一度</button>
          <button class="btn-rank" id="btnShowRank">🏆 ランキング</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RANKING -->
  <div class="screen" id="screen-ranking">
    <div class="ranking-card">
      <div class="rank-head">
        <div class="rank-title">🏆 自己ベストランキング</div>
        <button class="btn-close" id="btnCloseRank">✕</button>
      </div>
      <div class="rank-list" id="rankList"></div>
      <button class="btn-rank-back" id="btnRankBack">← 戻る</button>
    </div>
  </div>

</div><!-- /zone -->

<script>
/* ══════════════════════════════════════════════
   STARFIELD
══════════════════════════════════════════════ */
(()=>{
  const c=document.getElementById('bgCanvas');
  const ctx=c.getContext('2d');
  let stars=[];
  const resize=()=>{
    c.width=innerWidth;c.height=innerHeight;
    stars=Array.from({length:Math.floor(innerWidth*innerHeight/3500)},()=>({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.4+.2,a:Math.random()*.7+.1,
      da:(Math.random()-.5)*.005+.002,
      phase:Math.random()*Math.PI*2,speed:Math.random()*.04+.015,
    }));
  };
  let t=0;
  const draw=()=>{
    ctx.clearRect(0,0,c.width,c.height);
    // Nebula
    const g=ctx.createRadialGradient(c.width*.3,c.height*.2,0,c.width*.3,c.height*.2,c.width*.4);
    g.addColorStop(0,'rgba(80,40,160,.08)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
    const g2=ctx.createRadialGradient(c.width*.8,c.height*.7,0,c.width*.8,c.height*.7,c.width*.3);
    g2.addColorStop(0,'rgba(160,40,120,.06)');g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2;ctx.fillRect(0,0,c.width,c.height);

    t+=.016;
    stars.forEach(s=>{
      s.a+=s.da;
      if(s.a>1){s.a=1;s.da=-Math.abs(s.da)}
      if(s.a<.05){s.a=.05;s.da=Math.abs(s.da)}
      const tw=Math.sin(t*s.speed+s.phase)*.3+.7;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,210,255,${s.a*tw})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  };
  window.addEventListener('resize',resize);resize();draw();
})();

/* ══════════════════════════════════════════════
   CONSTANTS & RATINGS
══════════════════════════════════════════════ */
const TOTAL=5;
const RATINGS=[
  {max:150,icon:'🚀',label:'神の領域',color:'#ff0080'},
  {max:200,icon:'⚡',label:'プロゲーマー',color:'#ffd700'},
  {max:250,icon:'🎯',label:'かなり速い',color:'#00ff88'},
  {max:300,icon:'😎',label:'平均以上',color:'#38c9f5'},
  {max:350,icon:'👍',label:'平均的',color:'#a78bfa'},
  {max:400,icon:'🐢',label:'もう少し！',color:'#fb923c'},
  {max:Infinity,icon:'💤',label:'練習あるのみ',color:'#94a3b8'},
];
const MEDALS=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];

function getRating(ms){return RATINGS.find(r=>ms<r.max)||RATINGS[RATINGS.length-1]}

/* ══════════════════════════════════════════════
   STORAGE
══════════════════════════════════════════════ */
const STORAGE_KEY='reaction_ranks_v2';
function loadRanks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}}
function saveRanks(r){localStorage.setItem(STORAGE_KEY,JSON.stringify(r))}
function addRank(avg){
  const r=loadRanks();
  r.push({avg:Math.round(avg),date:new Date().toLocaleDateString('ja-JP')});
  r.sort((a,b)=>a.avg-b.avg);
  if(r.length>20)r.pop();
  saveRanks(r);
  return r;
}
function getRankPosition(avg,ranks){return ranks.findIndex(r=>r.avg===Math.round(avg))+1}

/* ══════════════════════════════════════════════
   GAME STATE
══════════════════════════════════════════════ */
let state='idle';
let times=[];
let currentRound=0;
let startTime=0;
let waitTimer=null;
let lastSavedRanks=[];
let lastAvg=0;
let newBestIdx=-1;

/* ── SCREEN MANAGEMENT ── */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById('screen-'+name).classList.add('show');
}

function setZoneState(s){
  const zone=document.getElementById('zone');
  zone.className='';
  zone.classList.add('state-'+s);
  state=s;
}

/* ── ROUND INDICATOR ── */
function updateRoundIndicator(){
  const ri=document.getElementById('round-indicator');
  ri.classList.toggle('show',state!=='idle'&&state!=='done'&&state!=='ranking');
  for(let i=0;i<5;i++){
    const dot=document.getElementById('rd'+i);
    dot.className='ri-dot';
    if(i<times.length)dot.classList.add('done');
    else if(i===currentRound-1&&state==='waiting')dot.classList.add('current');
  }
}

function updateWaitDots(){
  const dots=document.querySelectorAll('.w-dot');
  dots.forEach((d,i)=>{
    d.className='w-dot';
    if(i<times.length)d.classList.add('done');
    else if(i===times.length)d.classList.add('active');
  });
}

/* ── PROGRESS ── */
function updateProgress(){
  const pt=document.getElementById('progressTrack');
  const pf=document.getElementById('progressFill');
  const show=state!=='idle'&&state!=='done'&&state!=='ranking';
  pt.classList.toggle('show',show);
  if(show) pf.style.width=(times.length/TOTAL*100)+'%';
}

/* ── FLASH ── */
function doFlash(color='#ffffff',duration=80){
  const el=document.getElementById('flash');
  el.style.background=color;
  el.style.opacity='.85';
  setTimeout(()=>el.style.opacity='0',duration);
}

/* ── GAME FLOW ── */
function startGame(){
  times=[];currentRound=0;
  document.getElementById('progressFill').style.width='0%';
  doRound();
}

function doRound(){
  currentRound++;
  setZoneState('waiting');
  showScreen('waiting');
  document.getElementById('waitRound').textContent=`ROUND ${currentRound} / ${TOTAL}`;
  updateWaitDots();
  updateRoundIndicator();
  updateProgress();

  const delay=1500+Math.random()*3000;
  waitTimer=setTimeout(()=>activate(),delay);
}

function activate(){
  startTime=performance.now();
  setZoneState('active');
  showScreen('active');
  doFlash('#ffffff',100);
  updateRoundIndicator();
}

function recordHit(){
  const elapsed=performance.now()-startTime;
  times.push(elapsed);

  // Brief flash feedback
  doFlash('#0aff9d',150);

  if(times.length>=TOTAL){
    showResults();
  } else {
    // Show mini feedback then continue
    setTimeout(()=>doRound(),600);
  }
  updateProgress();
}

function earlyClick(){
  clearTimeout(waitTimer);
  setZoneState('early');
  showScreen('early');
  updateRoundIndicator();
  doFlash('#ff2d55',200);
}

/* ── RESULTS ── */
function showResults(){
  const avg=times.reduce((a,b)=>a+b,0)/times.length;
  lastAvg=avg;
  const best=Math.min(...times);
  const worst=Math.max(...times);
  const rating=getRating(avg);

  lastSavedRanks=addRank(avg);
  const pos=getRankPosition(avg,lastSavedRanks);
  newBestIdx=pos-1; // index in ranks array

  setZoneState('done');
  showScreen('done');
  updateProgress();

  document.getElementById('resIcon').textContent=rating.icon;
  document.getElementById('resRating').textContent=rating.label;
  document.getElementById('resAvg').textContent=Math.round(avg)+'ms';
  document.getElementById('resBest').textContent=Math.round(best)+'ms';
  document.getElementById('resWorst').textContent=Math.round(worst)+'ms';
  document.getElementById('resRank').textContent=pos<=lastSavedRanks.length?pos+'位':'-';

  // Round times
  const container=document.getElementById('roundTimes');
  container.innerHTML='';
  const maxT=Math.max(...times);
  const bestT=Math.min(...times);
  times.forEach((t,i)=>{
    const isBest=t===bestT&&times.filter(x=>x===bestT).length===1;
    const pct=Math.round((t/maxT)*100);
    const div=document.createElement('div');
    div.className='rt-item';
    div.style.animationDelay=(i*.07)+'s';
    div.innerHTML=`
      <div class="rt-round">Round ${i+1}</div>
      <div class="rt-bar-wrap"><div class="rt-bar" style="width:0%" data-w="${pct}"></div></div>
      <div class="rt-time">${Math.round(t)}ms${isBest?'<span class="rt-best">BEST</span>':''}</div>
    `;
    container.appendChild(div);
  });
  setTimeout(()=>{
    container.querySelectorAll('.rt-bar').forEach(b=>b.style.width=b.dataset.w+'%');
  },100);

  // Update idle stats
  updateIdleStats();

  // Confetti if great score
  if(avg<250) launchConfetti();
}

function updateIdleStats(){
  const ranks=loadRanks();
  if(!ranks.length)return;
  const stats=document.getElementById('idleStats');
  stats.style.display='flex';
  document.getElementById('statBest').textContent=ranks[0].avg+'ms';
  document.getElementById('statSessions').textContent=ranks.length+'回';
  const allAvg=Math.round(ranks.reduce((a,b)=>a+b.avg,0)/ranks.length);
  document.getElementById('statAvgAll').textContent=allAvg+'ms';
}

/* ── RANKING ── */
function showRanking(){
  const ranks=loadRanks();
  setZoneState('ranking');
  showScreen('ranking');
  document.getElementById('round-indicator').classList.remove('show');
  document.getElementById('progressTrack').classList.remove('show');

  const list=document.getElementById('rankList');
  list.innerHTML='';
  if(!ranks.length){
    list.innerHTML='<div class="rank-empty">まだ記録がありません</div>';
    return;
  }
  ranks.slice(0,10).forEach((r,i)=>{
    const isNew=i===newBestIdx;
    const rating=getRating(r.avg);
    const div=document.createElement('div');
    div.className='rank-item'+(i===0?' top1':i===1?' top2':i===2?' top3':'');
    div.style.animationDelay=(i*.05)+'s';
    div.innerHTML=`
      <div class="rank-medal">${MEDALS[i]||'　'}</div>
      <div class="rank-time">${r.avg}ms${isNew?'<span class="rank-new">NEW</span>':''}</div>
      <div class="rank-rating">${rating.icon} ${rating.label}</div>
      <div class="rank-date">${r.date}</div>
    `;
    list.appendChild(div);
  });
}

/* ── CONFETTI ── */
function launchConfetti(){
  const colors=['#7c6ffc','#e963c8','#38c9f5','#f6c94e','#22d3a0','#fb923c'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div');
    el.style.cssText=`
      position:fixed;z-index:999;pointer-events:none;
      left:${Math.random()*100}%;top:-10px;
      width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      border-radius:${Math.random()>.5?'50%':'2px'};
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation:confFall ${1.5+Math.random()*2}s linear ${Math.random()*.6}s forwards;
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
  if(!document.getElementById('confStyle')){
    const style=document.createElement('style');
    style.id='confStyle';
    style.textContent='@keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}';
    document.head.appendChild(style);
  }
}

/* ══════════════════════════════════════════════
   EVENTS
══════════════════════════════════════════════ */
// Zone click
document.getElementById('zone').addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('.ranking-card'))return;

  switch(state){
    case 'waiting':
      earlyClick();
      break;
    case 'active':
      recordHit();
      break;
    case 'early':
      doRound();
      break;
  }
});

// Buttons
document.getElementById('btnStart').addEventListener('click',e=>{e.stopPropagation();startGame()});
document.getElementById('btnAgain').addEventListener('click',e=>{e.stopPropagation();startGame()});
document.getElementById('btnShowRank').addEventListener('click',e=>{e.stopPropagation();showRanking()});
document.getElementById('btnCloseRank').addEventListener('click',e=>{e.stopPropagation();
  setZoneState('done');showScreen('done');
});
document.getElementById('btnRankBack').addEventListener('click',e=>{e.stopPropagation();
  if(times.length===TOTAL){setZoneState('done');showScreen('done')}
  else{setZoneState('idle');showScreen('idle');updateIdleStats();document.getElementById('round-indicator').classList.remove('show')}
});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    e.preventDefault();
    if(state==='waiting')earlyClick();
    else if(state==='active')recordHit();
    else if(state==='early')doRound();
  }
});

// Touch (prevent double-trigger)
document.getElementById('zone').addEventListener('touchstart',e=>{
  if(state==='waiting'||state==='active'||state==='early'){
    e.preventDefault();
  }
},{passive:false});

/* ── INIT ── */
updateIdleStats();
</script>
</body>
</html>
