<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラーパレット生成</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#07071a;--bg2:#0f0f28;--bg3:#131330;
  --s1:rgba(255,255,255,.05);--s2:rgba(255,255,255,.09);
  --b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.18);
  --text:#f0f0fc;--dim:#6868a8;--dim2:#a0a0d0;
  --accent:#7c5cfc;--accent2:#fc5c9c;
  --r:14px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 10% 10%,rgba(124,92,252,.12) 0%,transparent 55%),
             radial-gradient(ellipse at 90% 90%,rgba(252,92,156,.1) 0%,transparent 55%),
             radial-gradient(ellipse at 50% 50%,rgba(92,240,200,.04) 0%,transparent 70%);}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px 60px;}

/* ── HEADER ── */
header{text-align:center;padding:40px 0 32px;}
.hbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(124,92,252,.15);border:1px solid rgba(124,92,252,.3);border-radius:100px;padding:5px 16px;font-size:.7rem;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,#fff 0%,var(--accent) 45%,var(--accent2) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.hsub{color:var(--dim2);font-size:.9rem;}

/* ── TABS ── */
.mode-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:28px;}
.mtab{padding:9px 24px;background:var(--s1);border:1px solid var(--b1);border-radius:100px;color:var(--dim);font-size:.82rem;cursor:pointer;transition:all .2s;letter-spacing:.04em;}
.mtab:hover{border-color:var(--b2);color:var(--text);}
.mtab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 20px rgba(124,92,252,.35);}

/* ── PANELS ── */
.panel{display:none;}
.panel.on{display:block;}

/* ── KEYWORD PANEL ── */
.kw-box{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:24px;margin-bottom:20px;}
.kw-input-wrap{position:relative;margin-bottom:16px;}
.kw-input{width:100%;padding:14px 54px 14px 18px;background:var(--bg2);border:1.5px solid var(--b1);border-radius:12px;color:var(--text);font-size:1rem;outline:none;transition:border-color .2s;}
.kw-input::placeholder{color:var(--dim);}
.kw-input:focus{border-color:var(--accent);}
.kw-gen-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none;}

.tag-label{font-size:.68rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.tag{padding:5px 12px;background:var(--s1);border:1px solid var(--b1);border-radius:100px;font-size:.75rem;color:var(--dim2);cursor:pointer;transition:all .18s;}
.tag:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,92,252,.1);}
.tag.on{background:rgba(124,92,252,.15);border-color:var(--accent);color:var(--accent);}

/* ── THEORY PANEL ── */
.theory-box{background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:24px;margin-bottom:20px;}
.theory-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;}
.picker-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.picker-label{font-size:.7rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.color-picker-btn{
  width:64px;height:64px;border-radius:14px;border:3px solid var(--b2);cursor:pointer;overflow:hidden;
  position:relative;transition:transform .18s;
}
.color-picker-btn:hover{transform:scale(1.08);}
.color-picker-btn input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);opacity:0;cursor:pointer;}
.picked-preview{width:100%;height:100%;}

.theory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(max-width:480px){.theory-grid{grid-template-columns:repeat(2,1fr);}}
.theory-btn{
  background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  padding:12px 10px;text-align:center;cursor:pointer;transition:all .2s;
}
.theory-btn:hover{background:var(--s2);}
.theory-btn.on{background:rgba(124,92,252,.15);border-color:var(--accent);}
.tb-name{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:3px;}
.tb-en{font-size:.65rem;color:var(--accent);letter-spacing:.06em;margin-bottom:4px;}
.tb-desc{font-size:.65rem;color:var(--dim2);line-height:1.4;}

/* ── GENERATE BUTTON ── */
.gen-btn{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:var(--r);color:#fff;font-size:1rem;font-weight:800;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 6px 28px rgba(124,92,252,.35);transition:opacity .2s,transform .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.gen-btn:hover{opacity:.9;transform:translateY(-1px);}
.gen-btn:active{transform:translateY(0);}

/* ── RESULTS ── */
.results{margin-top:32px;}
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.results-header h2{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;}
.results-count{font-size:.8rem;color:var(--dim);}

.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;}
@media(max-width:500px){.palette-grid{grid-template-columns:1fr;}}

/* ── PALETTE CARD ── */
.pal-card{
  background:var(--s1);border:1px solid var(--b1);border-radius:18px;
  overflow:hidden;transition:transform .2s,box-shadow .2s;
}
.pal-card:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,.4);}
.pal-card-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;}
.pal-name{font-size:.88rem;font-weight:700;color:var(--text);}
.pal-type{font-size:.65rem;background:rgba(255,255,255,.06);border:1px solid var(--b1);border-radius:100px;padding:2px 10px;color:var(--dim2);letter-spacing:.06em;}

.swatches{display:flex;height:88px;}
.swatch{
  flex:1;position:relative;cursor:pointer;overflow:hidden;
  transition:flex .25s cubic-bezier(.4,0,.2,1);
}
.swatch:hover{flex:1.6;}
.swatch:first-child{border-radius:0;}
.swatch-hex{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  padding:4px 6px;text-align:center;
  font-size:.65rem;font-family:'SF Mono',Consolas,monospace;color:#fff;font-weight:600;
  transform:translateY(100%);transition:transform .2s;letter-spacing:.04em;
}
.swatch:hover .swatch-hex{transform:translateY(0);}
.swatch-check{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;opacity:0;transition:opacity .18s;
  background:rgba(0,0,0,.3);
}
.swatch.copied .swatch-check{opacity:1;}

.pal-bottom{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hex-list{display:flex;gap:6px;flex-wrap:wrap;}
.hex-chip{
  font-size:.65rem;font-family:'SF Mono',Consolas,monospace;
  padding:3px 8px;background:var(--bg2);border:1px solid var(--b1);border-radius:6px;
  color:var(--dim2);cursor:pointer;transition:all .15s;
}
.hex-chip:hover{border-color:var(--b2);color:var(--text);}
.copy-all-btn{
  padding:6px 12px;background:var(--s2);border:1px solid var(--b1);border-radius:8px;
  color:var(--dim2);font-size:.72rem;cursor:pointer;white-space:nowrap;transition:all .18s;
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.copy-all-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── TOOLTIP ── */
.swatch-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--b2);border-radius:10px;
  padding:10px 12px;pointer-events:none;z-index:50;min-width:120px;
  opacity:0;transition:opacity .18s;white-space:nowrap;
}
.swatch:hover .swatch-tip{opacity:1;}
.tip-preview{width:100%;height:24px;border-radius:6px;margin-bottom:7px;}
.tip-hex{font-family:'SF Mono',Consolas,monospace;font-size:.75rem;color:#fff;font-weight:700;}
.tip-sub{font-size:.65rem;color:var(--dim2);margin-top:3px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,40,.95);backdrop-filter:blur(12px);
  border:1px solid var(--b2);border-radius:100px;
  padding:10px 22px;font-size:.82rem;color:#fff;font-weight:600;
  z-index:1000;pointer-events:none;
  transition:opacity .3s,transform .3s;opacity:0;transform:translateX(-50%) translateY(12px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px;color:var(--dim);}
.empty .ei{font-size:3rem;margin-bottom:12px;}

@media(max-width:600px){
  .swatches{height:72px;}
  .palette-grid{grid-template-columns:1fr;}
  .theory-row{flex-direction:column;align-items:flex-start;}
}
</style>
</head>

    <button class="gen-btn" id="thGenBtn">

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── COLOR MATH ─────────────────────────────────────────────────────────────

function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

function hexToHsl(hex) {
  let r = parseInt(hex.slice(1,3),16)/255;
  let g = parseInt(hex.slice(3,5),16)/255;
  let b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0, l = (max+min)/2;
  if (max !== min) {
    const d = max - min;
    s = l > .5 ? d/(2-max-min) : d/(max+min);
    switch(max) {
      case r: h = ((g-b)/d + (g<b?6:0))/6; break;
      case g: h = ((b-r)/d + 2)/6; break;
      case b: h = ((r-g)/d + 4)/6; break;
    }
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1,3),16),
    g: parseInt(hex.slice(3,5),16),
    b: parseInt(hex.slice(5,7),16),
  };
}

function luminance(hex) {
  const {r,g,b} = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

function textOnColor(hex) { return luminance(hex) > 0.55 ? '#111' : '#fff'; }

const QUICK_TAGS = [

// ── KEYWORD LOOKUP ──────────────────────────────────────────────────────────

function findKwParams(query) {
  const q = query.trim().toLowerCase();
  if (!q) return null;

  // Exact match
  if (KW_MAP[q]) return KW_MAP[q];

  // Partial match
  for (const [key, val] of Object.entries(KW_MAP)) {
    if (q.includes(key) || key.includes(q)) return val;
  }

  // Hash-based fallback
  let hash = 0;
  for (let i = 0; i < q.length; i++) hash = (hash*31 + q.charCodeAt(i)) >>> 0;
  const h = hash % 360;
  return { h:[h, (h+30)%360], s:[45,70], l:[40,68] };
}

// ── PALETTE GENERATORS ─────────────────────────────────────────────────────

function genHue(range) {
  const [a,b] = range;
  if (a <= b) return rnd(a, b);
  // wraps around 0/360
  const total = (360-a) + b;
  const r = rnd(0, total);
  return r < (360-a) ? a+r : r-(360-a);
}

function genPaletteFromKw(params, variant, seed) {
  const baseH = genHue(params.h);
  const [sMin,sMax] = params.s;
  const [lMin,lMax] = params.l;
  const lRange = lMax - lMin;

  const colors = [];
  const steps = [0, 0.22, 0.45, 0.68, 0.9];

  steps.forEach((t, i) => {
    let h = baseH + rnd(-12, 12);
    let s = sMin + (sMax-sMin) * (0.4 + Math.sin(t*Math.PI)*0.3 + rnd(0,0.2));
    let l = lMin + lRange * t;

    if (variant === 'light')   { l = Math.min(96, l + 18); s = Math.max(15, s - 12); }
    if (variant === 'dark')    { l = Math.max(5,  l - 22); s = Math.max(20, s + 5); }
    if (variant === 'vivid')   { s = Math.min(100, s + 22); }
    if (variant === 'neutral') { s = Math.max(5,  s - 30); }
    if (variant === 'warm')    { h += rnd(5, 18); }
    if (variant === 'cool')    { h -= rnd(5, 18); }

    colors.push(hslToHex(h, s, l));
  });

  return colors;
}

// ── COLOR THEORY GENERATORS ────────────────────────────────────────────────

const THEORIES = [
  { id:'complementary', name:'補色',         en:'Complementary',      desc:'対角の色でコントラスト' },
  { id:'analogous',     name:'類似色',       en:'Analogous',          desc:'隣接色で自然な調和' },
  { id:'triadic',       name:'トライアド',   en:'Triadic',            desc:'等間隔3色のバランス' },
  { id:'split',         name:'スプリット補色',en:'Split-Comp',        desc:'補色をずらした3色' },
  { id:'tetradic',      name:'テトラード',   en:'Tetradic',           desc:'正方形4色の豊かさ' },
  { id:'mono',          name:'モノクロマ',   en:'Monochromatic',      desc:'同色相で濃淡グラデ' },
];

function genTheoryPalette(baseHex, theoryId) {
  const [h, s, l] = hexToHsl(baseHex);
  const mk = (hh, ss, ll) => hslToHex(hh, ss, ll);

  switch(theoryId) {
    case 'complementary': {
      const c = (h+180)%360;
      return [
        mk(h, s, Math.max(10, l-15)),
        mk(h, s, l),
        mk(h, Math.max(15, s-18), Math.min(90, l+22)),
        mk(c, s, l),
        mk(c, Math.max(15, s-12), Math.min(90, l+18)),
      ];
    }
    case 'analogous': {
      return [
        mk((h-60+360)%360, s, l),
        mk((h-30+360)%360, s, l),
        mk(h, s, l),
        mk((h+30)%360, s, l),
        mk((h+60)%360, s, l),
      ];
    }
    case 'triadic': {
      const t1 = (h+120)%360, t2 = (h+240)%360;
      return [
        mk(h, s, l),
        mk(h, Math.max(12,s-20), Math.min(90,l+25)),
        mk(t1, s, l),
        mk(t1, Math.max(12,s-15), Math.min(90,l+20)),
        mk(t2, s, l),
      ];
    }
    case 'split': {
      const s1 = (h+150)%360, s2 = (h+210)%360;
      return [
        mk(h, s, l),
        mk(h, Math.max(12,s-18), Math.min(90,l+24)),
        mk(s1, s, l),
        mk(s2, s, l),
        mk((h+180)%360, Math.max(10,s-22), Math.min(92,l+28)),
      ];
    }
    case 'tetradic': {
      return [
        mk(h, s, l),
        mk((h+90)%360, s, l),
        mk((h+180)%360, s, l),
        mk((h+270)%360, s, l),
        mk(h, Math.max(10,s-20), Math.min(90,l+22)),
      ];
    }
    case 'mono': {
      const ll = [
        Math.max(8,  l-32),
        Math.max(18, l-16),
        l,
        Math.min(82, l+16),
        Math.min(94, l+32),
      ];
      return ll.map(lv => mk(h, s, lv));
    }
    default: return [mk(h,s,l)];
  }
}

// ── PALETTE NAMES ──────────────────────────────────────────────────────────

const VARIANT_NAMES = {
  main:    '✦ メイン',
  light:   '☀ ライト',
  dark:    '🌑 ダーク',
  vivid:   '⚡ ビビッド',
  neutral: '🩶 ニュートラル',
  warm:    '🔥 ウォーム',
  cool:    '❄ クール',
};

// ── RENDER ─────────────────────────────────────────────────────────────────

function renderPalettes(palettes) {
  const res = document.getElementById('results');
  res.innerHTML = `
    <div class="results-header">
      <h2>生成結果</h2>
      <span class="results-count">${palettes.length} パレット</span>
    </div>
    <div class="palette-grid" id="palGrid"></div>`;

  const grid = document.getElementById('palGrid');
  palettes.forEach(pal => grid.appendChild(buildCard(pal)));
}

function buildCard(pal) {
  const card = document.createElement('div');
  card.className = 'pal-card';

  const top = document.createElement('div');
  top.className = 'pal-card-top';
  top.innerHTML = `<div class="pal-name">${pal.name}</div><div class="pal-type">${pal.type}</div>`;
  card.appendChild(top);

  // Swatches
  const sw = document.createElement('div');
  sw.className = 'swatches';

  pal.colors.forEach(hex => {
    const s = document.createElement('div');
    s.className = 'swatch';
    s.style.background = hex;

    const [h,sat,l] = hexToHsl(hex);
    const {r,g,b} = hexToRgb(hex);

    s.innerHTML = `
      <div class="swatch-check">✓</div>
      <div class="swatch-hex">${hex.toUpperCase()}</div>
      <div class="swatch-tip">
        <div class="tip-preview" style="background:${hex}"></div>
        <div class="tip-hex">${hex.toUpperCase()}</div>
        <div class="tip-sub">RGB ${r}, ${g}, ${b}</div>
        <div class="tip-sub">HSL ${h}°, ${sat}%, ${l}%</div>
      </div>`;

    s.addEventListener('click', () => {
      copyText(hex.toUpperCase());
      s.classList.add('copied');
      setTimeout(() => s.classList.remove('copied'), 600);
    });

    sw.appendChild(s);
  });
  card.appendChild(sw);

  // Bottom
  const bot = document.createElement('div');
  bot.className = 'pal-bottom';

  const chips = document.createElement('div');
  chips.className = 'hex-list';
  pal.colors.forEach(hex => {
    const c = document.createElement('div');
    c.className = 'hex-chip';
    c.textContent = hex.toUpperCase();
    c.addEventListener('click', () => copyText(hex.toUpperCase()));
    chips.appendChild(c);
  });

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-all-btn';
  copyBtn.innerHTML = '📋 CSS変数';
  copyBtn.addEventListener('click', () => {
    const css = `:root {\n${pal.colors.map((h,i)=>`  --color-${i+1}: ${h.toUpperCase()};`).join('\n')}\n}`;
    copyText(css);
  });

  bot.appendChild(chips);
  bot.appendChild(copyBtn);
  card.appendChild(bot);

  return card;
}

// ── COPY ───────────────────────────────────────────────────────────────────

let toastTimer = null;
function copyText(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  });
  showToast(text.startsWith(':root') ? 'CSS変数をコピーしました ✓' : `${text} をコピーしました ✓`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── GENERATE ───────────────────────────────────────────────────────────────

function generateFromKeyword(raw) {
  const kw = raw.trim();
  if (!kw) return;

  const params = findKwParams(kw);
  const variants = ['main','light','dark','vivid','warm','cool'];
  const palettes = variants.map(v => ({
    name: `${kw} — ${VARIANT_NAMES[v]}`,
    type: v === 'main' ? 'キーワード' : 'バリエーション',
    colors: genPaletteFromKw(params, v, Math.random()),
  }));

  renderPalettes(palettes);
}

function generateFromTheory(baseHex, theoryId) {
  if (!theoryId) { showToast('配色理論を選択してください'); return; }
  const th = THEORIES.find(t=>t.id===theoryId);
  const palettes = [{
    name: `${th.name} — ${th.en}`,
    type: th.desc,
    colors: genTheoryPalette(baseHex, theoryId),
  }];

  // Also show all theories for comparison
  THEORIES.filter(t=>t.id!==theoryId).forEach(t => {
    palettes.push({
      name: t.name + ' — ' + t.en,
      type: t.desc,
      colors: genTheoryPalette(baseHex, t.id),
    });
  });

  renderPalettes(palettes);
}
