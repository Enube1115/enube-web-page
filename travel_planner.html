<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム旅行プランナー 🗾</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Noto Sans JP', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.4); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header .emoji {
      font-size: 3.6rem;
      display: block;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 16px rgba(255,200,80,0.7));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      background: linear-gradient(90deg, #f9d423, #ff4e50, #f9d423);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
      letter-spacing: 2px;
    }

    @keyframes shimmer {
      0%   { background-position: 0%; }
      100% { background-position: 200%; }
    }

    header p {
      margin-top: 10px;
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .spin-btn {
      position: relative;
      padding: 18px 52px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 2px;
      color: #fff;
      background: linear-gradient(135deg, #f9d423 0%, #ff4e50 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(249,212,35,0.35), 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }

    .spin-btn::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.5s ease;
    }

    .spin-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(249,212,35,0.45); }
    .spin-btn:hover::before { transform: scale(1); }
    .spin-btn:active { transform: translateY(0); }
    .spin-btn.spinning { animation: btnPulse 0.6s ease; }

    @keyframes btnPulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(0.94); }
      70%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 36px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .pref-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.08);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .dest-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 0%, #f9d423 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dest-emoji {
      font-size: 2.8rem;
      flex-shrink: 0;
    }

    .region-tag {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 24px 22px; }
    }

    .info-block {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 18px 20px;
      transition: transform 0.2s;
    }

    .info-block:hover { transform: translateY(-2px); }

    .info-block.full { grid-column: 1 / -1; }

    .block-title {
      font-size: 0.72rem;
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .block-title span { font-size: 1rem; }

    .block-content {
      font-size: 0.97rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.88);
      font-weight: 400;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .tag {
      font-size: 0.82rem;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: 500;
    }

    .tag-spot {
      background: rgba(100,200,255,0.15);
      border: 1px solid rgba(100,200,255,0.3);
      color: #8de0ff;
    }

    .tag-food {
      background: rgba(255,160,80,0.15);
      border: 1px solid rgba(255,160,80,0.3);
      color: #ffbc7a;
    }

    .tag-season {
      background: rgba(120,230,120,0.15);
      border: 1px solid rgba(120,230,120,0.3);
      color: #8fefaa;
    }

    .season-icons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .s-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(120,230,120,0.12);
      border: 1px solid rgba(120,230,120,0.25);
      color: #a8f5be;
    }

    .tip-box {
      margin-top: 18px;
      padding: 16px 20px;
      background: linear-gradient(135deg, rgba(249,212,35,0.1), rgba(255,78,80,0.1));
      border: 1px solid rgba(249,212,35,0.2);
      border-radius: 14px;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
    }

    .tip-box strong { color: #f9d423; }

    .history {
      margin-top: 32px;
    }

    .history h3 {
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      font-size: 0.78rem;
      padding: 4px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-item:hover {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.85);
    }

    footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">

    <div class="grid">

        <div class="tag-list" id="spots"></div>

      <div class="info-block">
        <div class="block-title"><span>🍜</span> ご当地グルメ</div>
        <div class="tag-list" id="foods"></div>
      </div>
      <div class="info-block">
        <div class="block-title"><span>🌸</span> おすすめシーズン</div>
        <div class="season-icons" id="seasons"></div>
      </div>
    </div>

    <div class="tip-box" id="tipBox"></div>
  </div>

  <div class="history" id="historyBox" style="display:none">
    <h3>🕒 最近の旅先履歴</h3>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<footer>© 2025 Japan Travel Roulette — 全47都道府県対応</footer>

const SEASON_MAP = {
  "春（2〜3月）": "🌼", "春（3月）": "🌸", "春（3〜4月）": "🌸", "春（4月）": "🌸",
  "春（4〜5月）": "🌸", "春（4月下旬）": "🌸", "春（3〜5月）": "🌸", "春（2月）": "🌼",
  "夏（6〜7月）": "🌻", "夏（7月）": "☀️", "夏（7〜8月）": "☀️", "夏（8月）": "☀️",
  "夏（6〜9月）": "🌊", "夏（7〜9月）": "☀️",
  "秋（9〜10月）": "🍂", "秋（10月）": "🍂", "秋（10〜11月）": "🍂", "秋（11月）": "🍁",
  "秋（11〜12月）": "🍁",
  "冬（12月）": "❄️", "冬（12〜2月）": "❄️", "冬（1月）": "❄️", "冬（1〜2月）": "❄️",
  "冬（2月）": "❄️", "冬（2〜3月）": "❄️", "冬（12〜3月）": "❄️"
};

let history = [];
let currentIndex = -1;

function makeStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      animation-delay:${Math.random()*3}s;
      animation-duration:${2+Math.random()*3}s;
    `;
    container.appendChild(star);
  }
}

function spin() {
  let idx;
  do { idx = Math.floor(Math.random() * PREFECTURES.length); } while (idx === currentIndex && PREFECTURES.length > 1);
  currentIndex = idx;
  showCard(PREFECTURES[idx]);

  const btn = document.getElementById('spinBtn');
  btn.classList.remove('spinning');
  void btn.offsetWidth;
  btn.classList.add('spinning');
}

function showCard(data) {
  const card = document.getElementById('card');
  card.classList.remove('visible');

  setTimeout(() => {
    document.getElementById('prefBadge').textContent = data.pref;
    document.getElementById('destEmoji').textContent = data.emoji;
    document.getElementById('destName').textContent = data.pref;
    document.getElementById('regionTag').textContent = data.region;

    const spotsEl = document.getElementById('spots');
    spotsEl.innerHTML = data.spots.map(s => `<span class="tag tag-spot">${s}</span>`).join('');

    const foodsEl = document.getElementById('foods');
    foodsEl.innerHTML = data.foods.map(f => `<span class="tag tag-food">${f}</span>`).join('');

    const seasonsEl = document.getElementById('seasons');
    seasonsEl.innerHTML = data.seasons.map(s => {
      const icon = SEASON_MAP[s.label] || s.icon || '🌿';
      return `<div class="s-chip">${icon} ${s.label}</div>`;
    }).join('');

    document.getElementById('tipBox').innerHTML = `<strong>💡 旅のヒント：</strong>${data.tip}`;

    card.classList.add('visible');
  }, 200);

  addHistory(data.pref, data.emoji);
}

function addHistory(name, emoji) {
  if (history.find(h => h.name === name)) return;
  history.unshift({ name, emoji });
  if (history.length > 8) history.pop();
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById('historyBox');
  const list = document.getElementById('historyList');
  if (history.length === 0) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = history.map(h =>
    `<span class="history-item" onclick="showByName('${h.name}')">${h.emoji} ${h.name}</span>`
  ).join('');
}

function showByName(name) {
  const data = PREFECTURES.find(p => p.pref === name);
  if (data) showCard(data);
}

makeStars();
</script>
