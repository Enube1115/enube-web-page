<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋みくじ 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #b5243a;
      --red2:   #e03a55;
      --gold:   #c9962a;
      --goldlt: #e8c56a;
      --dark:   #10080f;
      --paper:  #fdf6ed;
      --text:   #2d1a0e;
      --muted:  #7a5a3a;
    }

    body {
      min-height: 100vh;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse 60% 50% at 15% 10%, rgba(181,36,58,.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 85% 90%, rgba(201,150,42,.12) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0 L21 19 L40 20 L21 21 L20 40 L19 21 L0 20 L19 19Z' fill='rgba(201,150,42,0.04)'/%3E%3C/svg%3E");
      font-family: 'Noto Serif JP', serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 72px;
      overflow-x: hidden;
    }

    /* ── petals ── */
    .petal {
      position: fixed;
      top: -30px;
      pointer-events: none;
      z-index: 0;
      animation: petalFall linear infinite;
    }
    .petal::before {
      content: '';
      display: block;
      background: linear-gradient(135deg, #ffd0de, #ffb7c5);
      border-radius: 80% 0 80% 0;
      opacity: .75;
    }
    @keyframes petalFall {
      0%   { transform: translateY(0)     rotate(0deg)   translateX(0); opacity: 0; }
      8%   { opacity: .8; }
      90%  { opacity: .5; }
      100% { transform: translateY(108vh) rotate(600deg) translateX(var(--drift)); opacity: 0; }
    }

    /* ── layout ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 660px;
    }

    /* ── header ── */
    header { text-align: center; margin-bottom: 44px; }

    .kamon {
      width: 80px; height: 80px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 18px;
      box-shadow: 0 0 28px rgba(201,150,42,.35), inset 0 0 20px rgba(201,150,42,.07);
      position: relative;
      animation: kamonPulse 4s ease-in-out infinite;
    }
    .kamon::before {
      content: '';
      position: absolute; inset: 5px;
      border: 1px solid rgba(201,150,42,.35);
      border-radius: 50%;
    }
    @keyframes kamonPulse {
      0%,100% { box-shadow: 0 0 28px rgba(201,150,42,.35), inset 0 0 20px rgba(201,150,42,.07); }
      50%      { box-shadow: 0 0 44px rgba(201,150,42,.55), inset 0 0 24px rgba(201,150,42,.12); }
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 10px;
      background: linear-gradient(135deg, #e8c56a 0%, #fff5d0 40%, #c9962a 70%, #e8c56a 100%);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldShimmer 5s linear infinite;
      margin-bottom: 6px;
    }
    @keyframes goldShimmer { to { background-position: 200%; } }

    .sub {
      font-size: .8rem;
      color: rgba(255,255,255,.35);
      letter-spacing: 4px;
      font-weight: 300;
      margin-bottom: 10px;
    }
    .today-date {
      font-size: .84rem;
      color: rgba(255,255,255,.45);
      letter-spacing: 2px;
    }

    /* ── draw section ── */
    .draw-sec {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .draw-btn {
      position: relative;
      padding: 22px 72px;
      font-family: 'Noto Serif JP', serif;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 6px;
      color: #fff;
      background: linear-gradient(160deg, #8b0020 0%, var(--red) 45%, #8b0020 100%);
      border: none;
      cursor: pointer;
      border-radius: 3px;
      box-shadow:
        0 6px 24px rgba(181,36,58,.55),
        0 0 0 1px rgba(201,150,42,.3),
        inset 0 1px 0 rgba(255,255,255,.1);
      transition: transform .18s, box-shadow .18s;
      overflow: hidden;
    }
    .draw-btn::before {
      content: '';
      position: absolute; top: 0; left: -120%;
      width: 80%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      transform: skewX(-20deg);
      transition: left .5s;
    }
    .draw-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 36px rgba(181,36,58,.65), 0 0 0 1px rgba(201,150,42,.5), inset 0 1px 0 rgba(255,255,255,.15); }
    .draw-btn:hover::before { left: 150%; }
    .draw-btn:active { transform: translateY(0); }


    .draw-hint {
      font-size: .78rem;
      color: rgba(255,255,255,.3);
      letter-spacing: 2px;
    }

    /* ── fortune paper ── */
    .paper {
      background: var(--paper);
      border-radius: 2px;
      padding: 40px 36px 44px;
      position: relative;
      box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(201,150,42,.18);
      display: none;
    }
    .paper.open {
      display: block;
      animation: paperDrop .65s cubic-bezier(.22,.68,0,1.2) forwards;
    }
    @keyframes paperDrop {
      from { opacity: 0; transform: translateY(-40px) scaleY(.85); }
      to   { opacity: 1; transform: translateY(0)    scaleY(1); }
    }

    /* lined paper texture */
    .paper::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 27px,
        rgba(181,36,58,.04) 27px, rgba(181,36,58,.04) 28px
      );
      pointer-events: none;
    }

    /* gold inner border */
    .paper-frame {
      position: absolute; inset: 10px;
      border: 1px solid rgba(201,150,42,.22);
      pointer-events: none;
    }
    .paper-frame::before,
    .paper-frame::after {
      content: '✿';
      position: absolute;
      left: 50%; transform: translateX(-50%);
      font-size: 1rem;
      color: rgba(201,150,42,.45);
    }
    .paper-frame::before { top: -10px; }
    .paper-frame::after  { bottom: -10px; }

    /* vertical kanji decorations */
    .v-kanji {
      position: absolute;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: .65rem;
      letter-spacing: 6px;
      color: rgba(201,150,42,.22);
      top: 28px; bottom: 28px;
      display: flex; align-items: center;
    }
    .v-kanji.left  { left: 18px; }
    .v-kanji.right { right: 18px; }

    /* ── paper header ── */
    .p-head {
      text-align: center;
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(181,36,58,.14);
      position: relative;
    }
    .p-date-lbl {
      font-size: .76rem;
      color: var(--muted);
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .p-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--red);
      letter-spacing: 6px;
      margin-bottom: 20px;
    }
    .seal-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .overall-seal {
      width: 86px; height: 86px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      position: relative;
      box-shadow: 0 4px 18px rgba(0,0,0,.2);
    }
    .overall-seal::before {
      content: '';
      position: absolute; inset: 4px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.28);
    }
    .seal-label { font-size: .72rem; color: var(--muted); letter-spacing: 3px; }

    /* ── 4-category grid ── */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 26px;
    }
    @media (max-width: 480px) {
      .cat-grid { grid-template-columns: 1fr; }
      .paper { padding: 32px 20px 36px; }
    }

    .cat-card {
      border: 1px solid rgba(181,36,58,.1);
      border-radius: 3px;
      padding: 18px 14px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: rgba(253,246,237,.7);
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp .5s ease forwards;
    }
    .cat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .cat-card:nth-child(1) { animation-delay: .35s; }
    .cat-card:nth-child(2) { animation-delay: .5s;  }
    .cat-card:nth-child(3) { animation-delay: .65s; }
    .cat-card:nth-child(4) { animation-delay: .8s;  }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .cat-icon  { font-size: 1.4rem; margin-bottom: 4px; }
    .cat-name  { font-size: .74rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 10px; }
    .lvl-badge {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 2px;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.14);
    }
    .stars { display: flex; justify-content: center; gap: 3px; margin-bottom: 8px; }
    .stars s { text-decoration: none; font-size: .72rem; color: #ddd; }
    .stars s.on { color: #d4a843; }
    .cat-msg { font-size: .74rem; color: var(--muted); line-height: 1.65; }

    /* ── lucky section ── */
    .lucky-sec {
      border-top: 1px solid rgba(181,36,58,.13);
      padding-top: 24px;
      opacity: 0;
      animation: fadeUp .5s ease 1.05s forwards;
    }
    .lucky-ttl {
      text-align: center;
      font-size: .74rem;
      color: var(--muted);
      letter-spacing: 4px;
      margin-bottom: 16px;
    }
    .lucky-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .lucky-box {
      background: rgba(181,36,58,.04);
      border: 1px solid rgba(181,36,58,.09);
      border-radius: 3px;
      padding: 13px 14px;
    }
    .lucky-lbl { font-size: .67rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 5px; }
    .lucky-val { font-size: .85rem; font-weight: 500; color: var(--text); letter-spacing: .5px; }
    .cdot {
      display: inline-block;
      width: 11px; height: 11px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .day-msg {
      background: linear-gradient(135deg, rgba(181,36,58,.05), rgba(201,150,42,.05));
      border: 1px solid rgba(181,36,58,.1);
      border-radius: 3px;
      padding: 14px 18px;
      font-size: .84rem;
      color: var(--text);
      line-height: 1.75;
      letter-spacing: .4px;
      text-align: center;
    }
    .day-msg em {
      font-style: normal;
      color: var(--red);
      margin: 0 4px;
    }

    /* ── paper seal stamp ── */
    .stamp {
      position: absolute;
      bottom: 22px; right: 22px;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(181,36,58,.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      opacity: .22;
      transform: rotate(-12deg);
      pointer-events: none;
    }

    /* ── redraw section ── */
    .redraw-sec {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
    }
    .redraw-note {
      font-size: .76rem;
      color: rgba(255,255,255,.3);
      letter-spacing: 2px;
    }
    .redraw-btn {
      background: transparent;
      border: 1px solid rgba(201,150,42,.28);
      border-radius: 2px;
      color: rgba(255,255,255,.45);
      font-family: 'Noto Serif JP', serif;
      font-size: .8rem;
      letter-spacing: 3px;
      padding: 10px 32px;
      cursor: pointer;
      transition: all .2s;
    }
    .redraw-btn:hover {
      border-color: rgba(201,150,42,.6);
      color: rgba(255,255,255,.8);
      background: rgba(201,150,42,.06);
    }

    footer {
      margin-top: 56px;
      font-size: .72rem;
      color: rgba(255,255,255,.15);
      letter-spacing: 2px;
      text-align: center;
      position: relative; z-index: 1;
    }
  </style>
</head>

/* ═══════════ PRNG (Mulberry32) ═══════════ */
function makeRng(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rngInt(rng, max) { return Math.floor(rng() * max); }
function rngPick(rng, arr) { return arr[rngInt(rng, arr.length)]; }

/* ═══════════ DATE SEED ═══════════ */
function dateSeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function pickLevel(rng) {
  const total = LVL_W.reduce((a,b) => a+b, 0);
  let r = rng() * total;
  for (let i = 0; i < LEVELS.length; i++) {
    r -= LVL_W[i];
    if (r <= 0) return LEVELS[i];
  }
  return '末吉';
}

function buildFortune() {
  const rng = makeRng(dateSeed());
  const catLevels = CATS.map(() => pickLevel(rng));
  // overall = most common level among categories; tie → first
  const freq = {};
  catLevels.forEach(l => freq[l] = (freq[l]||0) + 1);
  const overall = catLevels.reduce((a,b) => (freq[b]||0) > (freq[a]||0) ? b : a);
  return {
    catLevels,
    overall,
    action:  rngPick(rng, ACTIONS),
    color:   rngPick(rng, COLORS),
    message: rngPick(rng, MSGS[overall]),
  };
}

/* ═══════════ RENDER ═══════════ */
function starsHtml(n) {
  return Array.from({length:5},(_,i) =>
    `<s class="${i<n?'on':''}">${i<n?'★':'☆'}</s>`
  ).join('');
}

function showFortune() {
  const f = buildFortune();
  const paper = document.getElementById('paper');

  /* date label */
  const d = new Date();
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  const label = `${d.getFullYear()}年 ${d.getMonth()+1}月${d.getDate()}日（${w}）の運勢`;
  document.getElementById('paperDateLbl').textContent = label;

  /* overall seal */
  const st = LVL_STYLE[f.overall];
  const seal = document.getElementById('overallSeal');
  seal.textContent = f.overall;
  seal.style.background = `radial-gradient(circle at 40% 35%, ${st.bg}ee, ${st.bg})`;
  seal.style.boxShadow  = `0 4px 20px ${st.glow}`;

  /* category cards */
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CATS.forEach((cat, i) => {
    const lv  = f.catLevels[i];
    const lst = LVL_STYLE[lv];
    const div = document.createElement('div');
    div.className = 'cat-card';
    div.style.setProperty('border-top-color', lst.bg);
    // apply accent bar
    div.style.cssText += '';
    div.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="lvl-badge" style="background:${lst.bg};box-shadow:0 3px 12px ${lst.glow}">${lv}</div>
      <div class="stars">${starsHtml(lst.stars)}</div>
      <div class="cat-msg">${cat.msgs[lv]}</div>
    `;
    div.style.borderTop = `3px solid ${lst.bg}`;
    grid.appendChild(div);
  });

  /* lucky */
  document.getElementById('lAction').textContent = f.action;
  document.getElementById('lColor').innerHTML =
    `<span class="cdot" style="background:${f.color.hex}"></span>${f.color.name}`;
  document.getElementById('dayMsg').innerHTML =
    `<em>❝</em>${f.message}<em>❞</em>`;

  /* show paper */
  paper.classList.remove('open');
  void paper.offsetWidth;
  paper.classList.add('open');

  document.getElementById('drawSec').style.display   = 'none';
  document.getElementById('redrawSec').style.display = 'flex';

  setTimeout(() => paper.scrollIntoView({ behavior:'smooth', block:'start' }), 80);
}

/* ═══════════ PETALS ═══════════ */
(function createPetals() {
  const wrap = document.getElementById('petalsWrap');
  for (let i = 0; i < 18; i++) {
    const p   = document.createElement('div');
    p.className = 'petal';
    const w = 9  + Math.random() * 9;
    const h = 12 + Math.random() * 10;
    const drift = (Math.random() > .5 ? 1 : -1) * (30 + Math.random() * 60);
    p.style.cssText = `
      left:${Math.random()*100}%;
      animation-duration:${9 + Math.random()*12}s;
      animation-delay:${Math.random()*12}s;
      --drift:${drift}px;
    `;
    p.querySelector = undefined;
    const inner = document.createElement('div');
    inner.style.cssText = `
      width:${w}px; height:${h}px;
      background:linear-gradient(135deg,#ffd0de,#ffb0c8);
      border-radius:80% 0 80% 0;
      opacity:.75;
      transform:rotate(${Math.random()*360}deg);
    `;
    p.appendChild(inner);
    wrap.appendChild(p);
  }
})();

  const btn = document.getElementById('drawBtn');

})();
