<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占星術診断 — Astrology</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#07071a;
  --bg2:#0d0d28;
  --surface:rgba(255,255,255,0.05);
  --surface2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.1);
  --text:#e8e8f8;
  --dim:#8888b8;
  --gold:#f0c060;
  --gold2:#ffd980;
  --purple:#9b6dff;
  --pink:#ff6eb4;
  --cyan:#60d8ff;
  --green:#60ffb4;
  --r:16px;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── STARFIELD ── */
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:.9;transform:scale(1.4);}}

/* ── LAYOUT ── */
.page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 80px;}

/* ── HEADER ── */
header{text-align:center;padding:48px 0 36px;}
.hbadge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(155,109,255,.15);border:1px solid rgba(155,109,255,.35);
  border-radius:100px;padding:6px 20px;font-size:.72rem;
  color:var(--purple);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px;
}
h1{
  font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#fff 0%,var(--gold) 40%,var(--purple) 80%,var(--pink) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;
}
.hsub{color:var(--dim);font-size:.95rem;letter-spacing:.05em;}

/* ── TABS ── */
.tabs{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin-bottom:32px;
}
.tab{
  padding:9px 22px;background:var(--surface);border:1px solid var(--border);
  border-radius:100px;color:var(--dim);font-size:.82rem;cursor:pointer;
  transition:all .2s;letter-spacing:.05em;
}
.tab:hover{border-color:rgba(255,255,255,.2);color:var(--text);}
.tab.on{
  background:linear-gradient(135deg,var(--purple),var(--pink));
  border-color:transparent;color:#fff;
  box-shadow:0 4px 20px rgba(155,109,255,.4);
}

/* ── PANEL ── */
.panel{display:none;}
.panel.on{display:block;}

/* ── ZODIAC GRID ── */
.zodiac-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
  gap:10px;margin-bottom:28px;
}
.zcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:14px 6px 12px;text-align:center;
  cursor:pointer;transition:all .22s;user-select:none;
}
.zcard:hover{background:var(--surface2);border-color:rgba(255,255,255,.2);transform:translateY(-3px);}
.zcard.sel{
  border-color:var(--gold);background:rgba(240,192,96,.1);
  box-shadow:0 0 20px rgba(240,192,96,.25);
}
.zcard .sym{font-size:1.9rem;margin-bottom:4px;}
.zcard .zname{font-size:.72rem;color:var(--dim);letter-spacing:.04em;}
.zcard.sel .zname{color:var(--gold);}

/* ── RESULT CARD ── */
.result-wrap{animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.result-hero{
  background:linear-gradient(135deg,rgba(155,109,255,.18),rgba(255,110,180,.12));
  border:1px solid rgba(155,109,255,.3);
  border-radius:var(--r);padding:28px 28px 24px;margin-bottom:18px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
}
.hero-sym{font-size:4rem;filter:drop-shadow(0 0 16px rgba(240,192,96,.6));}
.hero-info h2{font-size:1.6rem;font-weight:800;color:var(--gold);}
.hero-info .hdates{color:var(--dim);font-size:.82rem;margin:.2rem 0;}
.hero-info .helmt{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.badge{
  padding:3px 12px;border-radius:100px;font-size:.72rem;font-weight:600;letter-spacing:.05em;
}
.badge-fire{background:rgba(255,100,60,.18);color:#ff8060;border:1px solid rgba(255,100,60,.3);}
.badge-earth{background:rgba(80,200,100,.18);color:#60d090;border:1px solid rgba(80,200,100,.3);}
.badge-air{background:rgba(96,216,255,.18);color:#60d8ff;border:1px solid rgba(96,216,255,.3);}
.badge-water{background:rgba(80,120,255,.18);color:#8090ff;border:1px solid rgba(80,120,255,.3);}
.badge-ruler{background:rgba(240,192,96,.15);color:var(--gold);border:1px solid rgba(240,192,96,.3);}

/* ── SECTION CARDS ── */
.cards-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:14px;}
.info-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
}
.info-card h3{
  font-size:.82rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-bottom:12px;display:flex;align-items:center;gap:7px;
}
.info-card h3 .ico{font-size:1rem;}
.info-card p{font-size:.88rem;line-height:1.75;color:var(--text);}

/* ── TRAIT BARS ── */
.trait-list{display:flex;flex-direction:column;gap:10px;}
.trait{display:flex;flex-direction:column;gap:5px;}
.trait-top{display:flex;justify-content:space-between;font-size:.8rem;}
.trait-top .tlabel{color:var(--text);}
.trait-top .tval{color:var(--gold);}
.trait-bar{height:6px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;}
.trait-fill{height:100%;border-radius:100px;transition:width .8s cubic-bezier(.4,0,.2,1);}

/* ── SCORE STARS ── */
.score-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.stars{display:flex;gap:3px;}
.star-i{font-size:1.1rem;transition:opacity .3s;}
.star-i.off{opacity:.25;}

/* ── FORTUNE SECTION ── */
.fortune-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;}
.fortune-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:18px;text-align:center;
}
.fortune-card .fc-ico{font-size:1.8rem;margin-bottom:8px;}
.fortune-card .fc-label{font-size:.7rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.fortune-card .fc-stars{justify-content:center;margin-bottom:8px;}
.fortune-card .fc-msg{font-size:.82rem;color:var(--text);line-height:1.6;}

.lucky-row{
  background:linear-gradient(135deg,rgba(240,192,96,.1),rgba(155,109,255,.08));
  border:1px solid rgba(240,192,96,.25);border-radius:var(--r);
  padding:18px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;
}
.lucky-item{text-align:center;}
.lucky-label{font-size:.68rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.lucky-value{font-size:1rem;font-weight:700;color:var(--gold);}

/* ── COMPATIBILITY ── */
.compat-section{}
.compat-select-row{
  display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;
  margin-bottom:24px;
}
.compat-select-row .vs{
  display:flex;align-items:center;justify-content:center;padding-top:50px;
  font-size:1.2rem;font-weight:800;color:var(--dim);
}
.compat-sub-label{font-size:.75rem;color:var(--dim);text-align:center;margin-bottom:8px;letter-spacing:.06em;}
.compat-mini-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.cz{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:6px 2px;text-align:center;cursor:pointer;transition:all .18s;
}
.cz:hover{background:var(--surface2);}
.cz.sel-a{border-color:var(--purple);background:rgba(155,109,255,.15);}
.cz.sel-b{border-color:var(--pink);background:rgba(255,110,180,.15);}
.cz .czsym{font-size:1.15rem;}
.cz .czname{font-size:.58rem;color:var(--dim);}

.compat-result{
  background:linear-gradient(135deg,rgba(155,109,255,.15),rgba(255,110,180,.1));
  border:1px solid rgba(155,109,255,.3);border-radius:var(--r);
  padding:28px;text-align:center;animation:fadeUp .4s ease both;
}
.compat-symbols{font-size:3rem;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:16px;}
.compat-names{font-size:.85rem;color:var(--dim);margin-bottom:20px;}
.compat-score-big{
  font-size:4rem;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;margin-bottom:4px;
}
.compat-pct{font-size:1rem;color:var(--dim);margin-bottom:20px;}
.compat-meter{
  height:10px;background:rgba(255,255,255,.08);border-radius:100px;
  overflow:hidden;max-width:360px;margin:0 auto 24px;
}
.compat-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--purple),var(--pink),var(--gold));
  transition:width 1s cubic-bezier(.4,0,.2,1);
}
.compat-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;text-align:left;}
.cc-item{background:var(--surface);border-radius:10px;padding:12px;}
.cc-item .cc-lbl{font-size:.72rem;color:var(--dim);margin-bottom:6px;letter-spacing:.06em;}
.cc-item .cc-bar{height:5px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;}
.cc-item .cc-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--purple),var(--pink));}
.cc-item .cc-pct{font-size:.78rem;color:var(--text);margin-top:4px;font-weight:600;}
.compat-msg{
  background:var(--surface);border-radius:12px;padding:16px;margin-top:16px;
  font-size:.88rem;line-height:1.75;color:var(--text);text-align:left;
}

/* ── TODAY PANEL ── */
.today-hero{
  background:linear-gradient(135deg,rgba(96,216,255,.1),rgba(155,109,255,.12));
  border:1px solid rgba(96,216,255,.25);border-radius:var(--r);
  padding:24px;margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.today-date{font-size:.82rem;color:var(--cyan);letter-spacing:.08em;margin-bottom:4px;}
.today-title{font-size:1.5rem;font-weight:800;color:#fff;}
.today-moon{font-size:1.1rem;color:var(--dim);margin-top:4px;}
.today-all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.today-zcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:12px 8px;text-align:center;
  cursor:pointer;transition:all .2s;
}
.today-zcard:hover{background:var(--surface2);transform:translateY(-2px);}
.today-zcard .tz-sym{font-size:1.6rem;margin-bottom:4px;}
.today-zcard .tz-name{font-size:.68rem;color:var(--dim);margin-bottom:8px;}
.today-zcard .tz-score{display:flex;justify-content:center;gap:2px;}
.today-zcard .ts{font-size:.75rem;}
.today-zcard .ts.off{opacity:.2;}

.today-detail{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:22px;animation:fadeUp .3s ease both;
}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:20px 0;}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .compat-select-row{grid-template-columns:1fr;gap:16px;}
  .compat-select-row .vs{padding-top:0;}
  .compat-mini-grid{grid-template-columns:repeat(6,1fr);}
  .result-hero{gap:14px;}
  .hero-sym{font-size:3rem;}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="page">
  <header>
    <div class="hbadge">✦ Astrology ✦</div>
    <h1>占星術診断</h1>

  <div class="tabs">

  </div>

  <!-- ── DIAGNOSIS PANEL ── -->
  <div class="panel on" id="tab-diagnosis">
    <div class="zodiac-grid" id="diagGrid"></div>
    <div id="diagResult"></div>
  </div>

  <!-- ── COMPAT PANEL ── -->
  <div class="panel" id="tab-compat">
    <div class="compat-section">
      <div class="compat-select-row">

          <div class="compat-sub-label">あなたの星座</div>

        </div>
        <div class="vs">VS</div>
        <div>
          <div class="compat-sub-label">相手の星座</div>

      </div>
      <div id="compatResult"></div>

  </div>

  <!-- ── TODAY PANEL ── -->
  <div class="panel" id="tab-today">

      <div style="font-size:2.8rem;">🌙</div>

        <div class="today-date" id="todayDate"></div>

</div>

  cancer:{

// Today's fortune seed (based on date)
function dateSeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
}

function seededRand(seed, idx) {
  let x = Math.sin(seed + idx * 9301 + 49297) * 233280;
  return x - Math.floor(x);
}

function getTodayFortune(signIdx) {
  const seed = dateSeed() + signIdx * 100;
  const overall = Math.floor(seededRand(seed, 1) * 3) + 3; // 3-5
  const love    = Math.floor(seededRand(seed, 2) * 3) + 3;
  const work    = Math.floor(seededRand(seed, 3) * 3) + 3;
  const money   = Math.floor(seededRand(seed, 4) * 3) + 3;
  const health  = Math.floor(seededRand(seed, 5) * 3) + 3;
  const luckNum = Math.floor(seededRand(seed, 6) * 99) + 1;
  const colors  = ['赤','橙','黄','緑','水色','青','紫','ピンク','白','金','銀','茶'];
  const luckColor = colors[Math.floor(seededRand(seed, 7) * colors.length)];
  const items   = ['傘','本','カフェ','音楽','散歩','電話','手紙','花','空','笑顔','朝日','星'];
  const luckItem = items[Math.floor(seededRand(seed, 8) * items.length)];

  const msgs = [
    ['新しい流れが始まる予感。積極的な一歩が運を開きます。','計画が実を結ぶ吉日。落ち着いて取り組んで。','直感を信じて動くと思わぬ展開が。','周囲との調和が幸運を呼ぶ一日です。','少し慎重に。休息も大切な投資です。'],
    ['素直な気持ちを伝えると関係が深まります。','ときめきの予感あり。目線を意識してみて。','大切な人との時間を優先して。','新しい出会いの可能性が高まる日。','焦らず相手のペースを尊重して。'],
    ['アイデアが湧き出る日。メモを忘れずに。','集中力が高まる好機。難題に挑んで。','チームワークが成果につながる一日。','上司や先輩からのサポートを期待して。','着実な積み重ねが評価される日です。'],
  ];
  const overallMsg = msgs[0][Math.floor(seededRand(seed, 9) * 5)];
  const loveMsg    = msgs[1][Math.floor(seededRand(seed, 10)* 5)];
  const workMsg    = msgs[2][Math.floor(seededRand(seed, 11)* 5)];

  return { overall, love, work, money, health, luckNum, luckColor, luckItem, overallMsg, loveMsg, workMsg };
}

const MOON_PHASES = ['🌑 新月','🌒 三日月','🌓 上弦の月','🌔 十三夜月','🌕 満月','🌖 十六夜月','🌗 下弦の月','🌘 晦月'];
function getMoonPhase() {
  const d = new Date();
  const cycle = 29.53;
  const known = new Date(2000, 0, 6); // known new moon
  const diff = (d - known) / (1000*60*60*24);
  const phase = ((diff % cycle + cycle) % cycle) / cycle;
  return MOON_PHASES[Math.floor(phase * 8)];
}

// ── COMPATIBILITY ──────────────────────────────────────────────────────────

let compatA = null, compatB = null;

function buildCompatGrid(containerId, side) {
  const g = document.getElementById(containerId);
  SIGNS.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'cz';
    d.innerHTML = `<div class="czsym">${s.sym}</div><div class="czname">${s.name.replace('座','')}</div>`;
    d.dataset.i = i;
    d.addEventListener('click', () => {
      document.querySelectorAll(`#${containerId} .cz`).forEach(el => el.classList.remove(side==='a'?'sel-a':'sel-b'));
      d.classList.add(side==='a'?'sel-a':'sel-b');
      if (side==='a') compatA = i; else compatB = i;
      if (compatA !== null && compatB !== null) renderCompat();
    });
    g.appendChild(d);
  });
}

buildCompatGrid('compatGridA', 'a');
buildCompatGrid('compatGridB', 'b');

function renderCompat() {
  const sa = SIGNS[compatA], sb = SIGNS[compatB];
  const score = COMPAT[sa.id][sb.id];
  const level = score >= 78 ? 'high' : score >= 60 ? 'mid' : 'low';
  const msgs = COMPAT_MESSAGES[level];
  const msg = msgs[Math.floor(Math.random() * msgs.length)];

  // Category scores
  const cats = [
    { l:'愛情面', v: Math.min(100, score + (Math.random()*20|0) - 10) },
    { l:'友情面', v: Math.min(100, score + (Math.random()*20|0) - 5)  },
    { l:'価値観', v: Math.min(100, score + (Math.random()*24|0) - 12) },
    { l:'知的相性', v: Math.min(100, score + (Math.random()*22|0) - 11)},
    { l:'長続き度', v: Math.min(100, score + (Math.random()*20|0) - 8) },
    { l:'信頼感', v: Math.min(100, score + (Math.random()*18|0) - 9)  },
  ].map(c => ({l: c.l, v: Math.max(20, Math.round(c.v))}));

  document.getElementById('compatResult').innerHTML = `
  <div class="compat-result">
    <div class="compat-symbols">
      <span title="${sa.name}">${sa.sym}</span>
      <span style="font-size:1.5rem;color:var(--dim);">✦</span>
      <span title="${sb.name}">${sb.sym}</span>
    </div>
    <div class="compat-names">${sa.name} &amp; ${sb.name}</div>
    <div class="compat-score-big">${score}</div>
    <div class="compat-pct">/ 100 点</div>
    <div class="compat-meter"><div class="compat-fill" style="width:0%" id="cfill"></div></div>
    <div class="compat-cats">
      ${cats.map(c => `
        <div class="cc-item">
          <div class="cc-lbl">${c.l}</div>
          <div class="cc-bar"><div class="cc-fill" style="width:0%" data-w="${c.v}%"></div></div>
          <div class="cc-pct">${c.v}%</div>
        </div>`).join('')}
    </div>
    <div class="compat-msg">${msg}</div>
  </div>`;

  requestAnimationFrame(() => {
    const fill = document.getElementById('cfill');
    if (fill) fill.style.width = score + '%';
    document.querySelectorAll('.cc-fill').forEach(el => {
      const w = el.dataset.w;
      requestAnimationFrame(() => { el.style.width = w; });
    });
  });
}

// ── STARFIELD ─────────────────────────────────────────────────────────────

(function() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random(),
        s: Math.random() * 0.005 + 0.002,
        dir: Math.random() > 0.5 ? 1 : -1,
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.a += s.s * s.dir;
      if (s.a > 1 || s.a < 0.1) s.dir *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize();
  initStars();
  draw();
  window.addEventListener('resize', () => { resize(); initStars(); });
})();
</script>
