<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前世診断 — Past Life Oracle</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Serif+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:  #07041a;
      --deep:  #0d0825;
      --vio:   #7c3aed;
      --vio2:  #a78bfa;
      --cyan:  #06b6d4;
      --gold:  #f59e0b;
      --goldt: #fbbf24;
      --text:  rgba(255,255,255,.88);
      --mute:  rgba(255,255,255,.45);
      --card:  rgba(255,255,255,.04);
      --bord:  rgba(255,255,255,.08);
    }

    body {
      min-height: 100vh;
      background: var(--void);
      font-family: 'Noto Serif JP', serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 80px;
      overflow-x: hidden;
      position: relative;
    }

    /* ── nebula bg ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 10%  5%,  rgba(124,58,237,.22) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 95%,  rgba(6,182,212,.18)  0%, transparent 55%),
        radial-gradient(ellipse 40% 50% at 80% 10%,  rgba(245,158,11,.12) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 20% 90%,  rgba(124,58,237,.14) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
      animation: orbFloat ease-in-out infinite;
    }
    .orb-1 { width:380px; height:380px; background:rgba(124,58,237,.18); top:-80px;  left:-100px; animation-duration:14s; }
    .orb-2 { width:300px; height:300px; background:rgba(6,182,212,.14);  bottom:-60px; right:-80px; animation-duration:18s; animation-delay:-6s; }
    .orb-3 { width:240px; height:240px; background:rgba(245,158,11,.10); top:45%;   right:5%;   animation-duration:22s; animation-delay:-10s; }

    @keyframes orbFloat {
      0%,100% { transform: translateY(0)   scale(1); }
      50%      { transform: translateY(-28px) scale(1.06); }
    }

    canvas#stars {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── layout ── */
    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 680px;
      padding-top: 56px;
    }

    /* ── header ── */
    header { text-align: center; margin-bottom: 52px; }

    .crystal-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    .crystal {
      font-size: 4rem;
      display: block;
      filter: drop-shadow(0 0 20px rgba(124,58,237,.8)) drop-shadow(0 0 40px rgba(6,182,212,.4));
      animation: crystalPulse 3s ease-in-out infinite;
    }
    @keyframes crystalPulse {
      0%,100% { filter: drop-shadow(0 0 20px rgba(124,58,237,.8)) drop-shadow(0 0 40px rgba(6,182,212,.4)); transform: scale(1); }
      50%      { filter: drop-shadow(0 0 30px rgba(124,58,237,1))  drop-shadow(0 0 60px rgba(6,182,212,.6)); transform: scale(1.06); }
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(124,58,237,.4);
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      animation: ringExpand 3s ease-in-out infinite;
    }
    .ring-1 { width: 80px;  height: 80px;  animation-delay: 0s; }
    .ring-2 { width: 110px; height: 110px; animation-delay: .6s; border-color: rgba(6,182,212,.25); }
    .ring-3 { width: 140px; height: 140px; animation-delay: 1.2s; border-color: rgba(245,158,11,.15); }

    @keyframes ringExpand {
      0%   { opacity: 0.8; transform: translate(-50%,-50%) scale(.9); }
      50%  { opacity: 0.4; transform: translate(-50%,-50%) scale(1.05); }
      100% { opacity: 0.8; transform: translate(-50%,-50%) scale(.9); }
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #f59e0b 0%, #fde68a 40%, #a78bfa 70%, #7c3aed 100%);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShimmer 6s linear infinite;
      margin-bottom: 6px;
    }
    @keyframes titleShimmer { to { background-position: 200%; } }

    .sub {
      font-family: 'Cinzel Decorative', serif;
      font-size: .72rem;
      color: var(--mute);
      letter-spacing: 6px;
      margin-bottom: 14px;
    }

    .desc {
      font-size: .88rem;
      color: rgba(255,255,255,.5);
      letter-spacing: 2px;
      font-weight: 300;
    }

    /* ── divider ── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 0 auto 40px;
      max-width: 300px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.5), transparent);
    }
    .divider span { font-size: .75rem; color: rgba(124,58,237,.7); letter-spacing: 3px; }

    /* ── input card ── */
    .input-card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 12px;
      padding: 40px 36px 44px;
      text-align: center;
      box-shadow: 0 0 60px rgba(124,58,237,.08), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .input-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.6), rgba(6,182,212,.4), transparent);
    }

    .input-label {
      font-size: .78rem;
      color: var(--vio2);
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    .date-selects {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .sel-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .sel-lbl {
      font-size: .66rem;
      color: var(--mute);
      letter-spacing: 2px;
    }
    .sel-wrap select {
      appearance: none;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(124,58,237,.3);
      border-radius: 6px;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: .92rem;
      padding: 10px 32px 10px 14px;
      cursor: pointer;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .sel-wrap select:focus {
      border-color: rgba(124,58,237,.7);
      box-shadow: 0 0 14px rgba(124,58,237,.25);
    }
    .sel-wrap::after {
      content: '▾';
      position: absolute; bottom: 10px; right: 10px;
      font-size: .7rem;
      color: var(--vio2);
      pointer-events: none;
    }

    .oracle-btn {
      position: relative;
      padding: 18px 64px;
      background: linear-gradient(135deg, #4c1d95, #7c3aed, #6d28d9);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 4px;
      cursor: pointer;
      box-shadow: 0 6px 28px rgba(124,58,237,.5), 0 0 0 1px rgba(167,139,250,.2);
      transition: transform .18s, box-shadow .18s;
      overflow: hidden;
    }
    .oracle-btn::before {
      content: '';
      position: absolute; top: 0; left: -120%;
      width: 80%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
      transform: skewX(-20deg);
      transition: left .45s;
    }
    .oracle-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(124,58,237,.65), 0 0 0 1px rgba(167,139,250,.4); }
    .oracle-btn:hover::before { left: 150%; }
    .oracle-btn:active { transform: translateY(0); }
    .oracle-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── scanning animation ── */
    .scan-overlay {
      display: none;
      position: fixed; inset: 0;
      z-index: 100;
      background: rgba(7,4,26,.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
    }
    .scan-overlay.active { display: flex; }

    .scan-circle {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--vio);
      border-right-color: var(--cyan);
      animation: scanSpin 1s linear infinite;
      position: relative;
    }
    .scan-circle::before {
      content: '🔮';
      font-size: 2.5rem;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      filter: drop-shadow(0 0 16px rgba(124,58,237,.9));
    }
    @keyframes scanSpin { to { transform: rotate(360deg); } }

    .scan-txt {
      font-size: .85rem;
      color: var(--vio2);
      letter-spacing: 4px;
      animation: scanBlink 1.2s ease-in-out infinite;
    }
    @keyframes scanBlink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── result card ── */
    .result-card {
      display: none;
      opacity: 0;
      transform: translateY(24px) scale(.97);
    }
    .result-card.open {
      display: block;
      animation: resultAppear .7s cubic-bezier(.22,.68,0,1.15) forwards;
    }
    @keyframes resultAppear {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-inner {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(124,58,237,.2);
      border-radius: 12px;
      padding: 42px 36px 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(124,58,237,.1);
    }
    .result-inner::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-color, #7c3aed), rgba(6,182,212,.4), transparent);
    }

    /* glow overlay matching accent */
    .result-glow {
      position: absolute; inset: 0;
      border-radius: 12px;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 40% at 50% 0%, var(--accent-color, rgba(124,58,237,.15)), transparent 60%);
    }

    .result-badge {
      text-align: center;
      margin-bottom: 30px;
    }
    .past-era {
      display: inline-block;
      font-size: .7rem;
      color: var(--goldt);
      border: 1px solid rgba(245,158,11,.35);
      border-radius: 20px;
      padding: 4px 16px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .past-symbol {
      display: block;
      font-size: 3.2rem;
      margin: 12px 0;
      filter: drop-shadow(0 0 14px var(--accent-color, rgba(124,58,237,.8)));
    }
    .past-name {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 30px var(--accent-color, rgba(124,58,237,.8));
      margin-bottom: 4px;
    }
    .past-name-en {
      font-family: 'Cinzel Decorative', serif;
      font-size: .72rem;
      color: var(--mute);
      letter-spacing: 3px;
    }
    .past-period {
      display: inline-block;
      font-size: .75rem;
      color: rgba(167,139,250,.7);
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* horizontal rule */
    .hr {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.35), rgba(6,182,212,.2), transparent);
      margin: 26px 0;
    }

    /* ── info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 28px;
    }
    @media (max-width: 500px) {
      .info-grid { grid-template-columns: 1fr; }
      .result-inner { padding: 32px 20px 38px; }
      .input-card { padding: 32px 20px 36px; }
    }

    .info-block {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--bord);
      border-radius: 8px;
      padding: 18px 16px;
      opacity: 0;
      transform: translateY(14px);
      animation: blockIn .5s ease forwards;
    }
    .info-block.full { grid-column: 1 / -1; }
    .info-block:nth-child(1) { animation-delay: .45s; }
    .info-block:nth-child(2) { animation-delay: .6s; }
    .info-block:nth-child(3) { animation-delay: .75s; }
    .info-block:nth-child(4) { animation-delay: .9s; }

    @keyframes blockIn { to { opacity: 1; transform: translateY(0); } }

    .block-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .block-icon { font-size: 1.1rem; }
    .block-lbl {
      font-size: .66rem;
      letter-spacing: 3px;
      color: var(--vio2);
    }

    .block-body {
      font-size: .85rem;
      line-height: 1.75;
      color: rgba(255,255,255,.78);
    }

    .trait-list {
      display: flex; flex-wrap: wrap; gap: 7px;
      margin-top: 2px;
    }
    .trait {
      font-size: .74rem;
      padding: 4px 12px;
      background: rgba(124,58,237,.12);
      border: 1px solid rgba(124,58,237,.25);
      border-radius: 20px;
      color: var(--vio2);
    }

    .message-box {
      font-size: .88rem;
      line-height: 1.85;
      color: rgba(255,255,255,.82);
      font-style: italic;
      text-align: center;
      padding: 6px 4px;
      position: relative;
    }
    .message-box::before, .message-box::after {
      font-style: normal;
      color: var(--gold);
      font-size: 1.1rem;
    }
    .message-box::before { content: '❝ '; }
    .message-box::after  { content: ' ❞'; }

    /* ── reset ── */
    .reset-area {
      text-align: center;
      opacity: 0;
      animation: blockIn .5s ease 1.15s forwards;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid rgba(124,58,237,.35);
      border-radius: 6px;
      color: rgba(255,255,255,.5);
      font-family: 'Noto Serif JP', serif;
      font-size: .8rem;
      letter-spacing: 3px;
      padding: 11px 32px;
      cursor: pointer;
      transition: all .2s;
    }
    .reset-btn:hover {
      border-color: rgba(124,58,237,.7);
      color: rgba(255,255,255,.85);
      background: rgba(124,58,237,.08);
      box-shadow: 0 0 20px rgba(124,58,237,.2);
    }

    /* ── number badge ── */
    .plife-num {
      position: absolute; bottom: 18px; right: 22px;
      font-family: 'Cinzel Decorative', serif;
      font-size: .68rem;
      color: rgba(255,255,255,.15);
      letter-spacing: 2px;
    }

    footer {
      position: relative; z-index: 1;
      margin-top: 60px;
      font-size: .7rem;
      color: rgba(255,255,255,.15);
      letter-spacing: 2px;
      text-align: center;
    }
  </style>
</head>

/* ═══════════ STAR CANVAS ═══════════ */
(function initStars() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];

  function resize() {
    c.width  = window.innerWidth;
    c.height = window.innerHeight;
    stars = Array.from({ length: 160 }, () => ({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.4 + 0.2,
      a: Math.random(),
      speed: .003 + Math.random() * .006,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    stars.forEach(s => {
      const alpha = .3 + .6 * (Math.sin(t * s.speed + s.phase) * .5 + .5);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

/* ═══════════ ALGORITHM ═══════════ */
function calcIndex(y, m, d) {
  // Numerological mapping: combines year + month + day non-trivially
  const v = (y * 31 + m * 17 + d * 13 + Math.floor(y / 100) * 7);
  return ((v % PAST_LIVES.length) + PAST_LIVES.length) % PAST_LIVES.length;
}

/* ═══════════ BUILD SELECTS ═══════════ */
(function buildSelects() {
  const wrap = document.getElementById('dateSelects');

  // Year
  const yrWrap = document.createElement('div');
  yrWrap.className = 'sel-wrap';
  const yrLbl = document.createElement('div'); yrLbl.className = 'sel-lbl'; yrLbl.textContent = '年';
  const yrSel = document.createElement('select'); yrSel.id = 'selY';
  yrSel.innerHTML = '<option value="">----</option>';
  for (let y = 2010; y >= 1920; y--) {
    yrSel.innerHTML += `<option value="${y}">${y}</option>`;
  }
  yrWrap.append(yrLbl, yrSel);

  // Month
  const moWrap = document.createElement('div'); moWrap.className = 'sel-wrap';
  const moLbl = document.createElement('div'); moLbl.className = 'sel-lbl'; moLbl.textContent = '月';
  const moSel = document.createElement('select'); moSel.id = 'selM';
  moSel.innerHTML = '<option value="">--</option>';
  for (let m = 1; m <= 12; m++) moSel.innerHTML += `<option value="${m}">${m}</option>`;
  moWrap.append(moLbl, moSel);

  // Day
  const dyWrap = document.createElement('div'); dyWrap.className = 'sel-wrap';
  const dyLbl = document.createElement('div'); dyLbl.className = 'sel-lbl'; dyLbl.textContent = '日';
  const dySel = document.createElement('select'); dySel.id = 'selD';
  dySel.innerHTML = '<option value="">--</option>';
  for (let d = 1; d <= 31; d++) dySel.innerHTML += `<option value="${d}">${d}</option>`;
  dyWrap.append(dyLbl, dySel);

  wrap.append(yrWrap, moWrap, dyWrap);
})();

/* ═══════════ DIVINE ═══════════ */
function divine() {
  const y = parseInt(document.getElementById('selY').value);
  const m = parseInt(document.getElementById('selM').value);
  const d = parseInt(document.getElementById('selD').value);

  if (!y || !m || !d) {
    shake(document.getElementById('inputCard'));
    return;
  }

  const btn = document.getElementById('oracleBtn');
  btn.disabled = true;

  // Show scanning overlay
  const overlay = document.getElementById('scanOverlay');
  overlay.classList.add('active');

  setTimeout(() => {
    overlay.classList.remove('active');
    btn.disabled = false;

    const idx = calcIndex(y, m, d);
    renderResult(PAST_LIVES[idx], idx + 1, y, m, d);
  }, 2000);
}

function shake(el) {
  el.style.animation = 'none';
  el.offsetWidth;
  el.style.animation = 'shake .4s ease';
  setTimeout(() => el.style.animation = '', 400);

  // inject shake keyframe once
  if (!document.getElementById('shakeKF')) {
    const s = document.createElement('style');
    s.id = 'shakeKF';
    s.textContent = `@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}`;
    document.head.appendChild(s);
  }
}

function renderResult(pl, num, y, m, d) {
  const card = document.getElementById('resultCard');

  // Build inner HTML
  const traitsHtml = pl.traits.map(t => `<span class="trait">${t}</span>`).join('');
  const hexAlpha   = pl.hue + '28';
  const hexBorder  = pl.hue + '40';

  card.innerHTML = `
    <div class="result-inner" style="--accent-color:${pl.hue}">
      <div class="result-glow"></div>

      <div class="result-badge">
        <div class="past-era">${pl.era}</div>
        <span class="past-symbol">${pl.symbol}</span>
        <div class="past-name">${pl.name}</div>
        <div class="past-name-en">${pl.nameEn}</div>
        <div class="past-period">${pl.period}</div>
      </div>

      <div class="hr"></div>

      <div class="info-grid">
        <div class="info-block" style="border-color:${hexBorder};background:${hexAlpha}">
          <div class="block-head">
            <span class="block-icon">💼</span>
            <span class="block-lbl">前世の役職</span>
          </div>
          <div class="block-body">${pl.role}</div>
        </div>

        <div class="info-block" style="border-color:${hexBorder};background:${hexAlpha}">
          <div class="block-head">
            <span class="block-icon">⏳</span>
            <span class="block-lbl">前世の時代</span>
          </div>
          <div class="block-body">
            <strong style="color:#fff;letter-spacing:1px">${pl.era}</strong><br>
            <span style="font-size:.78rem;color:rgba(255,255,255,.5)">${pl.period}</span>
          </div>
        </div>

        <div class="info-block" style="border-color:${hexBorder};background:${hexAlpha}">
          <div class="block-head">
            <span class="block-icon">🧬</span>
            <span class="block-lbl">前世の性格・気質</span>
          </div>
          <div class="block-body">
            <div class="trait-list">${traitsHtml}</div>
          </div>
        </div>

        <div class="info-block full" style="border-color:${hexBorder};background:${hexAlpha}">
          <div class="block-head">
            <span class="block-icon">🔮</span>
            <span class="block-lbl">前世からのメッセージ</span>
          </div>
          <div class="block-body">
            <div class="message-box">${pl.message}</div>
          </div>
        </div>
      </div>

      <div class="reset-area">
        <button class="reset-btn" onclick="resetForm()">別の生年月日で診断する</button>
      </div>

      <div class="plife-num">PATTERN ${String(num).padStart(2,'0')} / ${PAST_LIVES.length}</div>
    </div>
  `;

  // style traits to use accent color
  card.querySelectorAll('.trait').forEach(t => {
    t.style.background = hexAlpha;
    t.style.borderColor = hexBorder;
    t.style.color = pl.hue;
  });

  document.getElementById('inputCard').style.display = 'none';
  card.classList.remove('open');
  void card.offsetWidth;
  card.classList.add('open');

  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
}

function resetForm() {
  document.getElementById('inputCard').style.display = 'block';
  const card = document.getElementById('resultCard');
  card.classList.remove('open');
  card.innerHTML = '';
  setTimeout(() => document.getElementById('inputCard').scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
}
</script>
