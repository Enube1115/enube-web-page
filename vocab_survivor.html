<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocab Survivor</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Vocab Survivor">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a12; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #fff; user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; background: #12121c; }

  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 12px; right: 78px; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none; z-index: 10;
  }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 12px; font-weight: 700; width: 34px; text-shadow: 0 1px 2px #000; flex-shrink: 0; }
  .bar-track {
    flex: 1; height: 14px; border-radius: 7px; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.25); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 7px 0 0 7px; transition: width 0.15s ease-out; }
  #hpFill { background: linear-gradient(90deg, #ff4d5e, #ff8a5c); }
  #xpFill { background: linear-gradient(90deg, #4dd0ff, #7c5cff); }
  .bar-text { font-size: 11px; min-width: 52px; text-align: right; text-shadow: 0 1px 2px #000; flex-shrink: 0; }
  #topInfo {
    display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    text-shadow: 0 1px 2px #000; gap: 8px;
  }
  #topInfo b { font-size: 15px; color: #ffe066; }

  #joystick {
    position: fixed; left: 50%; z-index: 5;
    transform: translateX(-50%);
    touch-action: none;
  }
  .joy-base {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.45);
    transition: opacity 0.15s ease-out;
  }
  .joy-knob {
    position: absolute; left: 50%; top: 50%;
    border-radius: 50%;
    background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.65);
    transition: opacity 0.15s ease-out;
    will-change: transform;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(5,5,15,0.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .hidden { display: none !important; }
  .overlay h1 { font-size: 26px; margin: 0 0 4px; color: #ffe066; text-shadow: 0 2px 4px #000; }
  .overlay p { margin: 4px 0 18px; font-size: 14px; opacity: 0.85; }

  #cardList { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
  .card {
    background: linear-gradient(160deg, #23233a, #14141f);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 14px;
    padding: 14px 16px; text-align: left; cursor: pointer;
  }
  .card:active { background: linear-gradient(160deg, #33335a, #1c1c2c); }
  .card .icon { font-size: 22px; margin-right: 8px; }
  .card .title { font-size: 16px; font-weight: 700; color: #7cf7c9; }
  .card .desc { font-size: 12px; opacity: 0.8; margin-top: 4px; }

  #resumeBtn, #pauseRestartBtn, #pauseHomeBtn, #gameOverHomeBtn {
    margin-top: 8px; padding: 12px 32px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 24px; background: #ff8a5c; color: #1a1a1a;
  }
  #resumeBtn:active, #pauseRestartBtn:active,
  #pauseHomeBtn:active, #gameOverHomeBtn:active { background: #ffab85; }
  #resumeBtn { background: #4dd0ff; margin-top: 0; }
  #resumeBtn:active { background: #7ce0ff; }
  #pauseRestartBtn, #pauseHomeBtn, #gameOverHomeBtn {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  }
  #pauseRestartBtn:active, #pauseHomeBtn:active, #gameOverHomeBtn:active { background: rgba(255,255,255,0.25); }
  #pauseOverlay .btnRow { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }

  .big-retry-btn {
    font-size: 22px; font-weight: 800; padding: 18px 56px; margin-bottom: 18px;
    border: none; border-radius: 28px; background: #ff8a5c; color: #1a1a1a;
  }
  .big-retry-btn:active { background: #ffab85; }

  #pauseBtn {
    position: fixed; z-index: 15;
    top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  #pauseBtn:active { background: rgba(0,0,0,0.65); }

  #skillBar { display: flex; flex-wrap: wrap; gap: 4px; }
  .skill-pill {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);
    padding: 2px 7px; border-radius: 10px; font-size: 10px; opacity: 0.85;
    text-shadow: 0 1px 2px #000;
  }

  .skill-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 340px;
    margin-bottom: 16px; max-height: 40vh; overflow-y: auto; }
  .skill-list .empty { font-size: 12px; opacity: 0.6; }
  .skill-row {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 8px 10px;
  }
  .skill-row .icon { font-size: 18px; }
  .skill-row .info { flex: 1; }
  .skill-row .name { font-size: 13px; font-weight: 700; color: #7cf7c9; }
  .skill-row .desc { font-size: 10px; opacity: 0.65; margin-top: 1px; }
  .skill-row .effect { font-size: 11px; opacity: 0.8; margin-top: 2px; }
  .skill-row .stack {
    font-size: 12px; font-weight: 700; background: rgba(255,224,102,0.2);
    color: #ffe066; padding: 2px 8px; border-radius: 10px;
  }

  .card { position: relative; }
  .card .owned-badge {
    position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 700;
    color: #ffe066; background: rgba(0,0,0,0.35); padding: 2px 8px; border-radius: 10px;
  }
  .card.selected { border-color: #4dd0ff; box-shadow: 0 0 0 2px rgba(77,208,255,0.6); }

  .select-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .select-btn {
    padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff;
  }
  .select-btn.selected { background: #4dd0ff; color: #0a0a12; border-color: #4dd0ff; }
  .select-btn:disabled { opacity: 0.35; }
  .home-highscore {
    font-size: 13px; opacity: 0.9; margin: 4px 0 20px; line-height: 1.6;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 16px;
  }
  :root {
    /* ゲーム開始ボタン（ここを変えれば色・サイズを調整できる） */
    --start-btn-bg: linear-gradient(160deg, #ffe066, #ffb340);
    --start-btn-bg-active: linear-gradient(160deg, #fff0a8, #ffc870);
    --start-btn-color: #1a1a1a;
    --start-btn-glow: rgba(255,200,80,0.45);
    --start-btn-radius: 16px;
    --start-btn-min-height: 56px;
    --start-btn-max-width: 320px;
  }
  #startBtn {
    -webkit-appearance: none; appearance: none; border: none; outline: none;
    background: var(--start-btn-bg); color: var(--start-btn-color);
    width: 100%; max-width: var(--start-btn-max-width); min-height: max(48px, var(--start-btn-min-height));
    padding: 14px 24px; border-radius: var(--start-btn-radius);
    font-size: 22px; font-weight: 800; letter-spacing: 0.05em; cursor: pointer;
    box-shadow: 0 4px 18px var(--start-btn-glow), inset 0 -3px 0 rgba(0,0,0,0.15);
    transition: transform 0.08s ease-out, filter 0.08s ease-out;
  }
  #startBtn:active { background: var(--start-btn-bg-active); transform: scale(0.96); }
  #startBtn:focus-visible { box-shadow: 0 0 0 3px #fff, 0 4px 18px var(--start-btn-glow); }

  #homeOverlay, #howtoOverlay { justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #homeOverlay, #homeOverlay *, #howtoOverlay, #howtoOverlay * { touch-action: pan-y; }
  .home-inner, .howto-inner {
    margin: auto 0; display: flex; flex-direction: column; align-items: center; width: 100%;
  }
  .home-inner { padding-top: 36px; }
  .home-howto-brief {
    list-style: none; counter-reset: howto; margin: 0 0 10px; padding: 8px 14px; max-width: 320px; text-align: left;
    font-size: 12px; line-height: 1.6; opacity: 0.75;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
  }
  .home-howto-brief li { counter-increment: howto; }
  .home-howto-brief li::before { content: counter(howto) ". "; opacity: 0.7; }
  #howtoBtn {
    font-size: 12px; padding: 6px 16px; margin-bottom: 14px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff;
  }
  #howtoOverlay { z-index: 30; background: rgba(5,5,15,0.94); }
  .howto-inner { max-width: 360px; }
  .howto-section {
    width: 100%; text-align: left; margin-bottom: 10px; padding: 10px 14px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
  }
  .howto-section h2 { font-size: 14px; margin: 0 0 4px; color: #7cf7c9; }
  .howto-section ul { margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.6; opacity: 0.9; }
  #howtoCloseBtn {
    margin-top: 6px; padding: 12px 40px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 24px; background: #4dd0ff; color: #0a0a12;
  }
  #howtoCloseBtn:active { background: #7ce0ff; }

  #quizOverlay { padding-top: 16px; padding-bottom: 16px; }
  .quiz-content {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 480px; gap: 14px;
  }
  .quiz-content p { margin: 0; font-size: 14px; opacity: 0.85; }
  .quiz-meaning { font-size: 26px; font-weight: 700; color: #ffe066; margin: 0; text-shadow: 0 2px 4px #000; }
  .quiz-spelling { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0; }
  .letter-box {
    width: 34px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; border-radius: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
  }
  .letter-box.blank { border: 2px dashed rgba(255,224,102,0.6); color: #ffe066; }
  .letter-box.filled { border-style: solid; background: rgba(255,224,102,0.18); cursor: pointer; }
  .quiz-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0; max-width: 320px; }
  .tile-btn {
    width: 44px; height: 44px; border-radius: 10px; font-size: 18px; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.25); background: linear-gradient(160deg, #33335a, #1c1c2c); color: #fff;
  }
  .tile-btn:active { background: linear-gradient(160deg, #45457a, #26263a); }
  .tile-btn.used, .tile-btn:disabled { visibility: hidden; }
  .quiz-result { min-height: 20px; font-size: 14px; font-weight: 700; color: #7cf7c9; margin: 0; }
  #pausePackName { font-size: 12px; opacity: 0.7; margin-top: -10px; }

  .quiz-timer-num {
    font-size: 32px; font-weight: 800; color: #ffe066; font-variant-numeric: tabular-nums;
    margin: 0; text-shadow: 0 2px 4px #000;
  }
  .quiz-timer-num.danger { color: #ff4d5e; }
  #quizTimerFill.danger { background: linear-gradient(90deg, #ff4d5e, #ff1f3d) !important; }

  .ui-lang-toggle {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px;
    display: flex; gap: 4px;
  }
  .ui-lang-toggle button {
    padding: 6px 10px; font-size: 11px; font-weight: 700; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff;
  }
  .ui-lang-toggle button.selected { background: #ffe066; color: #1a1a1a; border-color: #ffe066; }

  #evolutionOverlay { background: radial-gradient(circle, rgba(255,224,102,0.3), rgba(5,5,15,0.92)); }
  .evolution-icon {
    font-size: 72px; margin-bottom: 8px; animation: evoPulse 0.6s ease-out;
    filter: drop-shadow(0 0 24px #ffe066);
  }
  #evolutionOverlay h1 { animation: evoPulse 0.6s ease-out; }
  @keyframes evoPulse {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  #encircleWarning {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 72px); left: 50%;
    transform: translateX(-50%); z-index: 12; text-align: center;
    background: rgba(255,40,60,0.85); color: #fff; font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    animation: warnPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes warnPulse { from { opacity: 1; } to { opacity: 0.55; } }

  #bossWarning {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 110px); left: 50%;
    transform: translateX(-50%); z-index: 12; text-align: center;
    background: rgba(180,20,80,0.9); color: #fff; font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    animation: warnPulse 0.6s ease-in-out infinite alternate;
  }

  #bossAbilityWarning {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 150px); left: 50%;
    transform: translateX(-50%); z-index: 12; text-align: center; max-width: 90vw;
    background: rgba(255,140,0,0.9); color: #fff; font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    animation: warnPulse 0.5s ease-in-out infinite alternate;
  }

  .skill-pill.sealed, .skill-row.sealed { filter: grayscale(1); opacity: 0.45; }
  .skill-pill.sealed { text-decoration: line-through; }

  #bossHpBar {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%;
    transform: translateX(-50%); width: min(90vw, 480px); z-index: 11; pointer-events: none;
  }
  .boss-hp-label {
    text-align: center; font-size: 11px; font-weight: 800; color: #ffe066;
    text-shadow: 0 1px 3px #000; margin-bottom: 3px;
  }
  .boss-hp-track { height: 10px; }

  #pendingLevelUpsLabel {
    font-size: 11px; font-weight: 700; color: #ffe066; text-shadow: 0 1px 2px #000;
    background: rgba(0,0,0,0.35); border-radius: 10px; padding: 2px 8px; align-self: flex-start;
  }

  .sound-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; width: 100%; max-width: 280px; }
  .mute-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; font-size: 17px;
  }
  .mute-btn:active { background: rgba(255,255,255,0.2); }
  .volume-slider { flex: 1; accent-color: #4dd0ff; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="pauseBtn">❚❚</button>

<div id="hud">
  <div id="topInfo">
    <span><span data-i18n="survivalTimeLabel"></span> <b id="timeText">00:00</b></span>
    <span><span data-i18n="levelLabel"></span><b id="levelText">1</b></span>
  </div>
  <div class="bar-row">
    <span class="bar-label" data-i18n="hpLabel"></span>
    <div class="bar-track"><div class="bar-fill" id="hpFill" style="width:100%"></div></div>
    <span class="bar-text" id="hpText">100/100</span>
  </div>
  <div class="bar-row">
    <span class="bar-label" data-i18n="xpLabel"></span>
    <div class="bar-track"><div class="bar-fill" id="xpFill" style="width:0%"></div></div>
    <span class="bar-text" id="xpText">0/10</span>
  </div>
  <div id="skillBar"></div>
  <div id="pendingLevelUpsLabel" class="hidden"></div>
</div>

<div id="bossHpBar" class="hidden">
  <div class="boss-hp-label" id="bossHpLabel"></div>
  <div class="bar-track boss-hp-track"><div class="bar-fill" id="bossHpFill" style="width:100%;background:linear-gradient(90deg,#c04dff,#ff2d55);"></div></div>
</div>

<div id="bossWarning" class="hidden"></div>
<div id="bossAbilityWarning" class="hidden"></div>

<div id="joystick" class="hidden">
  <div class="joy-base" id="joyBase"></div>
  <div class="joy-knob" id="joyKnob"></div>
</div>

<div class="overlay" id="homeOverlay">
  <div class="ui-lang-toggle" id="uiLangToggle">
    <button data-lang="ja">日本語</button>
    <button data-lang="en">English</button>
  </div>
  <div class="home-inner">
  <h1 data-i18n="appTitle">Vocab Survivor</h1>
  <p data-i18n="homeSubtitle"></p>
  <div class="select-group" id="langGroup"></div>
  <div class="select-group" id="diffGroup"></div>
  <div class="select-group" id="modeGroup"></div>
  <div class="select-group" id="stageGroup"></div>
  <div class="home-highscore" id="homeHighScore"></div>
  <div class="sound-row">
    <button id="homeMuteBtn" class="mute-btn">🔊</button>
    <input type="range" id="homeVolumeSlider" class="volume-slider" min="0" max="100" value="30">
  </div>
  <ol class="home-howto-brief">
    <li data-i18n="howtoBrief1"></li>
    <li data-i18n="howtoBrief2"></li>
    <li data-i18n="howtoBrief3"></li>
  </ol>
  <button id="howtoBtn" data-i18n="howtoButton"></button>
  <button id="startBtn" data-i18n="startButton"></button>
  </div>
</div>

<div class="overlay hidden" id="howtoOverlay">
  <div class="howto-inner">
    <h1 data-i18n="howtoTitle"></h1>
    <div class="howto-section">
      <h2 data-i18n="howtoControlsTitle"></h2>
      <ul>
        <li data-i18n="howtoControls1"></li>
        <li data-i18n="howtoControls2"></li>
      </ul>
    </div>
    <div class="howto-section">
      <h2 data-i18n="howtoQuizTitle"></h2>
      <ul>
        <li data-i18n="howtoQuiz1"></li>
        <li data-i18n="howtoQuiz2"></li>
        <li data-i18n="howtoQuiz3"></li>
      </ul>
    </div>
    <div class="howto-section">
      <h2 data-i18n="howtoBossTitle"></h2>
      <ul>
        <li data-i18n="howtoBoss1"></li>
        <li data-i18n="howtoBoss2"></li>
      </ul>
    </div>
    <div class="howto-section">
      <h2 data-i18n="howtoHealTitle"></h2>
      <ul>
        <li data-i18n="howtoHeal1"></li>
      </ul>
    </div>
    <button id="howtoCloseBtn" data-i18n="howtoClose"></button>
  </div>
</div>

<div class="overlay hidden" id="quizOverlay">
  <div class="quiz-content">
    <p data-i18n="quizPrompt"></p>
    <div class="quiz-meaning" id="quizMeaning"></div>
    <div class="quiz-spelling" id="quizSpelling"></div>
    <div class="quiz-timer-num" id="quizTimerNum">5.0</div>
    <div class="bar-track" style="width:100%;max-width:280px;">
      <div class="bar-fill" id="quizTimerFill" style="width:100%;background:linear-gradient(90deg,#ffe066,#ff8a5c);"></div>
    </div>
    <div class="quiz-tiles" id="quizTiles"></div>
    <p class="quiz-result" id="quizResult"></p>
  </div>
</div>

<div class="overlay hidden" id="evolutionOverlay">
  <div class="evolution-icon" id="evolutionIcon">💥</div>
  <h1 id="evolutionTitle"></h1>
  <p id="evolutionDesc"></p>
</div>

<div class="overlay hidden" id="bossRewardOverlay">
  <h1 data-i18n="bossRewardTitle"></h1>
  <div id="bossRewardList" style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;"></div>
</div>

<div class="overlay hidden" id="stageClearOverlay">
  <h1 data-i18n="stageClearTitle"></h1>
  <p id="stageClearStats">-</p>
  <div class="skill-list" id="stageClearSkillList"></div>
  <button id="stageClearHomeBtn" data-i18n="homeButton"></button>
</div>

<div id="encircleWarning" class="hidden" data-i18n="encircleWarningText"></div>

<div class="overlay hidden" id="pauseOverlay">
  <h1 data-i18n="pauseTitle"></h1>
  <p id="pausePackName">-</p>
  <p data-i18n="acquiredSkillsLabel"></p>

  function detectDefaultUiLang(){
    const nav = ((navigator.language || navigator.userLanguage || '') + '').toLowerCase();
    return nav.indexOf('ja') === 0 ? 'ja' : 'en';
  }
  let uiLang = lsGet('vs_ui_lang', null);
  if (uiLang !== 'ja' && uiLang !== 'en') uiLang = detectDefaultUiLang();

  function t(key){
    const dict = I18N[uiLang] || I18N.en;
    return Object.prototype.hasOwnProperty.call(dict, key) ? dict[key] : (I18N.en[key] || key);
  }
  function tf(key, vars){
    let s = t(key);
    for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }
  function setUiLang(lang){
    uiLang = (lang === 'ja') ? 'ja' : 'en';
    lsSet('vs_ui_lang', uiLang);
    applyI18n();
  }
  function applyI18n(){
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.getElementById('pauseBtn').setAttribute('aria-label', t('pauseAria'));
    renderUiLangToggle();
    renderHomeSelectors();
    renderSkillBar();
  }
  function renderUiLangToggle(){
    document.querySelectorAll('#uiLangToggle button').forEach(btn => {
      btn.classList.toggle('selected', btn.getAttribute('data-lang') === uiLang);
    });
  }
  document.querySelectorAll('#uiLangToggle button').forEach(btn => {
    btn.addEventListener('click', () => setUiLang(btn.getAttribute('data-lang')));
  });

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let width = 0, height = 0;

  function resize(){
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  function ensureAudioContext(){
    if (audioCtx){
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : volume / 100;
      masterGain.connect(audioCtx.destination);

  }

  function canPlaySound(key, minGap){
    if (!key) return true;
    const now = performance.now();
    const last = lastPlayedAt[key] || 0;
    if (now - last < (minGap != null ? minGap : 50)) return false;
    if (activeVoiceCount >= (CFG.sound.maxVoices || 16)) return false;
    lastPlayedAt[key] = now;
    return true;
  }
  function registerVoice(node){
    activeVoiceCount++;
    node.onended = () => { activeVoiceCount = Math.max(0, activeVoiceCount - 1); };
  }

  function playToneAt(freq, duration, startTime, opts){
    opts = opts || {};
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, freq), startTime);
    if (opts.freqEnd != null){
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), startTime + duration);
    }
    const g = audioCtx.createGain();
    const peak = opts.gain != null ? opts.gain : 0.15;
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
    registerVoice(osc);
  }

  function playTone(freq, duration, opts){
    opts = opts || {};
    if (!canPlaySound(opts.key, opts.minGap)) return;
    ensureAudioContext();
    if (!audioCtx) return;
    playToneAt(freq, duration, audioCtx.currentTime, opts);
  }

  function playSequence(notes, noteDuration, gap, opts){
    opts = opts || {};
    if (!canPlaySound(opts.key, opts.minGap)) return;
    ensureAudioContext();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    notes.forEach((freq, i) => {
      playToneAt(freq, noteDuration, t0 + i * (noteDuration + gap), opts);
    });
  }

  function playNoise(duration, opts){
    opts = opts || {};
    if (!canPlaySound(opts.key, opts.minGap)) return;
    ensureAudioContext();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = opts.filterFreq || 500;
    const g = audioCtx.createGain();
    const peak = opts.gain != null ? opts.gain : 0.2;
    g.gain.setValueAtTime(peak, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    src.start(t0);
    src.stop(t0 + duration + 0.02);
    registerVoice(src);
  }

  // Rebuilds upgrade-derived stats by replaying history, skipping the sealed upgrade. Stack counts are untouched.
  function recalcUpgradeStats(){
    const base = newPlayer();
    for (const h of player.upgradeHistory){
      if (h.id === player.sealedUpgradeId) continue;
      const u = upgradeById(h.id);
      (h.strong ? u.strongApply : u.weakApply)(base);
      base.upgradeCounts[h.id] = Math.min(MAX_ABILITY_STACKS, (base.upgradeCounts[h.id] || 0) + 1);

    UPGRADE_STAT_FIELDS.forEach(f => { player[f] = base[f]; });

  function keyboardVector(){
    let x = 0, y = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) x -= 1;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) x += 1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) y -= 1;

  // ---------- input: fixed virtual joystick ----------
  const joyEl = document.getElementById('joystick');
  const joyBase = document.getElementById('joyBase');
  const joyKnob = document.getElementById('joyKnob');
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  let joyActive = false, joyId = null;
  let joyOrigin = { x: 0, y: 0 };
  let joyVec = { x: 0, y: 0 };
  const JOY_MAX = (CFG.joystick.baseSize - CFG.joystick.knobSize) / 2;

  (function initJoystickLayout(){
    const jc = CFG.joystick;
    joyEl.style.width = jc.baseSize + 'px';
    joyEl.style.height = jc.baseSize + 'px';
    joyEl.style.bottom = 'calc(env(safe-area-inset-bottom, 0px) + ' + jc.bottomMargin + 'px)';
    joyBase.style.width = jc.baseSize + 'px';
    joyBase.style.height = jc.baseSize + 'px';
    joyKnob.style.width = jc.knobSize + 'px';
    joyKnob.style.height = jc.knobSize + 'px';
    setJoyOpacity(jc.opacity);
  })();

  function setJoyOpacity(v){
    joyBase.style.opacity = v;
    joyKnob.style.opacity = v;
  }
  function setKnobOffset(x, y){
    joyKnob.style.transform = 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px))';
  }
  function resetKnob(){
    setKnobOffset(0, 0);
    joyVec.x = 0; joyVec.y = 0;
  }

  function pointWithinJoyBase(x, y){
    const r = joyEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return Math.hypot(x - cx, y - cy) <= r.width / 2;
  }

  function updateJoyKnob(x, y){
    let dx = x - joyOrigin.x, dy = y - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, JOY_MAX);
    const ang = Math.atan2(dy, dx);
    const kx = Math.cos(ang) * clamped, ky = Math.sin(ang) * clamped;
    setKnobOffset(kx, ky);
    joyVec.x = dist > 4 ? Math.cos(ang) * (clamped / JOY_MAX) : 0;
    joyVec.y = dist > 4 ? Math.sin(ang) * (clamped / JOY_MAX) : 0;
  }

  joyEl.addEventListener('touchstart', e => {
    if (joyActive) return;
    for (const t of e.changedTouches){
      if (pointWithinJoyBase(t.clientX, t.clientY)){
        joyActive = true; joyId = t.identifier;
        const r = joyEl.getBoundingClientRect();
        joyOrigin.x = r.left + r.width / 2; joyOrigin.y = r.top + r.height / 2;
        setJoyOpacity(CFG.joystick.activeOpacity);
        updateJoyKnob(t.clientX, t.clientY);
        break;
      }
    }
    e.preventDefault();
  }, { passive: false });

  joyEl.addEventListener('touchmove', e => {
    if (!joyActive) return;
    for (const t of e.changedTouches){
      if (t.identifier === joyId){ updateJoyKnob(t.clientX, t.clientY); }
    }
    e.preventDefault();
  }, { passive: false });

  function endJoyTouch(e){
    for (const t of e.changedTouches){
      if (t.identifier === joyId){
        joyActive = false; joyId = null;
        setJoyOpacity(CFG.joystick.opacity);
        resetKnob();
      }
    }
  }
  joyEl.addEventListener('touchend', endJoyTouch, { passive: false });
  joyEl.addEventListener('touchcancel', endJoyTouch, { passive: false });

  let joystickVisible = false;
  function updateJoystickVisibility(){
    const show = isTouchDevice && gameState === 'playing';
    if (show === joystickVisible) return;
    joystickVisible = show;
    joyEl.classList.toggle('hidden', !show);

      resetKnob();
    }
  }

  function inputVector(){
    const kv = keyboardVector();
    if (kv.x !== 0 || kv.y !== 0){
      const len = Math.hypot(kv.x, kv.y) || 1;
      return { x: kv.x / len, y: kv.y / len };
    }
    return joyVec;
  }

  // ---------- spawning ----------
  function spawnInterval(t){ return Math.max(0.25, (1.4 - t * CFG.spawnIntervalRamp * tuning.spawnRampMult) / stageDifficultyMult); }
  function spawnCount(t){ return Math.min(6, 1 + Math.floor(t * tuning.spawnRampMult / CFG.spawnCountStepTime)) + Math.floor((stageDifficultyMult - 1) * 2); }

  function createEnemyAt(x, y, opts){
    opts = opts || {};
    const t = survivalTime;
    const variance = 0.85 + Math.random() * 0.3;
    const hp = CFG.enemyBaseHp * (1 + t * CFG.enemyHpGrowth * tuning.enemyGrowthMult) * variance * (opts.hpMult || 1) * stageDifficultyMult;
    const speed = CFG.enemyBaseSpeed * (1 + Math.min(t * 0.004, 0.6)) * (0.9 + Math.random() * 0.2) * (opts.speedMult != null ? opts.speedMult : 1);
    return {
      x, y, hp, maxHp: hp, speed,
      damage: CFG.enemyBaseDamage * (1 + t * CFG.enemyDamageGrowth * tuning.enemyGrowthMult) * (opts.damageMult || 1) * stageDifficultyMult,
      xpValue: Math.round(CFG.enemyBaseXp * variance * (opts.xpMult || 1)),
      radius: opts.radius || 14 * variance,
      hitFlash: 0,
      type: opts.type || 'normal',
    };
  }

  function spawnEnemy(){
    if (enemies.length >= CFG.maxEnemies) return;
    const spawnRadius = Math.hypot(width, height) / 2 + 120;
    const ang = Math.random() * Math.PI * 2;
    enemies.push(createEnemyAt(player.x + Math.cos(ang) * spawnRadius, player.y + Math.sin(ang) * spawnRadius));
  }

  function spawnElite(){
    if (enemies.length >= CFG.maxEnemies) return;
    const spawnRadius = Math.hypot(width, height) / 2 + CFG.eliteSpawnPadding;
    const ang = Math.random() * Math.PI * 2;
    const e = createEnemyAt(player.x + Math.cos(ang) * spawnRadius, player.y + Math.sin(ang) * spawnRadius, {
      hpMult: CFG.eliteHpMult, damageMult: CFG.eliteDamageMult, xpMult: CFG.eliteXpMult,
      radius: CFG.eliteRadius, type: 'elite',
    });
    e.eliteState = 'recover';
    e.eliteTimer = 0.4;
    e.dashVX = 0; e.dashVY = 0;
    enemies.push(e);
    sfxEliteSpawn();
  }

  function updateElite(e, dt){
    if (e.eliteState === 'dashing'){
      e.x += e.dashVX * dt;
      e.y += e.dashVY * dt;
      e.eliteTimer -= dt;
      if (e.eliteTimer <= 0){ e.eliteState = 'recover'; e.eliteTimer = CFG.eliteRecoverTime; }
    } else {
      e.eliteTimer -= dt;
      if (e.eliteTimer <= 0){
        const leadX = player.x + (player.vx || 0) * CFG.elitePredictLead;
        const leadY = player.y + (player.vy || 0) * CFG.elitePredictLead;
        const ang = Math.atan2(leadY - e.y, leadX - e.x);
        e.dashVX = Math.cos(ang) * CFG.eliteDashSpeed;
        e.dashVY = Math.sin(ang) * CFG.eliteDashSpeed;
        e.eliteState = 'dashing';
        e.eliteTimer = CFG.eliteDashDuration;
      }
    }
  }

  function spawnEncircleRing(){
    const cx = player.x, cy = player.y;
    const radius = Math.hypot(width, height) / 2 + CFG.encircleSpawnPadding;
    const gapAngle = Math.random() * Math.PI * 2;
    const half = CFG.encircleGapWidth * tuning.encircleGapMult / 2;
    const n = CFG.encircleEnemyCount;
    for (let i = 0; i < n; i++){
      if (enemies.length >= CFG.maxEnemies) break;
      const angle = (i / n) * Math.PI * 2;
      let d = Math.abs(angle - gapAngle);
      d = Math.min(d, Math.PI * 2 - d);
      if (d < half) continue;
      enemies.push(createEnemyAt(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius, { speedMult: CFG.encircleSpeedMult }));
    }
  }
  function showEncircleWarning(){
    encircleWarningTimer = CFG.encircleDuration;
    document.getElementById('encircleWarning').classList.remove('hidden');
    sfxEncircleWarning();
  }
  function hideEncircleWarning(){
    document.getElementById('encircleWarning').classList.add('hidden');
  }

  // ---------- bosses (stage mode) ----------
  function spawnBoss(tier){
    const spawnRadius = Math.hypot(width, height) / 2 + 150;
    const ang = Math.random() * Math.PI * 2;
    let hpMult, speedMult, radius;
    if (tier === 'mini'){ hpMult = CFG.stage.miniBossHpMult; speedMult = CFG.stage.miniBossSpeedMult; radius = CFG.stage.miniBossRadius; }
    else if (tier === 'mid'){ hpMult = CFG.stage.midBossHpMult; speedMult = CFG.stage.midBossSpeedMult; radius = CFG.stage.midBossRadius; }
    else { hpMult = CFG.stage.bigBossHpMult; speedMult = CFG.stage.bigBossSpeedMult; radius = CFG.stage.bigBossRadius; }

    const e = createEnemyAt(player.x + Math.cos(ang) * spawnRadius, player.y + Math.sin(ang) * spawnRadius, {
      hpMult: hpMult * tuning.bossHpMult, speedMult, damageMult: CFG.stage.bossDamageMult, xpMult: hpMult * 0.5, radius, type: 'boss',
    });
    e.bossTier = tier;
    e.isMainBoss = true;
    e.hasSplit = false;
    e.attackTimer = CFG.stage.midAttackInterval * tuning.bossAttackIntervalMult;
    e.summonTimer = CFG.stage.miniSummonInterval;
    e.beamDelay = CFG.stage.beamStartDelay;
    e.beamActive = false;
    e.beamAngle = Math.random() * Math.PI * 2;
    e.beamDir = Math.random() < 0.5 ? -1 : 1;
    e.hasSealed = false;
    enemies.push(e);
    showBossWarning(tier);
    sfxBossWarning();
  }

  function summonMinions(boss){
    const n = CFG.stage.miniSummonCount;
    const offset = Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++){
      if (enemies.length >= CFG.maxEnemies) break;
      const ang = offset + (i / n) * Math.PI * 2;
      enemies.push(createEnemyAt(
        boss.x + Math.cos(ang) * (boss.radius + CFG.stage.miniSummonDistance),
        boss.y + Math.sin(ang) * (boss.radius + CFG.stage.miniSummonDistance),
        { type: 'minion', hpMult: CFG.stage.minionHpMult, speedMult: CFG.stage.minionSpeedMult, radius: CFG.stage.minionRadius }
      ));
    }
    showAbilityWarning(t('bossAbilitySummon'));
    sfxBossSummon();
  }

  function beamEnd(e){
    return { x: e.x + Math.cos(e.beamAngle) * CFG.stage.beamLength, y: e.y + Math.sin(e.beamAngle) * CFG.stage.beamLength };
  }
  function distToSegment(px, py, ax, ay, bx, by){
    const vx = bx - ax, vy = by - ay;
    const lenSq = vx * vx + vy * vy || 1;
    const k = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / lenSq));
    return Math.hypot(px - (ax + vx * k), py - (ay + vy * k));
  }
  function updateBossBeam(e, dt){
    if (!e.beamActive){
      e.beamDelay -= dt;
      if (e.beamDelay > 0) return;
      e.beamActive = true;
      showAbilityWarning(t('bossAbilityBeam'));
      sfxBossBeam();
    }
    e.beamAngle += e.beamDir * CFG.stage.beamRotationSpeed * dt;
    const end = beamEnd(e);
    if (distToSegment(player.x, player.y, e.x, e.y, end.x, end.y) <= player.radius + CFG.stage.beamWidth / 2){
      player.hp -= CFG.stage.beamDps * stageDifficultyMult * (1 - (player.defense || 0)) * dt;
      sfxHit();
      if (player.hp <= 0){ player.hp = 0; gameOver(); }
    }
  }

  // Minions are removed after the update pass so in-progress enemy loops keep valid indices.
  let minionPurgePending = false;
  function purgeMinionsIfPending(){
    if (!minionPurgePending) return;
    minionPurgePending = false;
    for (let i = enemies.length - 1; i >= 0; i--){
      if (enemies[i].type === 'minion') enemies.splice(i, 1);
    }
  }

  function showAbilityWarning(text){
    const el = document.getElementById('bossAbilityWarning');
    el.textContent = text;
    el.classList.remove('hidden');
    abilityWarningTimer = CFG.stage.abilityWarningDuration;
  }
  function updateAbilityWarning(dt){
    if (abilityWarningTimer <= 0) return;
    abilityWarningTimer -= dt;
    if (abilityWarningTimer <= 0) document.getElementById('bossAbilityWarning').classList.add('hidden');
  }

  function spawnBossClone(parent){
    const e = createEnemyAt(
      parent.x + (Math.random() - 0.5) * 80,
      parent.y + (Math.random() - 0.5) * 80,
      { type: 'boss', radius: CFG.stage.bigBossRadius * 0.7 }
    );
    e.maxHp = parent.maxHp * CFG.stage.bigCloneHpRatio;
    e.hp = e.maxHp;
    e.speed = parent.speed;
    e.damage = parent.damage;
    e.xpValue = Math.round(parent.xpValue * 0.4);
    e.bossTier = 'big';
    e.isMainBoss = false;
    e.hasSplit = true;
    e.attackTimer = CFG.stage.midAttackInterval * tuning.bossAttackIntervalMult * 0.7;
    enemies.push(e);
  }

  function bossRadialAttack(e){
    const n = CFG.stage.midAttackBulletCount;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2;
      enemyBullets.push({
        x: e.x, y: e.y,
        vx: Math.cos(ang) * CFG.stage.midAttackBulletSpeed,
        vy: Math.sin(ang) * CFG.stage.midAttackBulletSpeed,
        radius: 6,
        damage: CFG.stage.midAttackBulletDamage * stageDifficultyMult,
        life: 4,
      });
    }
  }

  function updateBoss(e, dt){
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    e.x += (dx / dist) * e.speed * dt;
    e.y += (dy / dist) * e.speed * dt;

    if (e.bossTier === 'mid' || e.bossTier === 'big'){
      e.attackTimer -= dt;
      if (e.attackTimer <= 0){
        bossRadialAttack(e);
        e.attackTimer = CFG.stage.midAttackInterval * tuning.bossAttackIntervalMult;
      }
    }
    if (e.bossTier === 'big' && e.isMainBoss && !e.hasSplit && e.hp <= e.maxHp * 0.5){
      e.hasSplit = true;
      for (let i = 0; i < CFG.stage.bigCloneCount; i++) spawnBossClone(e);
    }
    if (!e.isMainBoss) return;

    if (e.bossTier === 'mini'){
      e.summonTimer -= dt;
      if (e.summonTimer <= 0){
        summonMinions(e);
        e.summonTimer += CFG.stage.miniSummonInterval;
      }
    } else if (e.bossTier === 'mid'){
      updateBossBeam(e, dt);
    } else if (e.bossTier === 'big' && !e.hasSealed && e.hp <= e.maxHp * CFG.stage.sealHpRatio){
      e.hasSealed = true;
      sealRandomUpgrade();
    }
  }

  function showBossWarning(tier){
    const el = document.getElementById('bossWarning');
    el.textContent = tf('bossWarningText', { name: t('bossName_' + tier) });
    el.classList.remove('hidden');
    clearTimeout(bossWarningHideTimer);
    bossWarningHideTimer = setTimeout(() => el.classList.add('hidden'), 3000);
  }

  function updateBossHpBar(){
    const boss = enemies.find(e => e.type === 'boss' && e.isMainBoss);
    const bar = document.getElementById('bossHpBar');
    if (!boss){ bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    document.getElementById('bossHpLabel').textContent = t('bossName_' + boss.bossTier);
    document.getElementById('bossHpFill').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
  }

  function onBossDefeated(tier){
    if (tier === 'mini') minionPurgePending = true;
    if (tier === 'big') releaseSeal();
    pendingBossTier = tier;
    showBossReward();
  }

  function pickThreeUpgrades(){
    const avail = UPGRADES.filter(u => (player.upgradeCounts[u.id] || 0) < MAX_ABILITY_STACKS);
    return shuffleArray(avail.slice()).slice(0, 3);
  }

  function showBossReward(){
    const choices = pickThreeUpgrades();
    if (choices.length === 0){ afterBossRewardResolved(); return; }
    gameState = 'bossReward';
    setPauseButtonVisible(false);
    const list = document.getElementById('bossRewardList');
    list.innerHTML = '';
    choices.forEach(u => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = '<span class="icon">' + u.icon + '</span><span class="title">' + upgradeTitle(u.id) + '</span>' +
        '<div class="desc">' + upgradeDesc(u.id) + '</div>';
      el.addEventListener('click', () => chooseBossReward(u));
      list.appendChild(el);
    });
    document.getElementById('bossRewardOverlay').classList.remove('hidden');
  }

  function chooseBossReward(u){
    applyUpgrade(u, true);
    document.getElementById('bossRewardOverlay').classList.add('hidden');
    afterBossRewardResolved();
  }

  function afterBossRewardResolved(){
    if (pendingBossTier === 'mini') stagePhase = 'pending-mid';
    else if (pendingBossTier === 'mid') stagePhase = 'pending-big';
    else if (pendingBossTier === 'big') stagePhase = 'cleared';
    pendingBossTier = null;

    if (stagePhase === 'cleared'){
      stageClear();
      return;
    }
    gameState = 'playing';
    setPauseButtonVisible(true);
    lastTs = performance.now();
    if (pendingLevelUps > 0) triggerLevelUpReward();
  }

  function stageClear(){
    gameState = 'stageclear';
    setPauseButtonVisible(false);
    const packId = currentPackId();
    const cleared = lsGet('vs_cleared_' + packId, 0);
    if (stageNumber > cleared) lsSet('vs_cleared_' + packId, stageNumber);

    const stats = loadStats(packId);
    if (survivalTime > stats.highScoreTime) stats.highScoreTime = survivalTime;
    if (player.level > stats.highScoreLevel) stats.highScoreLevel = player.level;
    saveStats(packId, stats);

    const total = stats.correctCount + stats.wrongCount;
    const rate = total > 0 ? Math.round(stats.correctCount / total * 100) : 0;
    const m = Math.floor(survivalTime / 60), s = Math.floor(survivalTime % 60);
    document.getElementById('stageClearStats').innerHTML =
      tf('stageClearTimeKills', { time: pad(m) + ':' + pad(s), kills: killCount }) + '<br>' +
      tf('stageClearAccuracy', { pct: rate });
    document.getElementById('stageClearSkillList').innerHTML = buildSkillListHtml();
    document.getElementById('bossHpBar').classList.add('hidden');
    document.getElementById('stageClearOverlay').classList.remove('hidden');
  }

  // ---------- combat ----------
  function makeBullet(x, y, angle){
    const spd = CFG.bulletSpeed * (player.bulletSpeedMult || 1);
    return {
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      damage: CFG.baseAtk * player.atkMult,
      radius: CFG.bulletRadius,
      life: 1.6,
      pierceLeft: player.pierceCount || 0,
      bounceLeft: player.bounceCount || 0,
      hitSet: new Set(),
    };
  }

  function fireBullets(){
    if (enemies.length === 0) return;
    sfxShoot();
    const sorted = enemies.slice().sort((a, b) => {
      const da = (a.x - player.x) ** 2 + (a.y - player.y) ** 2;
      const db = (b.x - player.x) ** 2 + (b.y - player.y) ** 2;
      return da - db;
    });
    for (let i = 0; i < player.bulletCount; i++){
      const target = sorted[i % sorted.length];
      let ang = Math.atan2(target.y - player.y, target.x - player.x);
      if (i >= sorted.length) ang += (Math.random() - 0.5) * 0.5;
      bullets.push(makeBullet(player.x, player.y, ang));
    }
    if (player.evolutions.barrage){
      const n = 12;
      for (let i = 0; i < n; i++){
        bullets.push(makeBullet(player.x, player.y, (i / n) * Math.PI * 2));
      }
    }
  }

  function findNearestEnemyExcluding(x, y, excludeSet){
    let best = null, bestD = Infinity;
    for (const e of enemies){
      if (excludeSet && excludeSet.has(e)) continue;
      const d = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d < bestD){ bestD = d; best = e; }
    }
    return best;
  }

  function applySplashDamage(x, y, radius, dmg, excludeEnemy){
    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if (e === excludeEnemy) continue;
      const d = Math.hypot(e.x - x, e.y - y);
      if (d <= radius + e.radius){
        e.hp -= dmg;
        e.hitFlash = 0.12;
        if (e.hp <= 0) killEnemy(e, { triggerBurst: false });
      }
    }
  }

  function killEnemy(enemy, opts){
    opts = opts || {};
    const idx = enemies.indexOf(enemy);
    if (idx === -1) return;
    sfxKill();
    killCount += 1;
    const isMinion = enemy.type === 'minion'; // minions drop nothing, so they can't be farmed
    if (!isMinion) gems.push({ x: enemy.x, y: enemy.y, value: enemy.xpValue, radius: 6 });
    const guaranteedHeal = enemy.type === 'elite' || enemy.type === 'boss';
    if (guaranteedHeal || (!isMinion && Math.random() < CFG.healDropChance * tuning.healDropMult)){
      heals.push({ x: enemy.x, y: enemy.y, radius: CFG.healRadius, amount: CFG.healAmount });
    }
    const shouldBurst = opts.triggerBurst !== false && (player.burstDamage || 0) > 0;
    const bx = enemy.x, by = enemy.y;
    const br = CFG.burstBaseRadius + (player.burstRadiusBonus || 0);
    const bd = player.burstDamage || 0;
    const isMainBossKill = enemy.type === 'boss' && enemy.isMainBoss;
    const bossTier = enemy.bossTier;
    enemies.splice(idx, 1);
    if (shouldBurst) applySplashDamage(bx, by, br, bd, enemy);
    if (isMainBossKill) onBossDefeated(bossTier);
  }

  function addBonusXp(amount){
    if (!amount) return;
    player.xp += amount;
    while (player.xp >= player.xpNext){
      player.xp -= player.xpNext;
      player.level += 1;
      player.xpNext = xpToNext(player.level);
      pendingLevelUps += 1;
      sfxLevelUp();
    }
  }

  function grantXp(amount){
    player.xp += amount;
    while (player.xp >= player.xpNext){
      player.xp -= player.xpNext;
      player.level += 1;
      player.xpNext = xpToNext(player.level);
      pendingLevelUps += 1;
      sfxLevelUp();
    }
    if (pendingLevelUps > 0 && gameState === 'playing' && !(stageMode && isBossActive())) triggerLevelUpReward();
  }

  // ---------- level up quiz (word fill-in-the-blank) ----------
  const QUIZ_DANGER_TIME = 1.5;

  const WRONG_WORD_PRIORITY = 0.6;

  function pickRandomWord(pack){
    const wrongList = lsGet(wrongKey(pack.id), []);
    const wrongWords = wrongList.length
      ? pack.words.filter(w => wrongList.some(r => r.word === w.word))
      : [];
    const otherWords = wrongWords.length
      ? pack.words.filter(w => !wrongWords.includes(w))
      : pack.words;

    let pool;
    if (wrongWords.length > 0 && otherWords.length > 0){
      pool = (Math.random() < WRONG_WORD_PRIORITY) ? wrongWords : otherWords;
    } else {
      pool = wrongWords.length > 0 ? wrongWords : otherWords;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function buildDummyPool(pack, currentWord){
    const set = new Set();
    pack.words.forEach(w => {
      if (w === currentWord) return;
      for (const ch of w.word) set.add(ch);
    });
    return Array.from(set);
  }
  function shuffleArray(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function openQuiz(){
    gameState = 'quiz';
    setPauseButtonVisible(false);

    const pack = getPack(currentPackId());
    const difficulty = getDifficulty(pack.difficultyId);
    const wordObj = pickRandomWord(pack);
    const chars = Array.from(wordObj.word);
    const len = chars.length;
    const blankCount = Math.max(1, Math.min(difficulty.blankCount - (player.quizBlankReduction || 0), len - 1));
    const quizTime = difficulty.quizTime + (player.quizTimeBonus || 0);

    const blankIndices = [];
    while (blankIndices.length < blankCount){
      const idx = Math.floor(Math.random() * len);
      if (!blankIndices.includes(idx)) blankIndices.push(idx);
    }
    blankIndices.sort((a, b) => a - b);

    const dummyPool = buildDummyPool(pack, wordObj);
    const neededDummies = Math.max(2, 6 - blankCount);
    const dummies = [];
    for (let i = 0; i < neededDummies && dummyPool.length > 0; i++){
      dummies.push(dummyPool[Math.floor(Math.random() * dummyPool.length)]);
    }
    const tiles = shuffleArray(
      blankIndices.map(i => chars[i]).concat(dummies)
    ).map(ch => ({ char: ch, used: false, slotIndex: undefined }));

    quiz = {
      pack, wordObj, chars, blankIndices,
      slots: blankIndices.map(() => null),
      tiles,
      timeLeft: quizTime, timeTotal: quizTime,
      resolved: false,
      upgrade: pickAvailableUpgrade(),
    };

    document.getElementById('quizResult').textContent = '';
    document.getElementById('quizMeaning').textContent = wordMeaning(wordObj);
    const fillEl = document.getElementById('quizTimerFill');
    const numEl = document.getElementById('quizTimerNum');
    fillEl.style.width = '100%';
    fillEl.classList.remove('danger');
    numEl.textContent = quizTime.toFixed(1);
    numEl.classList.remove('danger');
    renderQuizSpelling();
    renderQuizTiles();
    document.getElementById('quizOverlay').classList.remove('hidden');
  }

  function renderQuizSpelling(){
    const el = document.getElementById('quizSpelling');
    el.innerHTML = '';
    quiz.chars.forEach((ch, i) => {
      const blankPos = quiz.blankIndices.indexOf(i);
      const box = document.createElement('span');
      if (blankPos === -1){
        box.className = 'letter-box';
        box.textContent = ch;
      } else {
        const filled = quiz.slots[blankPos];
        box.className = 'letter-box blank' + (filled ? ' filled' : '');
        box.textContent = filled || '_';
        if (filled) box.addEventListener('click', () => onSlotClick(blankPos));
      }
      el.appendChild(box);
    });
  }
  function renderQuizTiles(){
    const el = document.getElementById('quizTiles');
    el.innerHTML = '';
    quiz.tiles.forEach((tile, i) => {
      const btn = document.createElement('button');
      btn.className = 'tile-btn' + (tile.used ? ' used' : '');
      btn.textContent = tile.char;
      btn.disabled = tile.used || quiz.resolved;
      btn.addEventListener('click', () => onTileClick(i));
      el.appendChild(btn);
    });
  }
  function onTileClick(tileIndex){
    if (quiz.resolved) return;
    const tile = quiz.tiles[tileIndex];
    if (tile.used) return;
    const emptySlot = quiz.slots.findIndex(s => s === null);
    if (emptySlot === -1) return;
    quiz.slots[emptySlot] = tile.char;
    tile.used = true;
    tile.slotIndex = emptySlot;
    renderQuizSpelling();
    renderQuizTiles();
    if (quiz.slots.every(s => s !== null)) resolveQuiz(false);
  }
  function onSlotClick(slotIndex){
    if (quiz.resolved) return;
    if (quiz.slots[slotIndex] === null) return;
    const tile = quiz.tiles.find(t => t.used && t.slotIndex === slotIndex);
    if (tile){ tile.used = false; tile.slotIndex = undefined; }
    quiz.slots[slotIndex] = null;
    renderQuizSpelling();
    renderQuizTiles();
  }

  function updateQuizTimer(dt){
    if (!quiz || quiz.resolved) return;
    quiz.timeLeft -= dt;
    const remaining = Math.max(0, quiz.timeLeft);
    const ratio = remaining / quiz.timeTotal;
    const danger = remaining <= QUIZ_DANGER_TIME;

    const fillEl = document.getElementById('quizTimerFill');
    const numEl = document.getElementById('quizTimerNum');
    fillEl.style.width = (ratio * 100) + '%';
    fillEl.classList.toggle('danger', danger);
    numEl.textContent = remaining.toFixed(1);
    numEl.classList.toggle('danger', danger);

    if (quiz.timeLeft <= 0) resolveQuiz(true);
  }

  function resolveQuiz(timedOut){
    if (quiz.resolved) return;
    quiz.resolved = true;

    const correct = !timedOut && quiz.slots.every((s, i) => s === quiz.chars[quiz.blankIndices[i]]);
    const stats = loadStats(quiz.pack.id);
    applyUpgrade(quiz.upgrade, correct);
    if (correct){
      stats.correctCount += 1;
      removeWrongWord(quiz.pack.id, quiz.wordObj);
      addBonusXp(player.correctBonusXp);
      sfxQuizCorrect();
    } else {
      stats.wrongCount += 1;
      recordWrongWord(quiz.pack.id, quiz.wordObj);
      sfxQuizWrong();
    }
    saveStats(quiz.pack.id, stats);

    quiz.blankIndices.forEach((charIdx, i) => { quiz.slots[i] = quiz.chars[charIdx]; });
    renderQuizSpelling();
    renderQuizTiles();
    document.getElementById('quizResult').textContent =
      (correct ? t('quizCorrectPrefix') : t('quizWrongPrefix')) + upgradeTitle(quiz.upgrade.id) +
      (correct ? t('quizResultBig') : t('quizResultSmall'));

    setTimeout(closeQuiz, 1000);
  }

  function closeQuiz(){
    document.getElementById('quizOverlay').classList.add('hidden');
    quiz = null;
    pendingLevelUps = Math.max(0, pendingLevelUps - 1);
    if (pendingLevelUps > 0){
      triggerLevelUpReward();
    } else {
      gameState = 'playing';
      setPauseButtonVisible(true);
      lastTs = performance.now();
    }
  }

  // ---------- level-up reward routing (quiz or evolution) ----------
  function triggerLevelUpReward(){
    const evo = pendingEvolution();
    if (evo) showEvolution(evo); else openQuiz();
  }
  function showEvolution(evo){
    gameState = 'evolution';
    setPauseButtonVisible(false);
    sfxEvolution();
    player.evolutions[evo.id] = true;
    document.getElementById('evolutionIcon').textContent = evo.icon;
    document.getElementById('evolutionTitle').textContent = evolutionTitle(evo.id);
    document.getElementById('evolutionDesc').textContent = evolutionDesc(evo.id);
    document.getElementById('evolutionOverlay').classList.remove('hidden');
    setTimeout(closeEvolution, 2400);
  }
  function closeEvolution(){
    document.getElementById('evolutionOverlay').classList.add('hidden');
    pendingLevelUps = Math.max(0, pendingLevelUps - 1);
    if (pendingLevelUps > 0){
      triggerLevelUpReward();
    } else {
      gameState = 'playing';
      setPauseButtonVisible(true);
      lastTs = performance.now();
    }
  }

  // ---------- skill display ----------
  function renderSkillBar(){
    const bar = document.getElementById('skillBar');
    bar.innerHTML = '';
    for (const id in player.upgradeCounts){
      const count = player.upgradeCounts[id];
      if (count <= 0) continue;
      const u = upgradeById(id);
      const pill = document.createElement('span');
      const sealed = player.sealedUpgradeId === id;
      pill.className = 'skill-pill' + (sealed ? ' sealed' : '');
      pill.textContent = (sealed ? '🔒' : u.icon) + ' ' + upgradeShort(id) + ' x' + count;
      bar.appendChild(pill);
    }
  }
  function buildSkillListHtml(){
    const ids = Object.keys(player.upgradeCounts).filter(id => player.upgradeCounts[id] > 0);
    if (ids.length === 0) return '<div class="empty">' + t('emptySkillList') + '</div>';
    return ids.map(id => {
      const u = upgradeById(id);
      const count = player.upgradeCounts[id];
      const sealed = player.sealedUpgradeId === id;
      return '<div class="skill-row' + (sealed ? ' sealed' : '') + '">' +
        '<span class="icon">' + (sealed ? '🔒' : u.icon) + '</span>' +
        '<span class="info"><div class="name">' + upgradeTitle(id) + (sealed ? t('sealedTag') : '') + '</div>' +
        '<div class="desc">' + upgradeDesc(id) + '</div>' +
        '<div class="effect">' + upgradeEffectText(id, player) + '</div></span>' +
        '<span class="stack">x' + count + '</span></div>';
    }).join('');
  }
  function renderPauseSkillList(){
    document.getElementById('pauseSkillList').innerHTML = buildSkillListHtml();
  }

  // ---------- game over ----------
  function gameOver(){
    gameState = 'gameover';
    setPauseButtonVisible(false);
    sfxGameOver();

    const stats = loadStats(currentPackId());
    if (survivalTime > stats.highScoreTime) stats.highScoreTime = survivalTime;
    if (player.level > stats.highScoreLevel) stats.highScoreLevel = player.level;
    saveStats(currentPackId(), stats);

    const m = Math.floor(survivalTime / 60), s = Math.floor(survivalTime % 60);
    document.getElementById('gameOverStats').textContent =
      t('survivalTimeLabel') + ' ' + pad(m) + ':' + pad(s) + ' / ' + t('levelLabel') + player.level;
    document.getElementById('gameOverSkillList').innerHTML = buildSkillListHtml();
    document.getElementById('gameOverOverlay').classList.remove('hidden');
  }
  document.getElementById('retryBtn').addEventListener('click', resetGame);

  // ---------- hud ----------
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function updateHud(){
    document.getElementById('hpFill').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
    document.getElementById('hpText').textContent = Math.max(0, Math.ceil(player.hp)) + '/' + player.maxHp;
    document.getElementById('xpFill').style.width = Math.max(0, player.xp / player.xpNext * 100) + '%';
    document.getElementById('xpText').textContent = Math.floor(player.xp) + '/' + player.xpNext;
    document.getElementById('levelText').textContent = player.level;
    const m = Math.floor(survivalTime / 60), s = Math.floor(survivalTime % 60);
    document.getElementById('timeText').textContent = pad(m) + ':' + pad(s);

    const pendEl = document.getElementById('pendingLevelUpsLabel');
    if (stageMode && isBossActive() && pendingLevelUps > 0){
      pendEl.classList.remove('hidden');
      pendEl.textContent = tf('pendingLevelUpsLabel', { count: pendingLevelUps });
    } else {
      pendEl.classList.add('hidden');
    }
  }

  // ---------- update ----------
  function update(dt){
    survivalTime += dt;

    const iv = inputVector();
    const spd = CFG.baseSpeed * player.speedMult;
    player.vx = iv.x * spd;
    player.vy = iv.y * spd;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    if (iv.x !== 0 || iv.y !== 0) player.facing = Math.atan2(iv.y, iv.x);

    if (player.invuln > 0) player.invuln -= dt;

    fireTimer -= dt;
    if (fireTimer <= 0){
      fireBullets();
      fireTimer += CFG.fireInterval * (player.fireIntervalMult || 1);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0){
      if (!(stageMode && isBossActive())){
        const n = spawnCount(survivalTime);
        for (let i = 0; i < n; i++) spawnEnemy();
      }
      spawnTimer += spawnInterval(survivalTime);
    }

    if (stageMode){
      if (stagePhase === 'pending-mini' && survivalTime >= CFG.stage.miniBossTime){
        spawnBoss('mini'); stagePhase = 'mini-active';
      } else if (stagePhase === 'pending-mid' && survivalTime >= CFG.stage.midBossTime){
        spawnBoss('mid'); stagePhase = 'mid-active';
      } else if (stagePhase === 'pending-big' && survivalTime >= CFG.stage.bigBossTime){
        spawnBoss('big'); stagePhase = 'big-active';
      }
    }

    eliteTimer -= dt;
    if (eliteTimer <= 0){
      spawnElite();
      eliteTimer += CFG.eliteInterval;
    }

    encircleTimer -= dt;
    if (encircleTimer <= 0){
      spawnEncircleRing();
      showEncircleWarning();
      encircleTimer += CFG.encircleInterval;
    }
    if (encircleWarningTimer > 0){
      encircleWarningTimer -= dt;
      if (encircleWarningTimer <= 0) hideEncircleWarning();
    }

    for (let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let destroyed = false;
      for (let j = enemies.length - 1; j >= 0; j--){
        const e = enemies[j];
        if (b.hitSet.has(e)) continue;
        const rr = (b.radius + e.radius);
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 <= rr * rr){
          e.hp -= b.damage;
          e.hitFlash = 0.12;
          b.hitSet.add(e);
          if (player.evolutions.bombardment){
            applySplashDamage(e.x, e.y, CFG.bombardmentRadius, CFG.bombardmentDamage, e);
          }
          if (e.hp <= 0) killEnemy(e);

          if (b.bounceLeft > 0){
            const nextTarget = findNearestEnemyExcluding(b.x, b.y, b.hitSet);
            if (nextTarget){
              const ang = Math.atan2(nextTarget.y - b.y, nextTarget.x - b.x);
              const spd2 = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(ang) * spd2; b.vy = Math.sin(ang) * spd2;
              b.bounceLeft -= 1;
            } else if (b.pierceLeft > 0){
              b.pierceLeft -= 1;
            } else {
              destroyed = true;
            }
          } else if (b.pierceLeft > 0){
            b.pierceLeft -= 1;
          } else {
            destroyed = true;
          }
          break;
        }
      }
      if (destroyed || b.life <= 0) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if (e.hitFlash > 0) e.hitFlash -= dt;

      if (e.type === 'elite'){
        updateElite(e, dt);
      } else if (e.type === 'boss'){
        updateBoss(e, dt);
      } else {
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        e.x += (dx / dist) * e.speed * dt;
        e.y += (dy / dist) * e.speed * dt;
      }

      const rr = e.radius + player.radius;
      const pd = Math.hypot(player.x - e.x, player.y - e.y);
      if (pd <= rr && player.invuln <= 0){
        player.hp -= e.damage * (1 - (player.defense || 0));
        player.invuln = CFG.invulnTime + (player.invulnBonus || 0);
        sfxHit();
        if (player.hp <= 0){ player.hp = 0; gameOver(); }
      }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--){
      const b = enemyBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let hit = false;
      const dist = Math.hypot(player.x - b.x, player.y - b.y);
      if (dist <= player.radius + b.radius && player.invuln <= 0){
        player.hp -= b.damage * (1 - (player.defense || 0));
        player.invuln = CFG.invulnTime + (player.invulnBonus || 0);
        sfxHit();
        hit = true;
        if (player.hp <= 0){ player.hp = 0; gameOver(); }
      }
      if (hit || b.life <= 0) enemyBullets.splice(i, 1);
    }

    updateBossHpBar();

    if ((player.auraDps || 0) > 0){
      const radius = CFG.auraBaseRadius + (player.auraRadiusBonus || 0);
      let dps = player.auraDps;
      if (player.evolutions.sprint && (iv.x !== 0 || iv.y !== 0)) dps *= CFG.sprintAuraMult;
      for (let i = enemies.length - 1; i >= 0; i--){
        const e = enemies[i];
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d <= radius + e.radius){
          e.hp -= dps * dt;
          e.hitFlash = Math.max(e.hitFlash, 0.06);
          if (e.hp <= 0) killEnemy(e);
        }
      }
    }

    for (let i = gems.length - 1; i >= 0; i--){
      const g = gems[i];
      const dx = player.x - g.x, dy = player.y - g.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist <= CFG.collectRadius){
        sfxGem();
        grantXp(g.value);
        gems.splice(i, 1);
        continue;
      }
      const magnetR = CFG.magnetRadius + (player.magnetBonus || 0);
      if (dist <= magnetR){
        const pull = CFG.gemSpeed * (1 - dist / magnetR + 0.3);
        g.x += (dx / dist) * pull * dt;
        g.y += (dy / dist) * pull * dt;
      }
    }

    for (let i = heals.length - 1; i >= 0; i--){
      const h = heals[i];
      const dist = Math.hypot(player.x - h.x, player.y - h.y);
      if (dist <= player.radius + h.radius){
        player.hp = Math.min(player.maxHp, player.hp + h.amount);
        heals.splice(i, 1);
        sfxHeal();
      }
    }

    purgeMinionsIfPending();
    updateAbilityWarning(dt);

    camera.x = player.x - width / 2;
    camera.y = player.y - height / 2;
    updateHud();
  }

  // ---------- draw ----------
  function drawGrid(){
    const cell = 64;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    const offX = -((camera.x % cell) + cell) % cell;
    const offY = -((camera.y % cell) + cell) % cell;
    ctx.beginPath();
    for (let x = offX; x < width; x += cell){ ctx.moveTo(x, 0); ctx.lineTo(x, height); }
    for (let y = offY; y < height; y += cell){ ctx.moveTo(0, y); ctx.lineTo(width, y); }
    ctx.stroke();
  }

  function draw(){
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#12121c';
    ctx.fillRect(0, 0, width, height);
    drawGrid();

    for (const g of gems){
      const sx = g.x - camera.x, sy = g.y - camera.y;
      if (sx < -20 || sx > width + 20 || sy < -20 || sy > height + 20) continue;
      ctx.fillStyle = '#4dffb0';
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();
    }

    for (const h of heals){
      const sx = h.x - camera.x, sy = h.y - camera.y;
      if (sx < -20 || sx > width + 20 || sy < -20 || sy > height + 20) continue;
      ctx.fillStyle = '#ff6b81';
      ctx.save();
      ctx.translate(sx, sy);
      ctx.fillRect(-8, -2.5, 16, 5);
      ctx.fillRect(-2.5, -8, 5, 16);
      ctx.restore();
    }

    for (const b of bullets){
      const sx = b.x - camera.x, sy = b.y - camera.y;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const b of enemyBullets){
      const sx = b.x - camera.x, sy = b.y - camera.y;
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath();
      ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // mid boss beams (drawn before culling: the beam can be on screen while the boss is not)
    for (const e of enemies){
      if (e.type !== 'boss' || !e.isMainBoss || e.bossTier !== 'mid') continue;
      const end = beamEnd(e);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(e.x - camera.x, e.y - camera.y);
      ctx.lineTo(end.x - camera.x, end.y - camera.y);
      if (e.beamActive){
        ctx.strokeStyle = 'rgba(255,90,200,0.35)';
        ctx.lineWidth = CFG.stage.beamWidth * 1.8;
        ctx.stroke();
        ctx.strokeStyle = '#ffd6f5';
        ctx.lineWidth = CFG.stage.beamWidth * 0.5;
        ctx.stroke();
      } else {
        // telegraph line until the beam fires
        ctx.strokeStyle = 'rgba(255,90,200,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
      }
      ctx.restore();
    }

    for (const e of enemies){
      const sx = e.x - camera.x, sy = e.y - camera.y;
      if (sx < -60 || sx > width + 60 || sy < -60 || sy > height + 60) continue;
      const isElite = e.type === 'elite';
      const isBoss = e.type === 'boss';
      const isMinion = e.type === 'minion';
      ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (isBoss ? '#ff2d55' : (isElite ? '#c04dff' : (isMinion ? '#ff9f43' : '#ff5566')));
      ctx.beginPath();
      ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
      ctx.fill();
      if (isElite){
        ctx.lineWidth = 3;
        ctx.strokeStyle = e.eliteState === 'dashing' ? '#ffe066' : 'rgba(255,224,102,0.6)';
        ctx.stroke();
      }
      if (isBoss){
        ctx.lineWidth = 4;
        ctx.strokeStyle = e.isMainBoss ? '#ffe066' : 'rgba(255,224,102,0.6)';
        ctx.stroke();
      }
      if (!isBoss){
        const hpRatio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(sx - e.radius, sy - e.radius - 8, e.radius * 2, 4);
        ctx.fillStyle = '#ff8a5c';
        ctx.fillRect(sx - e.radius, sy - e.radius - 8, e.radius * 2 * hpRatio, 4);
      }
    }

    // player, always screen-centered
    const px = width / 2, py = height / 2;

    if ((player.auraDps || 0) > 0){
      const auraRadius = CFG.auraBaseRadius + (player.auraRadiusBonus || 0);
      ctx.beginPath();
      ctx.arc(px, py, auraRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(124,247,201,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(124,247,201,0.08)';
      ctx.fill();
    }

    ctx.save();
    ctx.translate(px, py);
    if (player.invuln > 0 && Math.floor(survivalTime * 20) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.rotate(player.facing);
    ctx.fillStyle = '#4dd0ff';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath();
    ctx.moveTo(player.radius + 6, 0);
    ctx.lineTo(player.radius - 4, -6);
    ctx.lineTo(player.radius - 4, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---------- main loop ----------
  function loop(ts){
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    dt = Math.min(dt, 0.05);

    if (gameState === 'playing') update(dt);
    else if (gameState === 'quiz') updateQuizTimer(dt);
    updateJoystickVisibility();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- init ----------
  player = newPlayer();
  enemies = []; bullets = []; gems = []; heals = []; enemyBullets = [];
  gameState = 'title';
  setPauseButtonVisible(false);
  applyI18n();
  updateHud();
  if (!lsGet('vs_seen_howto', false)){
    lsSet('vs_seen_howto', true);
    openHowto();
  }
  requestAnimationFrame(loop);
})();
</script>
