<script>
  // ---------- online ranking (Supabase REST) ----------
  // 自分のプロジェクトの値に差し替える。プレースホルダのままならランキングは無効（オフラインのまま遊べる）
  const CONFIG = {
    SUPABASE_URL: 'https://fadtttgkzyryzjakvrva.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_JVfGO7BS_IhZnHhLRQZlDw_CdCbwIx6',
    RANKING_TABLE: 'scores',
    // 記録の送信先（1プレイ1行で上書き）。supabase_submit_run.sql で作成する
    RANKING_SUBMIT_FN: 'submit_run',

    // クイズ難易度の段階（生存時間で上がる）。値は選択した難易度パックの設定からの相対値
    // from: 段階が始まる生存時間（秒） / timeMult: 制限時間の倍率 / extraBlanks: 伏せ字の追加数 / extraDummies: ダミー文字の追加数
    // 数学パックは timeMult のみ適用
    QUIZ_TIERS: [
      { from: 0,   timeMult: 1,    extraBlanks: 0, extraDummies: 0 },
      { from: 300, timeMult: 0.8,  extraBlanks: 0, extraDummies: 2 },
      { from: 600, timeMult: 0.65, extraBlanks: 1, extraDummies: 3 },
      { from: 900, timeMult: 0.5,  extraBlanks: 2, extraDummies: 4 },
    ],
    QUIZ_MIN_TIME: 4,          // 制限時間の下限（秒）
    QUIZ_ALL_BLANK_MAX_LEN: 2, // この文字数以下の単語は常に全文字を伏せる
    QUIZ_TIER_NOTICE_TIME: 2,  // 段階が上がったときの通知の表示時間（プレイ中の秒数）

    // 期間限定イベント（判定はプレイヤー端末のローカル時刻。開始日0:00〜終了日23:59、年またぎも可）
    // 同時に有効になるのは「現在のイベント」1つだけ。告知・配色・アイテムの見た目・単語はすべてそれに従う
    // 単語データに <イベントID>: true（例 valentine: true）を付けると、そのイベントの間だけ出題される
    // priority: 期間が重なったときは数値が大きいイベントを採用（forceEnable 中のものは期間内のものより常に優先）
    // forceEnable: true にすると期間外でも有効になる（デバッグ用）
    // icon: 告知と単語の目印に使う絵文字 / titleDeco: タイトル左右の飾り（省略可）
    // minWordRate: 1プレイ内のイベント単語の出題割合をこれ以上に保つ（0〜1。省略時は通常の単語と同じ確率）
    // 配色は CSS の html.<イベントID>、ゲーム画面は CANVAS_THEMES / EVENT_SPRITES に同じIDで追加する
    EVENTS: {
      newyear:   { start: { month: 12, day: 31 }, end: { month: 1, day: 3 },   priority: 50, forceEnable: false, icon: '🎍' },
      christmas: { start: { month: 12, day: 20 }, end: { month: 12, day: 26 }, priority: 40, forceEnable: false, icon: '🎄' },
      valentine: { start: { month: 2, day: 10 },  end: { month: 2, day: 15 },  priority: 30, forceEnable: false, icon: '💝' },
      tanabata:  { start: { month: 7, day: 1 },   end: { month: 7, day: 7 },   priority: 20, forceEnable: false, icon: '🎋' },
      halloween: { start: { month: 10, day: 25 }, end: { month: 11, day: 1 },  priority: 10, forceEnable: false, icon: '🎃',
                   titleDeco: ['🎃', '👻'], minWordRate: 0.6 },
    },
  };
</script>

    animation: warnPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes warnPulse { from { opacity: 1; } to { opacity: 0.55; } }

  #bossWarning {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 110px); left: 50%;
    transform: translateX(-50%); z-index: 12; text-align: center;
    background: rgba(180,20,80,0.9); color: #fff; font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    animation: warnPulse 0.6s ease-in-out infinite alternate;
  }

  #bossAbilityWarning {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 150px); left: 50%;
    transform: translateX(-50%); z-index: 12; text-align: center; max-width: 90vw;
    background: rgba(255,140,0,0.9); color: #fff; font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 20px;
    animation: warnPulse 0.5s ease-in-out infinite alternate;
  }

  .skill-pill.sealed, .skill-row.sealed { filter: grayscale(1); opacity: 0.45; }
  .skill-pill.sealed { text-decoration: line-through; }

  #bossHpBar {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%;
    transform: translateX(-50%); width: min(90vw, 480px); z-index: 11; pointer-events: none;
  }
  .boss-hp-label {
    text-align: center; font-size: 11px; font-weight: 800; color: #ffe066;
    text-shadow: 0 1px 3px #000; margin-bottom: 3px;
  }
  .boss-hp-track { height: 10px; }
  /* make room for the boss HP bar so it doesn't cover the time / level row */
  #hud.boss-shift { top: calc(env(safe-area-inset-top, 0px) + 46px); }

  .tier-label { font-size: 11px; opacity: 0.8; }
  #quizTierNotice {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); z-index: 12;
    pointer-events: none; text-align: center; white-space: nowrap;
    font-size: 26px; font-weight: 800; color: #ffe066; text-shadow: 0 2px 8px #000, 0 0 18px rgba(255,140,40,0.7);
  }
  #quizTierNotice span { display: inline-block; animation: evoPulse 0.5s ease-out; }

  #pendingLevelUpsLabel {
    font-size: 11px; font-weight: 700; color: #ffe066; text-shadow: 0 1px 2px #000;
    background: rgba(0,0,0,0.35); border-radius: 10px; padding: 2px 8px; align-self: flex-start;
  }

  .sound-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; width: 100%; max-width: 280px; }
  .mute-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; font-size: 17px;
  }
  .mute-btn:active { background: rgba(255,255,255,0.2); }
  .volume-slider { flex: 1; accent-color: #4dd0ff; }

  /* ---------- seasonal events (html.event-active + html.<event id> while an event is current) ---------- */
  html:not(.event-active) .event-only { display: none !important; }
  .event-banner {
    font-size: 13px; font-weight: 800; margin: 2px 0 6px; padding: 6px 16px; border-radius: 16px;
    color: #1a0f26; background: linear-gradient(90deg, var(--hw-orange), #ffc36b);

  }
  html.event-active #quizMeaning { max-width: 100%; }
  .event-word-mark {
    display: inline-block; vertical-align: middle; margin-left: 8px; padding: 2px 8px; white-space: nowrap;
    font-size: 12px; font-weight: 800; border-radius: 10px; text-shadow: none;
    color: #1a0f26; background: var(--hw-orange);
  }
  :root {
    --hw-orange: #ff9a2e;
    --hw-purple: #8a4dff;
    --hw-purple-light: #b48cff;
  }
  /* halloween theme */
  html.halloween {
    --start-btn-bg: linear-gradient(160deg, #ffb057, #ff6a00);

  }
  html.halloween .overlay { background: rgba(18,6,30,0.85); }

  html.halloween .select-btn.selected { background: var(--hw-purple); border-color: var(--hw-purple); color: #fff; }

  html.halloween .home-highscore, html.halloween .home-howto-brief, html.halloween .howto-section {
    background: rgba(138,77,255,0.1); border-color: rgba(180,140,255,0.3);

  html.halloween #rankingBtn { border-color: rgba(255,154,46,0.6); background: rgba(255,154,46,0.14); color: var(--hw-orange); }
  html.halloween .card { background: linear-gradient(160deg, #2e1d45, #170f22); border-color: rgba(180,140,255,0.3); }
  html.halloween .card:active { background: linear-gradient(160deg, #3e2860, #21152f); }
  html.halloween .tile-btn { background: linear-gradient(160deg, #3a2458, #1f1430); border-color: rgba(180,140,255,0.4); }

  html.halloween .volume-slider { accent-color: var(--hw-purple-light); }

</head>

    return nav.indexOf('ja') === 0 ? 'ja' : 'en';

  function t(key){
    const dict = I18N[uiLang] || I18N.en;
    return Object.prototype.hasOwnProperty.call(dict, key) ? dict[key] : (I18N.en[key] || key);
  }
  function tf(key, vars){
    let s = t(key);
    for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
    return s;
  }
  function setUiLang(lang){
    uiLang = (lang === 'ja') ? 'ja' : 'en';

    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });

  // ---------- seasonal events (periods live in CONFIG.EVENTS) ----------
  function monthDayKey(month, day){ return month * 100 + day; }
  function isEventActive(id, now){
    const ev = CONFIG.EVENTS && CONFIG.EVENTS[id];
    if (!ev) return false;
    if (ev.forceEnable) return true;
    now = now || new Date(); // the player's local time
    const key = monthDayKey(now.getMonth() + 1, now.getDate());
    const start = monthDayKey(ev.start.month, ev.start.day);
    const end = monthDayKey(ev.end.month, ev.end.day);
    // both days inclusive; start > end means the period wraps past New Year
    return start <= end ? (key >= start && key <= end) : (key >= start || key <= end);
  }
  const EVENT_IDS = Object.keys(CONFIG.EVENTS);
  let activeEventId = null; // the one event in effect now, or null
  // forced (debug) events beat in-period ones, then higher priority wins; ties go to the earlier CONFIG entry
  function currentEventId(){
    const rank = id => (CONFIG.EVENTS[id].forceEnable ? 1e6 : 0) + (CONFIG.EVENTS[id].priority || 0);
    return EVENT_IDS.filter(id => isEventActive(id))
      .reduce((best, id) => (best === null || rank(id) > rank(best)) ? id : best, null);
  }
  // returns true when the current event changed
  function refreshEvents(){
    const was = activeEventId;
    activeEventId = currentEventId();
    const cl = document.documentElement.classList;
    EVENT_IDS.forEach(id => cl.toggle(id, id === activeEventId));
    cl.toggle('event-active', activeEventId !== null);
    renderEventBanner();
    return was !== activeEventId;
  }
  function eventName(id){ return t('event_' + id + '_name'); }
  function renderEventBanner(){
    if (!activeEventId) return; // hidden by CSS
    const ev = CONFIG.EVENTS[activeEventId];
    const deco = ev.titleDeco || [];
    document.getElementById('eventBanner').textContent =
      tf('eventNotice', { name: eventName(activeEventId), month: ev.end.month, day: ev.end.day });
    document.getElementById('titleDecoL').textContent = deco[0] ? deco[0] + ' ' : '';
    document.getElementById('titleDecoR').textContent = deco[1] ? ' ' + deco[1] : '';
  }

  function ensureAudioContext(){
    if (audioCtx){
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : volume / 100;
      masterGain.connect(audioCtx.destination);

  }

    const last = lastPlayedAt[key] || 0;
    if (now - last < (minGap != null ? minGap : 50)) return false;
    if (activeVoiceCount >= (CFG.sound.maxVoices || 16)) return false;
    lastPlayedAt[key] = now;
    return true;
  }
  function registerVoice(node){
    activeVoiceCount++;
    node.onended = () => { activeVoiceCount = Math.max(0, activeVoiceCount - 1); };
  }

  function playToneAt(freq, duration, startTime, opts){
    opts = opts || {};
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, freq), startTime);
    if (opts.freqEnd != null){
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), startTime + duration);
    }
    const g = audioCtx.createGain();
    const peak = opts.gain != null ? opts.gain : 0.15;
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.exponentialRampToValueAtTime(peak, startTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
    registerVoice(osc);
  }

  function playTone(freq, duration, opts){
    opts = opts || {};
    if (!canPlaySound(opts.key, opts.minGap)) return;
    ensureAudioContext();
    if (!audioCtx) return;
    playToneAt(freq, duration, audioCtx.currentTime, opts);
  }

  function playSequence(notes, noteDuration, gap, opts){
    opts = opts || {};
    if (!canPlaySound(opts.key, opts.minGap)) return;
    ensureAudioContext();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    notes.forEach((freq, i) => {
      playToneAt(freq, noteDuration, t0 + i * (noteDuration + gap), opts);
    });
  }

  function playNoise(duration, opts){
    opts = opts || {};
    if (!canPlaySound(opts.key, opts.minGap)) return;
    ensureAudioContext();
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = opts.filterFreq || 500;
    const g = audioCtx.createGain();
    const peak = opts.gain != null ? opts.gain : 0.2;
    g.gain.setValueAtTime(peak, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    src.connect(filter); filter.connect(g); g.connect(masterGain);
    src.start(t0);
    src.stop(t0 + duration + 0.02);
    registerVoice(src);
  }

  // Rebuilds upgrade-derived stats by replaying history, skipping the sealed upgrade. Stack counts are untouched.
  function recalcUpgradeStats(){
    const base = newPlayer();
    for (const h of player.upgradeHistory){
      if (h.id === player.sealedUpgradeId) continue;
      const u = upgradeById(h.id);
      (h.strong ? u.strongApply : u.weakApply)(base);
      base.upgradeCounts[h.id] = Math.min(MAX_ABILITY_STACKS, (base.upgradeCounts[h.id] || 0) + 1);
    }
    UPGRADE_STAT_FIELDS.forEach(f => { player[f] = base[f]; });

  function lsSet(key, value){

  }

  function recordWrongWord(packId, wordObj){
    const list = lsGet(wrongKey(packId), []);
    const existing = list.find(w => w.word === wordObj.word);
    if (existing){ existing.count += 1; existing.lastAt = Date.now(); }
    else list.push({ word: wordObj.word, meaning: wordObj.meaning, count: 1, lastAt: Date.now() });
    lsSet(wrongKey(packId), list);
  }
  function removeWrongWord(packId, wordObj){
    const list = lsGet(wrongKey(packId), []);

  }

    // out-of-season event words can't be asked, so they don't count as pending review

  let joyActive = false, joyId = null;
  let joyOrigin = { x: 0, y: 0 };
  let joyVec = { x: 0, y: 0 };
  const JOY_MAX = (CFG.joystick.baseSize - CFG.joystick.knobSize) / 2;

  (function initJoystickLayout(){
    const jc = CFG.joystick;
    joyEl.style.width = jc.baseSize + 'px';

    joyEl.style.bottom = 'calc(env(safe-area-inset-bottom, 0px) + ' + jc.bottomMargin + 'px)';

  function setJoyOpacity(v){
    joyBase.style.opacity = v;
    joyKnob.style.opacity = v;
  }
  function setKnobOffset(x, y){
    joyKnob.style.transform = 'translate(calc(-50% + ' + x + 'px), calc(-50% + ' + y + 'px))';
  }
  function resetKnob(){
    setKnobOffset(0, 0);
    joyVec.x = 0; joyVec.y = 0;
  }

  function pointWithinJoyBase(x, y){
    const r = joyEl.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return Math.hypot(x - cx, y - cy) <= r.width / 2;
  }

  function updateJoyKnob(x, y){
    let dx = x - joyOrigin.x, dy = y - joyOrigin.y;
    const dist = Math.hypot(dx, dy);
    const clamped = Math.min(dist, JOY_MAX);
    const ang = Math.atan2(dy, dx);
    const kx = Math.cos(ang) * clamped, ky = Math.sin(ang) * clamped;
    setKnobOffset(kx, ky);
    joyVec.x = dist > 4 ? Math.cos(ang) * (clamped / JOY_MAX) : 0;
    joyVec.y = dist > 4 ? Math.sin(ang) * (clamped / JOY_MAX) : 0;
  }

  joyEl.addEventListener('touchstart', e => {
    if (joyActive) return;
    for (const t of e.changedTouches){
      if (pointWithinJoyBase(t.clientX, t.clientY)){
        joyActive = true; joyId = t.identifier;
        const r = joyEl.getBoundingClientRect();
        joyOrigin.x = r.left + r.width / 2; joyOrigin.y = r.top + r.height / 2;
        setJoyOpacity(CFG.joystick.activeOpacity);
        updateJoyKnob(t.clientX, t.clientY);

  function updateJoystickVisibility(){
    const show = isTouchDevice && gameState === 'playing';
    if (show === joystickVisible) return;
    joystickVisible = show;
    joyEl.classList.toggle('hidden', !show);
    if (!show){
      joyActive = false; joyId = null;
      setJoyOpacity(CFG.joystick.opacity);
      resetKnob();
    }
  }

  function inputVector(){
    const kv = keyboardVector();
    if (kv.x !== 0 || kv.y !== 0){
      const len = Math.hypot(kv.x, kv.y) || 1;
      return { x: kv.x / len, y: kv.y / len };
    }
    return joyVec;
  }

  // ---------- spawning ----------
  function spawnInterval(t){ return Math.max(0.25, (1.4 - t * CFG.spawnIntervalRamp * tuning.spawnRampMult) / stageDifficultyMult); }
  function spawnCount(t){ return Math.min(6, 1 + Math.floor(t * tuning.spawnRampMult / CFG.spawnCountStepTime)) + Math.floor((stageDifficultyMult - 1) * 2); }

  function createEnemyAt(x, y, opts){
    opts = opts || {};
    const t = survivalTime;
    const variance = 0.85 + Math.random() * 0.3;
    const hp = CFG.enemyBaseHp * (1 + t * CFG.enemyHpGrowth * tuning.enemyGrowthMult) * variance * (opts.hpMult || 1) * stageDifficultyMult;
    const speed = CFG.enemyBaseSpeed * (1 + Math.min(t * 0.004, 0.6)) * (0.9 + Math.random() * 0.2) * (opts.speedMult != null ? opts.speedMult : 1);
    return {
      x, y, hp, maxHp: hp, speed,
      damage: CFG.enemyBaseDamage * (1 + t * CFG.enemyDamageGrowth * tuning.enemyGrowthMult) * (opts.damageMult || 1) * stageDifficultyMult,
      xpValue: Math.round(CFG.enemyBaseXp * variance * (opts.xpMult || 1)),
      radius: opts.radius || 14 * variance,
      hitFlash: 0,
      type: opts.type || 'normal',
      encircle: !!opts.encircle,
    };
  }

  function spawnEnemy(){
    if (enemies.length >= CFG.maxEnemies) return;
    const spawnRadius = Math.hypot(width, height) / 2 + 120;
    const ang = Math.random() * Math.PI * 2;
    enemies.push(createEnemyAt(player.x + Math.cos(ang) * spawnRadius, player.y + Math.sin(ang) * spawnRadius));
  }

  function spawnElite(){
    if (enemies.length >= CFG.maxEnemies) return;
    const spawnRadius = Math.hypot(width, height) / 2 + CFG.eliteSpawnPadding;
    const ang = Math.random() * Math.PI * 2;
    const e = createEnemyAt(player.x + Math.cos(ang) * spawnRadius, player.y + Math.sin(ang) * spawnRadius, {
      hpMult: CFG.eliteHpMult, damageMult: CFG.eliteDamageMult, xpMult: CFG.eliteXpMult,
      radius: CFG.eliteRadius, type: 'elite',
    });
    e.eliteState = 'recover';
    e.eliteTimer = 0.4;
    e.dashVX = 0; e.dashVY = 0;
    enemies.push(e);
    sfxEliteSpawn();
  }

  function updateElite(e, dt){
    if (e.eliteState === 'dashing'){
      e.x += e.dashVX * dt;
      e.y += e.dashVY * dt;
      e.eliteTimer -= dt;
      if (e.eliteTimer <= 0){ e.eliteState = 'recover'; e.eliteTimer = CFG.eliteRecoverTime; }
    } else {
      e.eliteTimer -= dt;
      if (e.eliteTimer <= 0){
        const leadX = player.x + (player.vx || 0) * CFG.elitePredictLead;
        const leadY = player.y + (player.vy || 0) * CFG.elitePredictLead;
        const ang = Math.atan2(leadY - e.y, leadX - e.x);
        e.dashVX = Math.cos(ang) * CFG.eliteDashSpeed;
        e.dashVY = Math.sin(ang) * CFG.eliteDashSpeed;
        e.eliteState = 'dashing';
        e.eliteTimer = CFG.eliteDashDuration;
      }
    }
  }

  function spawnEncircleRing(){
    const cx = player.x, cy = player.y;
    const radius = Math.hypot(width, height) / 2 + CFG.encircleSpawnPadding;
    const gapAngle = Math.random() * Math.PI * 2;
    const half = CFG.encircleGapWidth * tuning.encircleGapMult / 2;
    const n = CFG.encircleEnemyCount;
    for (let i = 0; i < n; i++){
      if (enemies.length >= CFG.maxEnemies) break;
      const angle = (i / n) * Math.PI * 2;
      let d = Math.abs(angle - gapAngle);
      d = Math.min(d, Math.PI * 2 - d);
      if (d < half) continue;
      enemies.push(createEnemyAt(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius, { speedMult: CFG.encircleSpeedMult, encircle: true }));
    }
  }
  function showEncircleWarning(){
    encircleWarningTimer = CFG.encircleDuration;
    document.getElementById('encircleWarning').classList.remove('hidden');
    sfxEncircleWarning();
  }
  function hideEncircleWarning(){
    document.getElementById('encircleWarning').classList.add('hidden');
  }

  // ---------- bosses (stage mode) ----------
  // half-extents of the area a boss center may occupy, relative to the (screen-centered) player
  function bossScreenHalfExtents(radius){
    const m = CFG.stage.bossScreenMargin + radius;
    return { hw: Math.max(0, width / 2 - m), hh: Math.max(0, height / 2 - m) };
  }
  function bossSpawnPoint(radius){
    const { hw, hh } = bossScreenHalfExtents(radius);
    const dist = Math.min(CFG.stage.bossSpawnDistance, Math.max(hw, hh));
    let ox = 0, oy = 0;
    for (let attempt = 0; attempt < 20; attempt++){
      const ang = Math.random() * Math.PI * 2;
      ox = Math.cos(ang) * dist;
      oy = Math.sin(ang) * dist;
      if (Math.abs(ox) <= hw && Math.abs(oy) <= hh) break;
    }
    // fallback for very small screens: pull the last candidate inside the screen
    ox = Math.max(-hw, Math.min(hw, ox));
    oy = Math.max(-hh, Math.min(hh, oy));
    return { x: player.x + ox, y: player.y + oy };
  }
  // keeps a boss on screen: an edge-hugging boss is held at the edge, a far one is pulled back
  function keepBossOnScreen(e, dt){
    const { hw, hh } = bossScreenHalfExtents(e.radius);
    const tx = Math.max(player.x - hw, Math.min(player.x + hw, e.x));
    const ty = Math.max(player.y - hh, Math.min(player.y + hh, e.y));
    const dx = tx - e.x, dy = ty - e.y;
    const d = Math.hypot(dx, dy);
    if (d === 0) return;
    const step = CFG.stage.bossReturnSpeed * dt;
    if (d <= step){ e.x = tx; e.y = ty; }
    else { e.x += dx / d * step; e.y += dy / d * step; }
  }

  function spawnBoss(tier){
    let hpMult, speedMult, radius;
    if (tier === 'mini'){ hpMult = CFG.stage.miniBossHpMult; speedMult = CFG.stage.miniBossSpeedMult; radius = CFG.stage.miniBossRadius; }
    else if (tier === 'mid'){ hpMult = CFG.stage.midBossHpMult; speedMult = CFG.stage.midBossSpeedMult; radius = CFG.stage.midBossRadius; }
    else { hpMult = CFG.stage.bigBossHpMult; speedMult = CFG.stage.bigBossSpeedMult; radius = CFG.stage.bigBossRadius; }

    const pos = bossSpawnPoint(radius);
    const e = createEnemyAt(pos.x, pos.y, {
      hpMult: hpMult * tuning.bossHpMult, speedMult, damageMult: CFG.stage.bossDamageMult, xpMult: hpMult * 0.5, radius, type: 'boss',
    });
    e.bossTier = tier;
    e.isMainBoss = true;
    e.hasSplit = false;
    e.attackTimer = CFG.stage.midAttackInterval * tuning.bossAttackIntervalMult;
    e.summonTimer = CFG.stage.miniSummonInterval;
    e.beamDelay = CFG.stage.beamStartDelay;
    e.beamActive = false;
    e.beamAngle = Math.random() * Math.PI * 2;
    e.beamDir = Math.random() < 0.5 ? -1 : 1;
    e.hasSealed = false;
    enemies.push(e);
    showBossWarning(tier);
    sfxBossWarning();
  }

  function summonMinions(boss){
    const n = CFG.stage.miniSummonCount;
    const offset = Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++){
      if (enemies.length >= CFG.maxEnemies) break;
      const ang = offset + (i / n) * Math.PI * 2;
      enemies.push(createEnemyAt(
        boss.x + Math.cos(ang) * (boss.radius + CFG.stage.miniSummonDistance),
        boss.y + Math.sin(ang) * (boss.radius + CFG.stage.miniSummonDistance),
        { type: 'minion', hpMult: CFG.stage.minionHpMult, speedMult: CFG.stage.minionSpeedMult, radius: CFG.stage.minionRadius }
      ));
    }
    showAbilityWarning(t('bossAbilitySummon'));
    sfxBossSummon();
  }

  function beamEnd(e){
    return { x: e.x + Math.cos(e.beamAngle) * CFG.stage.beamLength, y: e.y + Math.sin(e.beamAngle) * CFG.stage.beamLength };
  }
  function distToSegment(px, py, ax, ay, bx, by){
    const vx = bx - ax, vy = by - ay;
    const lenSq = vx * vx + vy * vy || 1;
    const k = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / lenSq));
    return Math.hypot(px - (ax + vx * k), py - (ay + vy * k));
  }
  function updateBossBeam(e, dt){
    if (!e.beamActive){
      e.beamDelay -= dt;
      if (e.beamDelay > 0) return;
      e.beamActive = true;
      showAbilityWarning(t('bossAbilityBeam'));
      sfxBossBeam();
    }
    e.beamAngle += e.beamDir * CFG.stage.beamRotationSpeed * dt;
    const end = beamEnd(e);
    if (player.quizGrace <= 0 && distToSegment(player.x, player.y, e.x, e.y, end.x, end.y) <= player.radius + CFG.stage.beamWidth / 2){
      player.hp -= CFG.stage.beamDps * stageDifficultyMult * (1 - (player.defense || 0)) * dt;
      sfxHit();
      if (player.hp <= 0){ player.hp = 0; gameOver(); }
    }
  }

  // Minions are removed after the update pass so in-progress enemy loops keep valid indices.
  let minionPurgePending = false;
  function purgeMinionsIfPending(){
    if (!minionPurgePending) return;
    minionPurgePending = false;
    for (let i = enemies.length - 1; i >= 0; i--){
      if (enemies[i].type === 'minion') enemies.splice(i, 1);
    }
  }

  function showAbilityWarning(text){
    const el = document.getElementById('bossAbilityWarning');
    el.textContent = text;
    el.classList.remove('hidden');
    abilityWarningTimer = CFG.stage.abilityWarningDuration;
  }
  function updateAbilityWarning(dt){
    if (abilityWarningTimer <= 0) return;
    abilityWarningTimer -= dt;
    if (abilityWarningTimer <= 0) document.getElementById('bossAbilityWarning').classList.add('hidden');
  }

  function spawnBossClone(parent){
    const e = createEnemyAt(
      parent.x + (Math.random() - 0.5) * 80,
      parent.y + (Math.random() - 0.5) * 80,
      { type: 'boss', radius: CFG.stage.bigBossRadius * 0.7 }
    );
    e.maxHp = parent.maxHp * CFG.stage.bigCloneHpRatio;
    e.hp = e.maxHp;
    e.speed = parent.speed;
    e.damage = parent.damage;
    e.xpValue = Math.round(parent.xpValue * 0.4);
    e.bossTier = 'big';
    e.isMainBoss = false;
    e.hasSplit = true;
    e.attackTimer = CFG.stage.midAttackInterval * tuning.bossAttackIntervalMult * 0.7;
    enemies.push(e);
  }

  function bossRadialAttack(e){
    const n = CFG.stage.midAttackBulletCount;
    for (let i = 0; i < n; i++){
      const ang = (i / n) * Math.PI * 2;
      enemyBullets.push({
        x: e.x, y: e.y,
        vx: Math.cos(ang) * CFG.stage.midAttackBulletSpeed,
        vy: Math.sin(ang) * CFG.stage.midAttackBulletSpeed,
        radius: 6,
        damage: CFG.stage.midAttackBulletDamage * stageDifficultyMult,
        life: 4,
      });
    }
  }

  function updateBoss(e, dt){
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    e.x += (dx / dist) * e.speed * dt;
    e.y += (dy / dist) * e.speed * dt;
    keepBossOnScreen(e, dt);

    if (e.bossTier === 'mid' || e.bossTier === 'big'){
      e.attackTimer -= dt;
      if (e.attackTimer <= 0){
        bossRadialAttack(e);
        e.attackTimer = CFG.stage.midAttackInterval * tuning.bossAttackIntervalMult;
      }
    }
    if (e.bossTier === 'big' && e.isMainBoss && !e.hasSplit && e.hp <= e.maxHp * 0.5){
      e.hasSplit = true;
      for (let i = 0; i < CFG.stage.bigCloneCount; i++) spawnBossClone(e);
    }
    if (!e.isMainBoss) return;

    if (e.bossTier === 'mini'){
      e.summonTimer -= dt;
      if (e.summonTimer <= 0){
        summonMinions(e);
        e.summonTimer += CFG.stage.miniSummonInterval;
      }
    } else if (e.bossTier === 'mid'){
      updateBossBeam(e, dt);
    } else if (e.bossTier === 'big' && !e.hasSealed && e.hp <= e.maxHp * CFG.stage.sealHpRatio){
      e.hasSealed = true;
      sealRandomUpgrade();
    }
  }

  function showBossWarning(tier){
    const el = document.getElementById('bossWarning');
    el.textContent = tf('bossWarningText', { name: t('bossName_' + tier) });
    el.classList.remove('hidden');
    // counts down only during play, so a quiz opening right after the spawn doesn't eat the warning
    bossWarningTimer = CFG.stage.bossWarningDuration;
  }
  function updateBossWarning(dt){
    if (bossWarningTimer <= 0) return;
    bossWarningTimer -= dt;
    if (bossWarningTimer <= 0) document.getElementById('bossWarning').classList.add('hidden');
  }

  function updateBossHpBar(){
    const boss = enemies.find(e => e.type === 'boss' && e.isMainBoss);
    const bar = document.getElementById('bossHpBar');
    const hud = document.getElementById('hud');
    if (!boss){ bar.classList.add('hidden'); hud.classList.remove('boss-shift'); return; }
    bar.classList.remove('hidden');
    hud.classList.add('boss-shift');
    document.getElementById('bossHpLabel').textContent = t('bossName_' + boss.bossTier);
    document.getElementById('bossHpFill').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
  }

  function onBossDefeated(tier){
    if (tier === 'mini') minionPurgePending = true;
    if (tier === 'big') releaseSeal();
    pendingBossTier = tier;
    showBossReward();
  }

  function pickThreeUpgrades(){
    const avail = UPGRADES.filter(u => (player.upgradeCounts[u.id] || 0) < MAX_ABILITY_STACKS);
    return shuffleArray(avail.slice()).slice(0, 3);
  }

  function showBossReward(){
    const choices = pickThreeUpgrades();
    if (choices.length === 0){ afterBossRewardResolved(); return; }
    gameState = 'bossReward';
    setPauseButtonVisible(false);
    const list = document.getElementById('bossRewardList');
    list.innerHTML = '';
    choices.forEach(u => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = '<span class="icon">' + u.icon + '</span><span class="title">' + upgradeTitle(u.id) + '</span>' +
        '<div class="desc">' + upgradeDesc(u.id) + '</div>';
      el.addEventListener('click', () => chooseBossReward(u));
      list.appendChild(el);
    });
    document.getElementById('bossRewardOverlay').classList.remove('hidden');
  }

  function chooseBossReward(u){
    applyUpgrade(u, true);
    document.getElementById('bossRewardOverlay').classList.add('hidden');
    afterBossRewardResolved();
  }

  function afterBossRewardResolved(){
    if (pendingBossTier === 'mini') stagePhase = 'pending-mid';
    else if (pendingBossTier === 'mid') stagePhase = 'pending-big';
    else if (pendingBossTier === 'big') stagePhase = 'cleared';
    pendingBossTier = null;

    if (stagePhase === 'cleared'){
      stageClear();
      return;
    }
    gameState = 'playing';
    setPauseButtonVisible(true);
    lastTs = performance.now();
    if (pendingLevelUps > 0) triggerLevelUpReward();
  }

  function stageClear(){
    gameState = 'stageclear';
    runActive = false;
    setPauseButtonVisible(false);
    const packId = currentPackId();
    const cleared = lsGet('vs_cleared_' + packId, 0);
    if (stageNumber > cleared) lsSet('vs_cleared_' + packId, stageNumber);

    const stats = loadStats(packId);
    if (survivalTime > stats.highScoreTime) stats.highScoreTime = survivalTime;
    if (player.level > stats.highScoreLevel) stats.highScoreLevel = player.level;
    saveStats(packId, stats);

    const total = stats.correctCount + stats.wrongCount;
    const rate = total > 0 ? Math.round(stats.correctCount / total * 100) : 0;
    const m = Math.floor(survivalTime / 60), s = Math.floor(survivalTime % 60);
    document.getElementById('stageClearStats').innerHTML =
      tf('stageClearTimeKills', { time: pad(m) + ':' + pad(s), kills: killCount }) + '<br>' +
      tf('stageClearAccuracy', { pct: rate });
    document.getElementById('stageClearSkillList').innerHTML = buildSkillListHtml();
    offerRankingSubmit('stageClearRankSubmit');
    document.getElementById('bossHpBar').classList.add('hidden');
    document.getElementById('stageClearOverlay').classList.remove('hidden');
  }

  // ---------- combat ----------
  function makeBullet(x, y, angle){
    const spd = CFG.bulletSpeed * (player.bulletSpeedMult || 1);
    return {
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      damage: CFG.baseAtk * player.atkMult,
      radius: CFG.bulletRadius,
      life: 1.6,
      pierceLeft: player.pierceCount || 0,
      bounceLeft: player.bounceCount || 0,
      hitSet: new Set(),
    };
  }

  function fireBullets(){
    if (enemies.length === 0) return;
    sfxShoot();
    const sorted = enemies.slice().sort((a, b) => {
      const da = (a.x - player.x) ** 2 + (a.y - player.y) ** 2;
      const db = (b.x - player.x) ** 2 + (b.y - player.y) ** 2;
      return da - db;
    });
    for (let i = 0; i < player.bulletCount; i++){
      const target = sorted[i % sorted.length];
      let ang = Math.atan2(target.y - player.y, target.x - player.x);
      if (i >= sorted.length) ang += (Math.random() - 0.5) * 0.5;
      bullets.push(makeBullet(player.x, player.y, ang));
    }
    if (player.evolutions.barrage){
      const n = 12;
      for (let i = 0; i < n; i++){
        bullets.push(makeBullet(player.x, player.y, (i / n) * Math.PI * 2));
      }
    }
  }

  function findNearestEnemyExcluding(x, y, excludeSet){
    let best = null, bestD = Infinity;
    for (const e of enemies){
      if (excludeSet && excludeSet.has(e)) continue;
      const d = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d < bestD){ bestD = d; best = e; }
    }
    return best;
  }

  function applySplashDamage(x, y, radius, dmg, excludeEnemy){
    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if (e === excludeEnemy) continue;
      const d = Math.hypot(e.x - x, e.y - y);
      if (d <= radius + e.radius){
        e.hp -= dmg;
        e.hitFlash = 0.12;
        if (e.hp <= 0) killEnemy(e, { triggerBurst: false });
      }
    }
  }

  function killEnemy(enemy, opts){
    opts = opts || {};
    const idx = enemies.indexOf(enemy);
    if (idx === -1) return;
    sfxKill();
    killCount += 1;
    const isMinion = enemy.type === 'minion'; // minions drop nothing, so they can't be farmed
    if (!isMinion) gems.push({ x: enemy.x, y: enemy.y, value: enemy.xpValue, radius: 6 });
    const guaranteedHeal = enemy.type === 'elite' || enemy.type === 'boss';
    if (guaranteedHeal || (!isMinion && Math.random() < CFG.healDropChance * tuning.healDropMult)){
      heals.push({ x: enemy.x, y: enemy.y, radius: CFG.healRadius, amount: CFG.healAmount });
    }
    const shouldBurst = opts.triggerBurst !== false && (player.burstDamage || 0) > 0;
    const bx = enemy.x, by = enemy.y;
    const br = CFG.burstBaseRadius + (player.burstRadiusBonus || 0);
    const bd = player.burstDamage || 0;
    const isMainBossKill = enemy.type === 'boss' && enemy.isMainBoss;
    const bossTier = enemy.bossTier;
    enemies.splice(idx, 1);
    if (shouldBurst) applySplashDamage(bx, by, br, bd, enemy);
    if (isMainBossKill) onBossDefeated(bossTier);
  }

  function addBonusXp(amount){
    if (!amount) return;
    player.xp += amount;
    while (player.xp >= player.xpNext){
      player.xp -= player.xpNext;
      player.level += 1;
      player.xpNext = xpToNext(player.level);
      pendingLevelUps += 1;
      sfxLevelUp();
    }
  }

  function grantXp(amount){
    player.xp += amount;
    while (player.xp >= player.xpNext){
      player.xp -= player.xpNext;
      player.level += 1;
      player.xpNext = xpToNext(player.level);
      pendingLevelUps += 1;
      sfxLevelUp();
    }
    if (pendingLevelUps > 0 && gameState === 'playing' && !(stageMode && isBossActive())) triggerLevelUpReward();
  }

  // ---------- quiz difficulty tiers (rise with survival time; see CONFIG.QUIZ_TIERS) ----------
  function quizTierAt(time){
    let idx = 0;
    CONFIG.QUIZ_TIERS.forEach((tier, i) => { if (time >= tier.from) idx = i; });
    return idx;
  }
  // the notice counts down only during play, like the boss warning
  function updateQuizTier(dt){
    const idx = quizTierAt(survivalTime);
    if (idx > quizTier){
      quizTier = idx;
      const el = document.getElementById('quizTierNotice');
      el.innerHTML = '';
      const text = document.createElement('span'); // fresh node restarts the pop-in animation
      text.textContent = tf('quizTierUp', { n: quizTier + 1, max: CONFIG.QUIZ_TIERS.length });
      el.appendChild(text);
      quizTierNoticeTimer = CONFIG.QUIZ_TIER_NOTICE_TIME;
    }
    if (quizTierNoticeTimer > 0) quizTierNoticeTimer -= dt;
  }
  // shown only during play: overlays (quiz, pause, ...) are translucent, so it would bleed through them;
  // whatever time is left is shown once play resumes
  function syncQuizTierNotice(){
    const show = gameState === 'playing' && quizTierNoticeTimer > 0;
    document.getElementById('quizTierNotice').classList.toggle('hidden', !show);
  }

  // ---------- level up quiz (word fill-in-the-blank) ----------
  const QUIZ_DANGER_TIME = 1.5;

  const WRONG_WORD_PRIORITY = 0.6;

  function pickRandomWord(pack){
    const words = activeWords(pack);
    const seasonal = words.filter(w => wordEventId(w) !== null);
    const minRate = activeEventId ? CONFIG.EVENTS[activeEventId].minWordRate : 0;
    if (!minRate || seasonal.length === 0 || seasonal.length === words.length) return pickWithReviewPriority(pack, words);
    // keep this run's share of event words at or above minWordRate after every question:
    // force one when a normal word would drop below it, otherwise roll at that rate
    const useSeasonal = runEventPicked < minRate * (runWordsPicked + 1) || Math.random() < minRate;
    runWordsPicked += 1;
    if (useSeasonal) runEventPicked += 1;
    return pickWithReviewPriority(pack, useSeasonal ? seasonal : words.filter(w => wordEventId(w) === null));
  }
  // words answered wrong before are asked first WRONG_WORD_PRIORITY of the time
  function pickWithReviewPriority(pack, words){
    const wrongList = lsGet(wrongKey(pack.id), []);
    const wrongWords = wrongList.length
      ? words.filter(w => wrongList.some(r => r.word === w.word))
      : [];
    const otherWords = wrongWords.length
      ? words.filter(w => !wrongWords.includes(w))
      : words;

    let pool;
    if (wrongWords.length > 0 && otherWords.length > 0){
      pool = (Math.random() < WRONG_WORD_PRIORITY) ? wrongWords : otherWords;
    } else {
      pool = wrongWords.length > 0 ? wrongWords : otherWords;
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function buildDummyPool(pack, currentWord){
    const set = new Set();
    activeWords(pack).forEach(w => {
      if (w === currentWord) return;
      for (const ch of w.word) set.add(ch);
    });
    return Array.from(set);
  }
  function shuffleArray(arr){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function openQuiz(){
    gameState = 'quiz';
    setPauseButtonVisible(false);

    const pack = getPack(currentPackId());
    const difficulty = getDifficulty(pack.difficultyId);
    const wordObj = pickRandomWord(pack);
    const chars = Array.from(wordObj.word);
    const len = chars.length;
    const tier = CONFIG.QUIZ_TIERS[quizTier];
    // math answers are only a few digits, so only the time cut applies there
    const extraBlanks = pack.blankAll ? 0 : tier.extraBlanks;
    const extraDummies = pack.blankAll ? 0 : tier.extraDummies;
    let blankCount;
    if (pack.blankAll || len <= CONFIG.QUIZ_ALL_BLANK_MAX_LEN) blankCount = len;
    else {
      // base rule keeps one letter visible; tier extras may hide up to the whole word
      const base = Math.max(1, Math.min(difficulty.blankCount - (player.quizBlankReduction || 0), len - 1));
      blankCount = Math.min(len, base + extraBlanks);
    }
    const quizTime = Math.max(CONFIG.QUIZ_MIN_TIME,
      (wordObj.time || pack.quizTime || difficulty.quizTime) * tier.timeMult + (player.quizTimeBonus || 0));

    const blankIndices = [];
    while (blankIndices.length < blankCount){
      const idx = Math.floor(Math.random() * len);
      if (!blankIndices.includes(idx)) blankIndices.push(idx);
    }
    blankIndices.sort((a, b) => a - b);

    const neededDummies = Math.max(2, 6 - blankCount) + extraDummies;
    const dummies = [];
    if (pack.tileChars){
      // distinct dummies from the tile set, excluding every char in the answer
      const pool = shuffleArray(Array.from(pack.tileChars).filter(ch => !chars.includes(ch)));
      dummies.push(...pool.slice(0, neededDummies));
    } else {
      const dummyPool = buildDummyPool(pack, wordObj);
      for (let i = 0; i < neededDummies && dummyPool.length > 0; i++){
        dummies.push(dummyPool[Math.floor(Math.random() * dummyPool.length)]);
      }
    }
    const tiles = shuffleArray(
      blankIndices.map(i => chars[i]).concat(dummies)
    ).map(ch => ({ char: ch, used: false, slotIndex: undefined }));

    quiz = {
      pack, wordObj, chars, blankIndices,
      slots: blankIndices.map(() => null),
      tiles,
      timeLeft: quizTime, timeTotal: quizTime,
      resolved: false,
      upgrade: pickAvailableUpgrade(),
    };

    document.getElementById('quizResult').textContent = '';
    const meaningEl = document.getElementById('quizMeaning');
    meaningEl.textContent = wordMeaning(wordObj);
    const wordEvent = wordEventId(wordObj);
    if (wordEvent){
      const mark = document.createElement('span');
      mark.className = 'event-word-mark';
      mark.textContent = tf('eventWordMark', { icon: CONFIG.EVENTS[wordEvent].icon, name: eventName(wordEvent) });
      meaningEl.appendChild(mark);
    }
    const fillEl = document.getElementById('quizTimerFill');
    const numEl = document.getElementById('quizTimerNum');
    fillEl.style.width = '100%';
    fillEl.classList.remove('danger');
    numEl.textContent = quizTime.toFixed(1);
    numEl.classList.remove('danger');
    renderQuizSpelling();
    renderQuizTiles();
    document.getElementById('quizOverlay').classList.remove('hidden');
  }

  function renderQuizSpelling(){
    const el = document.getElementById('quizSpelling');
    el.innerHTML = '';
    quiz.chars.forEach((ch, i) => {
      const blankPos = quiz.blankIndices.indexOf(i);
      const box = document.createElement('span');
      if (blankPos === -1){
        box.className = 'letter-box';
        box.textContent = ch;
      } else {
        const filled = quiz.slots[blankPos];
        box.className = 'letter-box blank' + (filled ? ' filled' : '');
        box.textContent = filled || '_';
        if (filled) box.addEventListener('click', () => onSlotClick(blankPos));
      }
      el.appendChild(box);
    });
  }
  function renderQuizTiles(){
    const el = document.getElementById('quizTiles');
    el.innerHTML = '';
    quiz.tiles.forEach((tile, i) => {
      const btn = document.createElement('button');
      btn.className = 'tile-btn' + (tile.used ? ' used' : '');
      btn.textContent = tile.char;
      btn.disabled = tile.used || quiz.resolved;
      btn.addEventListener('click', () => onTileClick(i));
      el.appendChild(btn);
    });
  }
  function onTileClick(tileIndex){
    if (quiz.resolved) return;
    const tile = quiz.tiles[tileIndex];
    if (tile.used) return;
    const emptySlot = quiz.slots.findIndex(s => s === null);
    if (emptySlot === -1) return;
    quiz.slots[emptySlot] = tile.char;
    tile.used = true;
    tile.slotIndex = emptySlot;
    renderQuizSpelling();
    renderQuizTiles();
    if (quiz.slots.every(s => s !== null)) resolveQuiz(false);
  }
  function onSlotClick(slotIndex){
    if (quiz.resolved) return;
    if (quiz.slots[slotIndex] === null) return;
    const tile = quiz.tiles.find(t => t.used && t.slotIndex === slotIndex);
    if (tile){ tile.used = false; tile.slotIndex = undefined; }
    quiz.slots[slotIndex] = null;
    renderQuizSpelling();
    renderQuizTiles();
  }

  function updateQuizTimer(dt){
    if (!quiz || quiz.resolved) return;
    quiz.timeLeft -= dt;
    const remaining = Math.max(0, quiz.timeLeft);
    const ratio = remaining / quiz.timeTotal;
    const danger = remaining <= QUIZ_DANGER_TIME;

    const fillEl = document.getElementById('quizTimerFill');
    const numEl = document.getElementById('quizTimerNum');
    fillEl.style.width = (ratio * 100) + '%';
    fillEl.classList.toggle('danger', danger);
    numEl.textContent = remaining.toFixed(1);
    numEl.classList.toggle('danger', danger);

    if (quiz.timeLeft <= 0) resolveQuiz(true);
  }

  function resolveQuiz(timedOut){
    if (quiz.resolved) return;
    quiz.resolved = true;

    const correct = !timedOut && quiz.slots.every((s, i) => s === quiz.chars[quiz.blankIndices[i]]);
    const stats = loadStats(quiz.pack.id);
    applyUpgrade(quiz.upgrade, correct);
    if (correct){
      stats.correctCount += 1;
      runQuizCorrect += 1;
      removeWrongWord(quiz.pack.id, quiz.wordObj);
      addBonusXp(player.correctBonusXp);
      sfxQuizCorrect();
    } else {
      stats.wrongCount += 1;
      runQuizWrong += 1;
      recordWrongWord(quiz.pack.id, quiz.wordObj);
      sfxQuizWrong();
    }
    saveStats(quiz.pack.id, stats);

    quiz.blankIndices.forEach((charIdx, i) => { quiz.slots[i] = quiz.chars[charIdx]; });
    renderQuizSpelling();
    renderQuizTiles();
    document.getElementById('quizResult').textContent =
      (correct ? t('quizCorrectPrefix') : t('quizWrongPrefix')) + upgradeTitle(quiz.upgrade.id) +
      (correct ? t('quizResultBig') : t('quizResultSmall'));

    setTimeout(closeQuiz, 1000);
  }

  function closeQuiz(){
    document.getElementById('quizOverlay').classList.add('hidden');
    quiz = null;
    // only ticks during play, so it also covers an evolution popup chained after the quiz
    player.quizGrace = CFG.quizGrace.duration;
    player.quizGraceArmed = false;
    pendingLevelUps = Math.max(0, pendingLevelUps - 1);
    if (pendingLevelUps > 0){
      triggerLevelUpReward();
    } else {
      gameState = 'playing';
      setPauseButtonVisible(true);
      lastTs = performance.now();
    }
  }

  document.getElementById('retryBtn').addEventListener('click', resetGame);

  // ---------- online ranking ----------
  // Supabase REST via fetch. Any failure only shows a small message; local high scores are unaffected.
  const RANK_NAME_MAX = 12;
  const RANK_LIMIT = 50;
  const RANK_TIMEOUT_MS = 8000;
  function rankingEnabled(){
    if (typeof CONFIG === 'undefined') return false;
    const url = CONFIG.SUPABASE_URL || '', key = CONFIG.SUPABASE_ANON_KEY || '';
    return /^https:\/\//.test(url) && key !== '' && !/YOUR-/.test(url + key);
  }
  function rankingFetch(path, options){
    options = options || {};
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), RANK_TIMEOUT_MS);
    const headers = Object.assign({
      apikey: CONFIG.SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
    }, options.headers);
    return fetch(CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + path,
      Object.assign({}, options, { headers, signal: ctrl.signal }))
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res; })
      .finally(() => clearTimeout(timer));
  }
  // Ranking is endless mode only.
  function rankingEligible(){ return rankingEnabled() && !stageMode; }
  function rankSubmitPath(){ return 'rpc/' + encodeURIComponent(CONFIG.RANKING_SUBMIT_FN); }
  // Inserts or updates this run's row (see supabase_submit_run.sql). The body is text/plain so
  // the same server function also accepts sendBeacon, which can't send JSON cross-origin.
  function submitScore(record){
    return rankingFetch(rankSubmitPath(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(record),
      keepalive: true,
    });
  }
  // sendBeacon can't set headers, so the key goes in the query string (Supabase accepts ?apikey=)
  function beaconScore(record){
    const url = CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/' + rankSubmitPath() +
      '?apikey=' + encodeURIComponent(CONFIG.SUPABASE_ANON_KEY);
    try { return navigator.sendBeacon(url, JSON.stringify(record)); } catch (e) { return false; }
  }
  function newRunId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  function currentRunRecord(name){
    const total = runQuizCorrect + runQuizWrong;
    return {
      run_id: runId,
      name,
      pack_id: runPackId,
      survival_time: Math.round(survivalTime * 10) / 10,
      level: player.level,
      accuracy: total > 0 ? Math.round(runQuizCorrect / total * 1000) / 10 : null,
    };
  }
  // automatic sends (timer / leaving the page) never ask for a name, so they need one saved already
  function canAutoSubmit(){ return runActive && rankingEligible() && getPlayerName() !== ''; }
  function autoSubmitRun(){
    if (canAutoSubmit()) submitScore(currentRunRecord(getPlayerName())).catch(() => {});
  }
  function beaconSubmitRun(){
    if (canAutoSubmit()) beaconScore(currentRunRecord(getPlayerName()));
  }
  function submitWithStatus(status, record){
    status.className = 'rank-status';
    status.textContent = t('rankSending');
    submitScore(record)
      .then(() => { status.textContent = t('rankSent'); })
      .catch(() => { status.className = 'rank-status error'; status.textContent = t('rankSendError'); });
  }
  function fetchRanking(packId){
    return rankingFetch(encodeURIComponent(CONFIG.RANKING_TABLE) +
      '?select=name,survival_time,level&pack_id=eq.' + encodeURIComponent(packId) +
      '&order=survival_time.desc&limit=' + RANK_LIMIT)
      .then(res => res.json());
  }
  function getPlayerName(){
    const n = lsGet('vs_name', '');
    return typeof n === 'string' ? n : '';
  }
  function formatSurvival(sec){
    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return pad(m) + ':' + pad(s);
  }

  function offerRankingSubmit(containerId){
    const box = document.getElementById(containerId);
    box.innerHTML = '';
    if (!rankingEligible()) return;

    const record = currentRunRecord('');
    const status = document.createElement('div');
    status.className = 'rank-status';
    const send = name => submitWithStatus(status, Object.assign(record, { name }));

    box.appendChild(status);
    const savedName = getPlayerName();
    if (savedName){ send(savedName); return; }
    // no nickname yet: ask first; cancelling skips the upload and leaves the result screen as is
    openNameDialog(name => { if (name) send(name); });

  // pause menu: end the run now, send its record, and go home (cancelling the name dialog stays paused)
  function quitAndSubmit(){
    if (gameState !== 'paused' || !rankingEligible()) return;
    const record = currentRunRecord('');
    const finish = name => {
      if (!name) return;
      goHome();
      submitWithStatus(document.getElementById('homeRankStatus'), Object.assign(record, { name }));
    };
    const savedName = getPlayerName();
    if (savedName) finish(savedName); else openNameDialog(finish);
  }
  document.getElementById('quitSubmitBtn').addEventListener('click', quitAndSubmit);

  let rankingRequestId = 0;

  function loadRanking(){

  // ---------- hud ----------
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function updateHud(){

  // ---------- update ----------
  function update(dt){
    survivalTime += dt;
    // before anything that can level up, so a quiz opened this frame already uses the new tier
    updateQuizTier(dt);

    const iv = inputVector();
    const spd = CFG.baseSpeed * player.speedMult;
    player.vx = iv.x * spd;
    player.vy = iv.y * spd;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    if (iv.x !== 0 || iv.y !== 0) player.facing = Math.atan2(iv.y, iv.x);

    if (player.invuln > 0) player.invuln -= dt;
    if (player.quizGrace > 0){
      // a fresh move input ends the grace early; input held since the quiz doesn't count
      const moving = iv.x !== 0 || iv.y !== 0;
      if (!moving) player.quizGraceArmed = true;
      if (moving && player.quizGraceArmed) player.quizGrace = 0;
      else player.quizGrace -= dt;
    }

    fireTimer -= dt;
    if (fireTimer <= 0){
      fireBullets();
      fireTimer += CFG.fireInterval * (player.fireIntervalMult || 1);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0){
      if (!(stageMode && isBossActive())){
        const n = spawnCount(survivalTime);
        for (let i = 0; i < n; i++) spawnEnemy();
      }
      spawnTimer += spawnInterval(survivalTime);
    }

    if (stageMode){
      if (stagePhase === 'pending-mini' && survivalTime >= CFG.stage.miniBossTime){
        spawnBoss('mini'); stagePhase = 'mini-active';
      } else if (stagePhase === 'pending-mid' && survivalTime >= CFG.stage.midBossTime){
        spawnBoss('mid'); stagePhase = 'mid-active';
      } else if (stagePhase === 'pending-big' && survivalTime >= CFG.stage.bigBossTime){
        spawnBoss('big'); stagePhase = 'big-active';
      }
    }

    eliteTimer -= dt;
    if (eliteTimer <= 0){
      spawnElite();
      eliteTimer += CFG.eliteInterval;
    }

    encircleTimer -= dt;
    if (encircleTimer <= 0){
      spawnEncircleRing();
      showEncircleWarning();
      encircleTimer += CFG.encircleInterval;
    }
    if (encircleWarningTimer > 0){
      encircleWarningTimer -= dt;
      if (encircleWarningTimer <= 0) hideEncircleWarning();
    }

    for (let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let destroyed = false;
      for (let j = enemies.length - 1; j >= 0; j--){
        const e = enemies[j];
        if (b.hitSet.has(e)) continue;
        const rr = (b.radius + e.radius);
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 <= rr * rr){
          e.hp -= b.damage;
          e.hitFlash = 0.12;
          b.hitSet.add(e);
          if (player.evolutions.bombardment){
            applySplashDamage(e.x, e.y, CFG.bombardmentRadius, CFG.bombardmentDamage, e);
          }
          if (e.hp <= 0) killEnemy(e);

          if (b.bounceLeft > 0){
            const nextTarget = findNearestEnemyExcluding(b.x, b.y, b.hitSet);
            if (nextTarget){
              const ang = Math.atan2(nextTarget.y - b.y, nextTarget.x - b.x);
              const spd2 = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(ang) * spd2; b.vy = Math.sin(ang) * spd2;
              b.bounceLeft -= 1;
            } else if (b.pierceLeft > 0){
              b.pierceLeft -= 1;
            } else {
              destroyed = true;
            }
          } else if (b.pierceLeft > 0){
            b.pierceLeft -= 1;
          } else {
            destroyed = true;
          }
          break;
        }
      }
      if (destroyed || b.life <= 0) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if (e.hitFlash > 0) e.hitFlash -= dt;

      if (e.type === 'elite'){
        updateElite(e, dt);
      } else if (e.type === 'boss'){
        updateBoss(e, dt);
      } else {
        const dx = player.x - e.x, dy = player.y - e.y;
        const dist = Math.hypot(dx, dy) || 1;
        e.x += (dx / dist) * e.speed * dt;
        e.y += (dy / dist) * e.speed * dt;
      }

      const rr = e.radius + player.radius;
      const pd = Math.hypot(player.x - e.x, player.y - e.y);
      if (pd <= rr && player.invuln <= 0 && player.quizGrace <= 0){
        player.hp -= e.damage * (1 - (player.defense || 0));
        player.invuln = CFG.invulnTime + (player.invulnBonus || 0);
        sfxHit();
        if (player.hp <= 0){ player.hp = 0; gameOver(); }
      }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--){
      const b = enemyBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let hit = false;
      const dist = Math.hypot(player.x - b.x, player.y - b.y);
      if (dist <= player.radius + b.radius && player.invuln <= 0 && player.quizGrace <= 0){
        player.hp -= b.damage * (1 - (player.defense || 0));
        player.invuln = CFG.invulnTime + (player.invulnBonus || 0);
        sfxHit();
        hit = true;
        if (player.hp <= 0){ player.hp = 0; gameOver(); }
      }
      if (hit || b.life <= 0) enemyBullets.splice(i, 1);
    }

    updateBossHpBar();

    if ((player.auraDps || 0) > 0){
      const radius = CFG.auraBaseRadius + (player.auraRadiusBonus || 0);
      let dps = player.auraDps;
      if (player.evolutions.sprint && (iv.x !== 0 || iv.y !== 0)) dps *= CFG.sprintAuraMult;
      for (let i = enemies.length - 1; i >= 0; i--){
        const e = enemies[i];
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d <= radius + e.radius){
          e.hp -= dps * dt;
          e.hitFlash = Math.max(e.hitFlash, 0.06);
          if (e.hp <= 0) killEnemy(e);
        }
      }
    }

    for (let i = gems.length - 1; i >= 0; i--){
      const g = gems[i];
      const dx = player.x - g.x, dy = player.y - g.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist <= CFG.collectRadius){
        sfxGem();
        grantXp(g.value);
        gems.splice(i, 1);
        continue;
      }
      const magnetR = CFG.magnetRadius + (player.magnetBonus || 0);
      if (dist <= magnetR){
        const pull = CFG.gemSpeed * (1 - dist / magnetR + 0.3);
        g.x += (dx / dist) * pull * dt;
        g.y += (dy / dist) * pull * dt;
      }
    }

    for (let i = heals.length - 1; i >= 0; i--){
      const h = heals[i];
      const dist = Math.hypot(player.x - h.x, player.y - h.y);
      if (dist <= player.radius + h.radius){
        player.hp = Math.min(player.maxHp, player.hp + h.amount);
        heals.splice(i, 1);
        sfxHeal();
      }
    }

    updateBomb(dt);

    autoSendTimer -= dt;
    if (autoSendTimer <= 0){
      autoSendTimer += CFG.rankingAutoSendInterval;
      autoSubmitRun();
    }

    purgeMinionsIfPending();
    updateBossWarning(dt);
    updateAbilityWarning(dt);

    camera.x = player.x - width / 2;
    camera.y = player.y - height / 2;
    updateHud();
  }

  // ---------- emergency bomb ----------
  function trySpawnBomb(){
    const c = CFG.bomb;
    const m = c.screenMargin;
    // player is screen-centered, so cap the distance to what fits on screen
    const minDist = Math.min(c.spawnMinDist, Math.min(width, height) / 2 - m);
    for (let attempt = 0; attempt < 30; attempt++){
      const sx = m + Math.random() * Math.max(0, width - m * 2);
      const sy = m + Math.random() * Math.max(0, height - m * 2);
      if (Math.hypot(sx - width / 2, sy - height / 2) < minDist) continue;
      bomb = { x: player.x - width / 2 + sx, y: player.y - height / 2 + sy, life: c.lifetime, radius: c.radius };
      bombCooldown = c.cooldown;
      return;
    }
  }
  function isOnScreen(e){
    const sx = e.x - camera.x, sy = e.y - camera.y;
    return sx >= -e.radius && sx <= width + e.radius && sy >= -e.radius && sy <= height + e.radius;
  }
  function detonateBomb(){
    const c = CFG.bomb;
    const targets = shuffleArray(enemies.filter(e => e.type === 'normal' && !e.encircle && isOnScreen(e)));
    const doomed = new Set(targets.slice(0, Math.round(targets.length * c.killRatio)));
    // removed directly (not via killEnemy) so they drop no gems/heals and don't trigger burst
    for (let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if (!doomed.has(e)) continue;
      bombBlasts.push({ x: e.x, y: e.y, t: 0, maxR: e.radius * 2.2, small: true });
      enemies.splice(i, 1);
    }
    killCount += doomed.size;
    bombBlasts.push({ x: bomb.x, y: bomb.y, t: 0, maxR: c.blastRadius, small: false });
    bomb = null;
    sfxBomb();
  }
  function updateBomb(dt){
    const c = CFG.bomb;
    if (bombCooldown > 0) bombCooldown -= dt;
    if (!bomb && bombCooldown <= 0 && player.hp > 0 && player.hp <= player.maxHp * c.hpThreshold) trySpawnBomb();
    if (bomb){
      bomb.life -= dt;
      if (bomb.life <= 0) bomb = null;
      else if (Math.hypot(player.x - bomb.x, player.y - bomb.y) <= player.radius + bomb.radius) detonateBomb();
    }
    for (let i = bombBlasts.length - 1; i >= 0; i--){
      bombBlasts[i].t += dt;
      if (bombBlasts[i].t >= c.blastDuration) bombBlasts.splice(i, 1);
    }
  }
  function drawBomb(){
    const c = CFG.bomb;
    if (bomb){
      const sx = bomb.x - camera.x, sy = bomb.y - camera.y;
      const elapsed = c.lifetime - bomb.life;
      const rate = bomb.life <= c.urgentTime ? c.blinkRateUrgent : c.blinkRate;
      const bright = Math.floor(elapsed * rate * 2) % 2 === 0;
      const r = bomb.radius;
      ctx.save();
      ctx.translate(sx, sy);
      // glow ring
      ctx.beginPath();
      ctx.arc(0, 0, r + 7, 0, Math.PI * 2);
      ctx.strokeStyle = bright ? 'rgba(255,170,40,0.95)' : 'rgba(255,170,40,0.25)';
      ctx.lineWidth = 3;
      ctx.stroke();
      const drawEventBomb = eventSprites().bomb;
      if (drawEventBomb){
        drawEventBomb(r, bright);
      } else {
        // body
        ctx.beginPath();
        ctx.arc(0, 2, r, 0, Math.PI * 2);
        ctx.fillStyle = bright ? '#3a3a52' : '#22222e';
        ctx.fill();
        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // fuse + spark
        ctx.beginPath();
        ctx.moveTo(r * 0.4, -r * 0.7);
        ctx.quadraticCurveTo(r * 0.9, -r * 1.4, r * 0.5, -r * 1.7);
        ctx.strokeStyle = '#c9a26b';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(r * 0.5, -r * 1.7, bright ? 4.5 : 2.5, 0, Math.PI * 2);
        ctx.fillStyle = bright ? '#ffe066' : '#ff8a3c';
        ctx.fill();
      }
      ctx.restore();
    }
    for (const b of bombBlasts){
      const p = Math.min(1, b.t / c.blastDuration);
      const sx = b.x - camera.x, sy = b.y - camera.y;
      const rr = b.maxR * (0.2 + 0.8 * p);
      ctx.save();
      ctx.globalAlpha = 1 - p;
      ctx.beginPath();
      ctx.arc(sx, sy, rr, 0, Math.PI * 2);
      ctx.fillStyle = b.small ? 'rgba(255,200,80,0.5)' : 'rgba(255,240,200,0.35)';
      ctx.fill();
      ctx.strokeStyle = b.small ? '#ffb340' : '#ff8a3c';
      ctx.lineWidth = b.small ? 2 : 5;
      ctx.stroke();
      ctx.restore();
    }
    // brief full-screen flash right after the main blast
    const main = bombBlasts.find(b => !b.small);
    if (main && main.t < 0.15){
      ctx.save();
      ctx.globalAlpha = 0.35 * (1 - main.t / 0.15);
      ctx.fillStyle = '#fff4d6';
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }
  }

  // ---------- halloween sprites (drawn around the current origin) ----------
  // jack-o'-lantern bomb: the face lights up on the bright blink frames
  function drawPumpkin(r, bright){
    ctx.fillStyle = bright ? '#ff9a2e' : '#c85f12';
    ctx.strokeStyle = '#7a3500';
    ctx.lineWidth = 1.2;
    [-0.5, 0.5, 0].forEach(ox => {
      ctx.beginPath();
      ctx.ellipse(ox * r, 2, r * 0.62, r * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
    ctx.fillStyle = '#4c8a2e';
    ctx.fillRect(-2, -r * 0.9 - 3, 4, 6);
    ctx.fillStyle = bright ? '#ffe066' : '#4a2000';
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, -r * 0.05); ctx.lineTo(-r * 0.15, -r * 0.05); ctx.lineTo(-r * 0.35, -r * 0.4);
    ctx.moveTo(r * 0.55, -r * 0.05); ctx.lineTo(r * 0.15, -r * 0.05); ctx.lineTo(r * 0.35, -r * 0.4);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, r * 0.3);
    ctx.quadraticCurveTo(0, r * 0.95, r * 0.55, r * 0.3);
    ctx.quadraticCurveTo(0, r * 0.55, -r * 0.55, r * 0.3);
    ctx.fill();
  }
  // wrapped candy heal item (about the same size as the normal cross)
  function drawCandy(){
    ctx.fillStyle = '#ffb3d1';
    ctx.beginPath();
    ctx.moveTo(-4, 0); ctx.lineTo(-11, -5); ctx.lineTo(-11, 5); ctx.closePath();
    ctx.moveTo(4, 0); ctx.lineTo(11, -5); ctx.lineTo(11, 5); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff4f9a';
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 1.5);
    ctx.stroke();
  }
  // ghost silhouette for elites; stays inside the collision circle of radius r
  function traceGhost(x, y, r){
    const hw = r * 0.85, hemY = y + r * 0.6, w = hw * 2 / 3;
    ctx.arc(x, y - r * 0.15, hw, Math.PI, 0);
    ctx.lineTo(x + hw, hemY);
    for (let i = 0; i < 3; i++){
      const x0 = x + hw - i * w;
      ctx.quadraticCurveTo(x0 - w / 2, hemY + r * 0.4, x0 - w, hemY);
    }
    ctx.closePath();
  }
  function drawGhostFace(x, y, r){
    ctx.fillStyle = '#2a1840';
    ctx.beginPath();
    ctx.ellipse(x - r * 0.3, y - r * 0.25, r * 0.13, r * 0.2, 0, 0, Math.PI * 2);
    ctx.ellipse(x + r * 0.3, y - r * 0.25, r * 0.13, r * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.15, r * 0.12, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- canvas palette (seasonal) ----------
  // the background stays dark in every theme so enemies, bullets and gems remain easy to read.
  // keyed by event id; an event without an entry uses `normal`
  const CANVAS_THEMES = {
    normal: { grid: 'rgba(255,255,255,0.06)', enemy: '#ff5566', minion: '#ff9f43', elite: '#c04dff' },
    // minions take the old red so they don't blend into the orange normal enemies
    halloween: { grid: 'rgba(168,108,255,0.16)', enemy: '#ff8a1f', minion: '#ff5566', elite: '#e6defa' },
  };
  function canvasTheme(){ return CANVAS_THEMES[activeEventId] || CANVAS_THEMES.normal; }
  // per-event sprite overrides, keyed by event id; any part left out keeps the normal look
  // bomb(r, bright) / heal() draw around the current origin; eliteShape(x, y, r) traces a path, eliteFace(x, y, r) draws on top
  const EVENT_SPRITES = {
    halloween: { bomb: drawPumpkin, heal: drawCandy, eliteShape: traceGhost, eliteFace: drawGhostFace },
  };
  function eventSprites(){ return EVENT_SPRITES[activeEventId] || {}; }

  // ---------- draw ----------
  function drawGrid(){
    const cell = 64;
    ctx.strokeStyle = canvasTheme().grid;
    ctx.lineWidth = 1;
    const offX = -((camera.x % cell) + cell) % cell;
    const offY = -((camera.y % cell) + cell) % cell;
    ctx.beginPath();
    for (let x = offX; x < width; x += cell){ ctx.moveTo(x, 0); ctx.lineTo(x, height); }
    for (let y = offY; y < height; y += cell){ ctx.moveTo(0, y); ctx.lineTo(width, y); }
    ctx.stroke();
  }

  function draw(){
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#12121c';
    ctx.fillRect(0, 0, width, height);
    drawGrid();

    for (const g of gems){
      const sx = g.x - camera.x, sy = g.y - camera.y;
      if (sx < -20 || sx > width + 20 || sy < -20 || sy > height + 20) continue;
      ctx.fillStyle = '#4dffb0';
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();
    }

    for (const h of heals){
      const sx = h.x - camera.x, sy = h.y - camera.y;
      if (sx < -20 || sx > width + 20 || sy < -20 || sy > height + 20) continue;
      ctx.fillStyle = '#ff6b81';
      ctx.save();
      ctx.translate(sx, sy);
      const drawEventHeal = eventSprites().heal;
      if (drawEventHeal) drawEventHeal();
      else {
        ctx.fillRect(-8, -2.5, 16, 5);
        ctx.fillRect(-2.5, -8, 5, 16);
      }
      ctx.restore();
    }

    for (const b of bullets){
      const sx = b.x - camera.x, sy = b.y - camera.y;
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const b of enemyBullets){
      const sx = b.x - camera.x, sy = b.y - camera.y;
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath();
      ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // mid boss beams (drawn before culling: the beam can be on screen while the boss is not)
    for (const e of enemies){
      if (e.type !== 'boss' || !e.isMainBoss || e.bossTier !== 'mid') continue;
      const end = beamEnd(e);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(e.x - camera.x, e.y - camera.y);
      ctx.lineTo(end.x - camera.x, end.y - camera.y);
      if (e.beamActive){
        ctx.strokeStyle = 'rgba(255,90,200,0.35)';
        ctx.lineWidth = CFG.stage.beamWidth * 1.8;
        ctx.stroke();
        ctx.strokeStyle = '#ffd6f5';
        ctx.lineWidth = CFG.stage.beamWidth * 0.5;
        ctx.stroke();
      } else {
        // telegraph line until the beam fires
        ctx.strokeStyle = 'rgba(255,90,200,0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 8]);
        ctx.stroke();
      }
      ctx.restore();
    }

    const theme = canvasTheme();
    const sprites = eventSprites();
    for (const e of enemies){
      const sx = e.x - camera.x, sy = e.y - camera.y;
      if (sx < -60 || sx > width + 60 || sy < -60 || sy > height + 60) continue;
      const isElite = e.type === 'elite';
      const isBoss = e.type === 'boss';
      const isMinion = e.type === 'minion';
      const customElite = isElite && sprites.eliteShape;
      ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (isBoss ? '#ff2d55' : (isElite ? theme.elite : (isMinion ? theme.minion : theme.enemy)));
      ctx.beginPath();
      if (customElite) sprites.eliteShape(sx, sy, e.radius);
      else ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
      ctx.fill();
      if (isElite){
        ctx.lineWidth = 3;
        ctx.strokeStyle = e.eliteState === 'dashing' ? '#ffe066' : 'rgba(255,224,102,0.6)';
        ctx.stroke();
      }
      if (customElite && sprites.eliteFace) sprites.eliteFace(sx, sy, e.radius);
      if (isBoss){
        ctx.lineWidth = 4;
        ctx.strokeStyle = e.isMainBoss ? '#ffe066' : 'rgba(255,224,102,0.6)';
        ctx.stroke();
      }
      if (!isBoss){
        const hpRatio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(sx - e.radius, sy - e.radius - 8, e.radius * 2, 4);
        ctx.fillStyle = '#ff8a5c';
        ctx.fillRect(sx - e.radius, sy - e.radius - 8, e.radius * 2 * hpRatio, 4);
      }
    }

    drawBomb();

    // player, always screen-centered
    const px = width / 2, py = height / 2;

    if ((player.auraDps || 0) > 0){
      const auraRadius = CFG.auraBaseRadius + (player.auraRadiusBonus || 0);
      ctx.beginPath();
      ctx.arc(px, py, auraRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(124,247,201,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(124,247,201,0.08)';
      ctx.fill();
    }

    ctx.save();
    ctx.translate(px, py);
    if (player.quizGrace > 0){
      const g = CFG.quizGrace;
      const rate = player.quizGrace <= g.urgentTime ? g.blinkRateUrgent : g.blinkRate;
      if (Math.floor(performance.now() / 1000 * rate * 2) % 2 === 0) ctx.globalAlpha = 0.25;
    } else if (player.invuln > 0 && Math.floor(survivalTime * 20) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.rotate(player.facing);
    ctx.fillStyle = '#4dd0ff';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a12';
    ctx.beginPath();
    ctx.moveTo(player.radius + 6, 0);
    ctx.lineTo(player.radius - 4, -6);
    ctx.lineTo(player.radius - 4, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    drawBossArrows();
  }

  // arrows on the screen edge pointing at bosses whose center is off screen
  function drawBossArrows(){
    if (!enemies.some(e => e.type === 'boss')) return;
    const inset = CFG.stage.bossArrowInset;
    // keep arrows below the DOM HUD so they aren't hidden behind it
    const hudBottom = document.getElementById('hud').getBoundingClientRect().bottom;
    const top = Math.min(height / 2, Math.max(inset, hudBottom + inset));
    const cx = width / 2, cy = height / 2;
    const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 1000 * Math.PI * 4);
    for (const e of enemies){
      if (e.type !== 'boss') continue;
      const sx = e.x - camera.x, sy = e.y - camera.y;
      if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) continue;
      const dx = sx - cx, dy = sy - cy;
      // scale the direction until it touches the inset rectangle
      const kx = dx > 0 ? (width - inset - cx) / dx : dx < 0 ? (inset - cx) / dx : Infinity;
      const ky = dy > 0 ? (height - inset - cy) / dy : dy < 0 ? (top - cy) / dy : Infinity;
      const k = Math.max(0, Math.min(kx, ky));
      const size = e.isMainBoss ? 16 : 11;
      ctx.save();
      ctx.translate(cx + dx * k, cy + dy * k);
      ctx.rotate(Math.atan2(dy, dx));
      ctx.globalAlpha = pulse;
      ctx.beginPath();
      ctx.moveTo(size, 0);
      ctx.lineTo(-size * 0.7, -size * 0.75);
      ctx.lineTo(-size * 0.3, 0);
      ctx.lineTo(-size * 0.7, size * 0.75);
      ctx.closePath();
      ctx.fillStyle = '#ff2d55';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = e.isMainBoss ? '#ffe066' : 'rgba(255,224,102,0.6)';
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---------- main loop ----------
  function loop(ts){
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    dt = Math.min(dt, 0.05);

    if (gameState === 'playing') update(dt);
    else if (gameState === 'quiz') updateQuizTimer(dt);
    syncQuizTierNotice();
    updateJoystickVisibility();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- init ----------
  player = newPlayer();
  enemies = []; bullets = []; gems = []; heals = []; enemyBullets = [];
  gameState = 'title';
  setPauseButtonVisible(false);
  refreshEvents();
  // the period can start or end while the home screen sits open
  setInterval(() => { if (gameState === 'title' && refreshEvents()) renderHomeSelectors(); }, 30000);
  applyI18n();
  updateHud();
  if (!lsGet('vs_seen_howto', false)){
    lsSet('vs_seen_howto', true);
    openHowto();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
