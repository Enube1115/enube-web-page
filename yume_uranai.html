<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢占い ✦ 夢解読</title>
  <style>
    :root {
      --deep: #07071c;
      --mid:  #110d2c;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(180,150,255,0.18);
      --a1: #c8a8f0;   /* lavender */
      --a2: #80d4d0;   /* teal     */
      --a3: #f5d48a;   /* gold     */
      --a4: #f0a0c8;   /* rose     */
      --text:  #e8e0ff;
      --muted: #7870a8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      min-height:100vh;
      background: radial-gradient(ellipse at 25% 10%, #1a0e38 0%, #07071c 55%, #0a1224 100%);
      font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',Georgia,serif;
      color:var(--text);
      overflow-x:hidden;
    }

    /* ── CANVAS ── */
    #cv { position:fixed; inset:0; pointer-events:none; z-index:0; }

    /* ── AURORA ── */
    .aurora { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .aurora::before {
      content:''; position:absolute;
      width:70%; height:55%;
      background:radial-gradient(ellipse,rgba(120,60,220,.14) 0%,transparent 70%);
      top:-15%; left:15%;
      animation:aura 14s ease-in-out infinite alternate;
    }
    .aurora::after {
      content:''; position:absolute;
      width:55%; height:45%;
      background:radial-gradient(ellipse,rgba(30,110,190,.11) 0%,transparent 70%);
      bottom:-5%; right:8%;
      animation:aura 18s ease-in-out infinite alternate-reverse;
    }
    @keyframes aura {
      from { transform:translate(0,0) scale(1); }
      to   { transform:translate(4%,7%) scale(1.12); }
    }

    /* ── LAYOUT ── */
    .wrap {
      position:relative; z-index:1;
      max-width:740px; margin:0 auto;
      padding:0 18px 120px;
    }

    /* ── HEADER ── */
    .hd {
      text-align:center;
      padding:50px 0 28px;
    }
    .moon {
      font-size:3.6rem; display:block; margin-bottom:10px;
      animation:mpulse 4s ease-in-out infinite;
      filter:drop-shadow(0 0 18px rgba(245,212,140,.6));
    }
    @keyframes mpulse {
      0%,100%{ transform:scale(1);     filter:drop-shadow(0 0 14px rgba(245,212,140,.5)); }
      50%    { transform:scale(1.07);  filter:drop-shadow(0 0 30px rgba(245,212,140,.85)); }
    }
    .hd h1 {
      font-size:2.5rem; font-weight:700; letter-spacing:.22em;
      background:linear-gradient(130deg,#f5d48a 0%,#c8a8f0 50%,#80d4d0 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:10px;
    }
    .hd p { color:var(--muted); font-size:.88rem; line-height:1.9; letter-spacing:.08em; }
    .deco  { display:flex; justify-content:center; gap:10px; margin:14px 0; font-size:1rem; opacity:.5; }

    /* ── INFO BOX ── */
    .info {
      background:rgba(200,168,240,.05);
      border:1px solid rgba(200,168,240,.16);
      border-radius:16px; padding:16px 20px;
      margin-bottom:26px;
      font-size:.86rem; color:var(--muted); line-height:1.85;
      text-align:center;
    }
    .info b { color:var(--a1); }

    /* ── TABS ── */
    .tabs-wrap {
      position:sticky; top:0; z-index:20;
      background:linear-gradient(to bottom,rgba(7,7,28,.95) 80%,transparent);
      padding:12px 0 8px;
    }
    .tabs {
      display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    }
    .tab {
      padding:6px 15px; border-radius:20px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--muted); font-size:.8rem; cursor:pointer;
      transition:all .2s; font-family:inherit; white-space:nowrap;
    }
    .tab:hover  { border-color:var(--a1); color:var(--a1); }
    .tab.on {
      background:rgba(200,168,240,.16);
      border-color:var(--a1); color:var(--a1);
      box-shadow:0 0 10px rgba(200,168,240,.22);
    }

    /* ── KEYWORD SECTIONS ── */
    .ks { display:none; padding-top:4px; }
    .ks.on { display:block; }
    .kg { display:flex; flex-wrap:wrap; gap:9px; padding:10px 0 6px; }

    .kw {
      display:flex; align-items:center; gap:5px;
      padding:7px 15px; border-radius:30px;
      border:1px solid rgba(180,150,255,.18);
      background:rgba(255,255,255,.04);
      color:#b8b0d8; font-size:.88rem; cursor:pointer;
      user-select:none; transition:all .22s;
      font-family:inherit;
    }
    .kw:hover { border-color:rgba(200,168,240,.48); color:var(--a1); box-shadow:0 0 10px rgba(200,168,240,.18); }
    .kw.on {
      background:rgba(200,168,240,.17);
      border-color:var(--a1); color:var(--a1);
      box-shadow:0 0 14px rgba(200,168,240,.32);
      animation:kpop .25s ease;
    }
    @keyframes kpop {
      0%  { transform:scale(.94); }
      60% { transform:scale(1.08); }
      100%{ transform:scale(1); }
    }

    /* ── BOTTOM BAR ── */
    .bar {
      position:fixed; bottom:0; left:0; right:0; z-index:50;
      padding:12px 18px;
      background:rgba(7,7,28,.94);
      backdrop-filter:blur(22px);
      border-top:1px solid rgba(200,168,240,.18);
      display:flex; align-items:center; gap:12px;
    }
    .bar-chips {
      flex:1; display:flex; gap:6px; flex-wrap:wrap; min-height:28px;
    }
    .schip {
      background:rgba(200,168,240,.13);
      border:1px solid rgba(200,168,240,.32);
      border-radius:20px; padding:3px 10px;
      font-size:.77rem; color:var(--a1);
      display:flex; align-items:center; gap:4px;
    }
    .schip .x { cursor:pointer; opacity:.55; font-size:.72rem; transition:opacity .15s; }
    .schip .x:hover { opacity:1; }
    .bar-empty { color:var(--muted); font-size:.82rem; font-family:inherit; }
    .bar-count {
      font-size:.78rem; color:var(--muted); white-space:nowrap; align-self:center;
    }

    .go-btn {
      position:relative; overflow:hidden;
      padding:11px 22px; border:none; border-radius:30px;
      background:linear-gradient(135deg,#7c3aed,#5b21b6);
      color:#f0ecff; font-size:.92rem; font-weight:700;
      cursor:pointer; white-space:nowrap;
      box-shadow:0 4px 20px rgba(124,58,237,.5);
      transition:transform .18s,box-shadow .18s;
      font-family:inherit;
    }
    .go-btn::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
      transform:translateX(-120%); transition:transform .5s;
    }
    .go-btn:hover::after { transform:translateX(120%); }
    .go-btn:hover { transform:translateY(-2px); box-shadow:0 6px 26px rgba(124,58,237,.7); }
    .go-btn:disabled { opacity:.4; cursor:default; transform:none; }

    /* ── RESULT PANEL ── */
    .rp { display:none; margin-top:34px; }
    .rp.on { display:block; animation:rfade .65s ease both; }
    @keyframes rfade {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .rh { text-align:center; margin-bottom:24px; }
    .rh-icon { font-size:2.8rem; display:block; margin-bottom:10px; animation:mpulse 3s ease-in-out infinite; }
    .rh h2 {
      font-size:1.7rem; letter-spacing:.15em;
      background:linear-gradient(130deg,#f5d48a,#c8a8f0);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:6px;
    }
    .rh-sub { font-size:.8rem; color:var(--muted); letter-spacing:.12em; }

    .rc {
      background:rgba(200,168,240,.055);
      border:1px solid rgba(200,168,240,.18);
      border-radius:20px; padding:22px 24px;
      margin-bottom:14px; position:relative; overflow:hidden;
    }
    .rc::before {
      content:''; position:absolute; top:-40%; right:-15%;
      width:55%; height:110%;
      background:radial-gradient(circle,rgba(200,168,240,.07) 0%,transparent 65%);
      pointer-events:none;
    }
    .rc-title {
      font-size:.95rem; color:var(--a1); letter-spacing:.1em;
      margin-bottom:14px; display:flex; align-items:center; gap:8px;
    }
    .rc p { font-size:.94rem; line-height:2.0; color:#ccc8e8; white-space:pre-line; }

    .kri { display:flex; flex-direction:column; gap:12px; }
    .kri-item {
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.07);
      border-radius:14px; padding:16px 18px;
    }
    .kri-label { font-size:.98rem; color:var(--a3); margin-bottom:7px; display:flex; align-items:center; gap:6px; }
    .kri-body  { font-size:.86rem; color:#b0a8cc; line-height:1.9; }

    .lucky-row { display:flex; gap:12px; flex-wrap:wrap; }
    .lucky-item {
      flex:1; min-width:100px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.09);
      border-radius:14px; padding:14px 12px; text-align:center;
    }
    .ll  { font-size:.74rem; color:var(--muted); letter-spacing:.1em; margin-bottom:8px; }
    .lv  { font-size:1.05rem; font-weight:700; }
    .ldot {
      width:22px; height:22px; border-radius:50%;
      margin:0 auto 6px;
    }

    .reset-btn {
      display:block; margin:22px auto 0;
      padding:11px 32px; border-radius:30px;
      border:1px solid rgba(200,168,240,.28);
      background:transparent; color:var(--muted);
      font-size:.9rem; cursor:pointer; transition:all .2s;
      font-family:inherit;
    }
    .reset-btn:hover { border-color:var(--a1); color:var(--a1); }

    /* ── SCROLL ── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(200,168,240,.28); border-radius:2px; }

    @media(max-width:500px){
      .hd h1  { font-size:1.85rem; }
      .rc     { padding:18px 16px; }
      .go-btn { padding:10px 16px; font-size:.86rem; }
    }
  </style>
</head>
<body>

<canvas id="cv"></canvas>
<div class="aurora"></div>

<div class="wrap">

  <header class="hd">
    <span class="moon">🌙</span>
    <h1>夢 占 い</h1>
    <div class="deco">✦ ✧ ✦ ✧ ✦</div>
    <p>夢の中に登場したものを選んでください<br>潜在意識からの深いメッセージを解き明かします</p>
  </header>

  <div class="info">
    夢に現れたキーワードを <b>1〜5個</b> 選んで「🔮 夢を解読する」を押してください。<br>
    複数選択すると、その組み合わせからより深い読み解きをお届けします。
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs">
      <button class="tab on" data-c="nature">🌿 自然</button>
      <button class="tab" data-c="animal">🦋 動物</button>
      <button class="tab" data-c="person">👤 人物</button>
      <button class="tab" data-c="place">🏛 場所</button>
      <button class="tab" data-c="action">⚡ 状況</button>
      <button class="tab" data-c="object">🔑 物</button>
      <button class="tab" data-c="light">✨ 光・色</button>
    </div>
  </div>

  <div class="ks on" id="s-nature"><div class="kg" id="g-nature"></div></div>
  <div class="ks"    id="s-animal"><div class="kg" id="g-animal"></div></div>
  <div class="ks"    id="s-person"><div class="kg" id="g-person"></div></div>
  <div class="ks"    id="s-place" ><div class="kg" id="g-place"></div></div>
  <div class="ks"    id="s-action"><div class="kg" id="g-action"></div></div>
  <div class="ks"    id="s-object"><div class="kg" id="g-object"></div></div>
  <div class="ks"    id="s-light" ><div class="kg" id="g-light"></div></div>

  <div class="rp" id="rp"></div>

</div>

<div class="bar">
  <div class="bar-chips" id="chips">
    <span class="bar-empty" id="be">キーワードを選んでください</span>
  </div>
  <span class="bar-count" id="cnt"></span>
  <button class="go-btn" id="gobtn" onclick="fortune()" disabled>🔮 夢を解読する</button>
</div>

<script>
/* =============================================================
   KEYWORD DATA  (74 keywords across 7 categories)
   ============================================================= */
const KW = {
  nature:[
    {id:'sea',    i:'🌊',l:'海',    t:['emotion','deep','vast','unconscious'],
     m:'海は深層心理・感情の広大な世界を象徴します。穏やかな海なら内なる平和、荒れた海は感情の混乱や変化のサイン。大きなチャンスや新しい段階への移行を告げることもあります。'},
    {id:'mtn',    i:'⛰️',l:'山',    t:['goal','challenge','rise'],
     m:'山は目標、試練、乗り越えるべき課題を象徴します。登っているなら着実な前進の証。頂上に立てれば大きな成功の予兆、山を眺めるだけなら目標を意識し始めているサインです。'},
    {id:'forest', i:'🌲',l:'森',    t:['mystery','unconscious','explore'],
     m:'森は潜在意識の深み・神秘・内なる探求を表します。迷い込む夢は自己探求の始まり。森を抜けた先に光があれば困難の先にある希望を示し、深い自己発見の旅に出ていることを告げます。'},
    {id:'sky',    i:'🌤️',l:'空',    t:['freedom','hope','vast'],
     m:'空は自由、可能性、精神の解放を象徴します。澄んだ青空は希望と明るい未来、曇り空は不安や迷いを示します。空を飛ぶなら更に大きな解放感のサインです。'},
    {id:'star',   i:'⭐',l:'星',    t:['wish','hope','guide'],
     m:'星は願望・希望・人生の指針を表します。輝く星は夢や目標が実現に近づいているサイン。流れ星は一瞬のチャンスを逃さないよう促しています。複数の星は多様な可能性の象徴です。'},
    {id:'moon',   i:'🌙',l:'月',    t:['intuition','cycle','unconscious','feminine'],
     m:'月は直感、潜在意識、変化のサイクルを象徴します。満月は達成・完成、新月は新しい始まりを示します。月明かりはあなたの心の奥にある真実を優しく照らし出しています。'},
    {id:'sun',    i:'☀️',l:'太陽',  t:['energy','life','consciousness','positive'],
     m:'太陽は生命力・エネルギー・意識を象徴します。太陽が輝く夢は活力と自信の高まり、日の出は再生や新しい始まりのサイン。人生における輝かしい転換期が訪れることを告げています。'},
    {id:'rain',   i:'🌧️',l:'雨',    t:['cleanse','emotion','renewal'],
     m:'雨は感情の浄化と再生を象徴します。悲しいイメージを持たれがちですが、雨は心の重荷を洗い流す吉兆のサイン。嵐の後に晴れ間が来るように、試練の後には必ず希望が訪れます。'},
    {id:'snow',   i:'❄️',l:'雪',    t:['pure','quiet','new'],
     m:'雪は純粋さ、静けさ、新しい白紙の状態を象徴します。雪が降る夢は新たな始まりや清らかな気持ちの訪れを示します。ただし凍えるような冷たさは感情の凍結を表すことも。'},
    {id:'river',  i:'🏞️',l:'川',    t:['flow','time','emotion'],
     m:'川は時の流れと感情の流動を象徴します。清らかな川は順調な人生の流れ、濁った川は停滞や障害を示します。川を渡る夢は人生の転換点に立っているサインです。'},
    {id:'flower', i:'🌸',l:'花',    t:['beauty','love','growth','positive'],
     m:'花は美しさ、愛情、成長を象徴します。花が咲く夢は人間関係の開花や恋愛の発展を示します。特に桜は一期一会の美しさ、白い花は純粋な愛情・感謝を表します。'},
    {id:'fire',   i:'🔥',l:'火',    t:['passion','transform','energy'],
     m:'火は情熱・変革・破壊と再生を象徴します。小さな炎は情熱や創造力の高まり、大きな炎は劇的な変化のサイン。制御された火は強いエネルギーを建設的に使えている証です。'},
    {id:'cloud',  i:'☁️',l:'雲',    t:['uncertain','dream','vague'],
     m:'雲は不確かさや幻想的な可能性を象徴します。白い雲は穏やかな希望、黒雲は困難の訪れを示します。雲の切れ間から光が差すなら、問題解決が近い予兆です。'},
    {id:'wind',   i:'🌬️',l:'風',    t:['change','message','spirit'],
     m:'風は変化、精神的なメッセージ、目に見えない力を象徴します。爽やかな風は新鮮な変化や吉報の予兆。嵐のような強風は激しい変化が迫っていることを告げています。'},
  ],
  animal:[
    {id:'dog',   i:'🐕',l:'犬',      t:['loyalty','friendship','trust'],
     m:'犬は忠誠心・友情・信頼を象徴します。犬が懐く夢は信頼できる友人や協力者の存在を示します。吠える犬は誰かへの警戒心の表れ。全般的に友人関係の吉兆サインです。'},
    {id:'cat',   i:'🐈',l:'猫',      t:['intuition','independence','mystery','feminine'],
     m:'猫は直感・独立心・神秘を象徴します。猫が懐く夢は直感力の高まりと女性性の開花。黒猫は神秘的なメッセージ、白猫は純粋な幸運の訪れを示します。'},
    {id:'bird',  i:'🐦',l:'鳥',      t:['freedom','hope','spirit','message'],
     m:'鳥は自由・精神の飛翔・吉報を象徴します。高く舞う鳥は志の高まりと解放を示し、鳥の歌声は喜びのメッセージ。巣に戻る鳥は安心の場所への帰還を表します。'},
    {id:'snake', i:'🐍',l:'蛇',      t:['transform','wisdom','heal','warning'],
     m:'蛇は変容・智慧・治癒を象徴します。脱皮する蛇は大きな変容と再生のサイン。白蛇は特に強力な幸運と守護の象徴です。攻撃的な蛇は直面すべき課題への警告です。'},
    {id:'horse', i:'🐎',l:'馬',      t:['power','freedom','journey','progress'],
     m:'馬は力・自由・前進を象徴します。颯爽と駆ける馬は人生の加速と新たな段階への移行を示します。白馬は高貴な目標の実現を示し、騎乗は物事をコントロールできている証です。'},
    {id:'dragon',i:'🐉',l:'龍',      t:['power','fortune','divine','transform'],
     m:'龍は日本において強大な力・守護・幸運の象徴です。龍が空を舞う夢は最高の運気の到来を示します。天に昇る龍は栄誉と成功の予兆であり、夢占いでも最上級の吉兆とされます。'},
    {id:'btfly', i:'🦋',l:'蝶',      t:['transform','beauty','renewal','soul'],
     m:'蝶は変容・再生・魂の解放を象徴します。蝶になる夢は美しい変化と新たな自分への脱皮。様々な色の蝶が舞う夢は喜びと自由の訪れ。白い蝶は故人からのメッセージとも言われます。'},
    {id:'fish',  i:'🐟',l:'魚',      t:['abundance','unconscious','fertility'],
     m:'魚は豊かさ・潜在意識・生命力を象徴します。大漁の夢は大きな幸運や収穫のサイン。美しい魚が泳ぐ夢は感情の豊かさと精神的な充実を示します。金魚は願望成就の吉兆です。'},
    {id:'tiger', i:'🐯',l:'虎',      t:['strength','instinct','ambition','power'],
     m:'虎は強さ・本能・野心を象徴します。虎と友好的な夢は自分の強さを認識し力強く前進できるサイン。虎に追われる夢は抑圧された感情や本能と向き合うよう告げています。'},
    {id:'spider',i:'🕷️',l:'クモ',    t:['fate','create','weave'],
     m:'クモは運命・創造・網の織り手を象徴します。巣を張る夢は計画や人間関係の構築のサイン。クモの巣に捕まる夢は複雑な状況への注意を促しています。'},
    {id:'wolf',  i:'🐺',l:'狼',      t:['instinct','wild','pack'],

/* =============================================================
   STATE
   ============================================================= */
let sel = new Set();

/* =============================================================
   INIT
   ============================================================= */
function initKW() {
  Object.entries(KW).forEach(([cat, items]) => {
    const g = document.getElementById('g-' + cat);
    items.forEach(kw => {
      const b = document.createElement('button');
      b.className = 'kw';
      b.dataset.id = kw.id;
      b.innerHTML = `<span>${kw.i}</span>${kw.l}`;
      b.onclick = () => toggle(kw.id, b);
      g.appendChild(b);
    });
  });
}

function findKW(id) {
  for (const items of Object.values(KW)) {
    const f = items.find(k => k.id === id);
    if (f) return f;
  }
  return null;
}

/* =============================================================
   TOGGLE
   ============================================================= */
function toggle(id, btn) {
  if (sel.has(id)) {
    sel.delete(id);
    btn.classList.remove('on');
  } else {
    if (sel.size >= 5) return;
    sel.add(id);
    btn.classList.add('on');
  }
  updateBar();
}

/* =============================================================
   BAR
   ============================================================= */
function updateBar() {
  const chips = document.getElementById('chips');
  const be    = document.getElementById('be');
  const cnt   = document.getElementById('cnt');
  const gbtn  = document.getElementById('gobtn');

  chips.querySelectorAll('.schip').forEach(e => e.remove());
  if (sel.size === 0) {
    be.style.display = '';
    cnt.textContent  = '';
    gbtn.disabled = true;
  } else {
    be.style.display = 'none';
    cnt.textContent  = `${sel.size}/5`;
    gbtn.disabled = false;
    sel.forEach(id => {
      const kw = findKW(id);
      if (!kw) return;
      const c = document.createElement('div');
      c.className = 'schip';
      c.innerHTML = `${kw.i} ${kw.l} <span class="x" onclick="remove_('${id}')">✕</span>`;
      chips.appendChild(c);
    });
  }
}

function remove_(id) {
  sel.delete(id);
  document.querySelectorAll(`.kw[data-id="${id}"]`).forEach(b => b.classList.remove('on'));
  updateBar();
}

/* =============================================================
   TABS
   ============================================================= */
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  const c = btn.dataset.c;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.ks').forEach(s => s.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('s-' + c).classList.add('on');
});

/* =============================================================
   FORTUNE
   ============================================================= */
function fortune() {
  if (!sel.size) return;

  for (const c of COMBOS) {

/* =============================================================
   RESET
   ============================================================= */
function resetAll() {
  sel.clear();
  document.querySelectorAll('.kw').forEach(b => b.classList.remove('on'));
  updateBar();
  const p = document.getElementById('rp');
  p.classList.remove('on');
  p.innerHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =============================================================
   CANVAS — dreamscape (stars + drifting orbs)
   ============================================================= */
(function() {
  const cv = document.getElementById('cv');
  const cx = cv.getContext('2d');
  let W, H, stars = [], orbs = [];

  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }

  function init() {
    stars = Array.from({length:240}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4+.2,
      a: Math.random()*.65+.08,
      tw: Math.random()*Math.PI*2,
      sp: Math.random()*.014+.005,
      warm: Math.random() > .75,
    }));
    orbs = Array.from({length:7}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*130+55,
      dx:(Math.random()-.5)*.28, dy:(Math.random()-.5)*.18,
      hue:[260,200,280,310,30,190][Math.floor(Math.random()*6)],
      a: Math.random()*.055+.018,
    }));
  }

  function frame() {
    cx.clearRect(0,0,W,H);

    // Orbs
    orbs.forEach(o => {
      const g = cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0, `hsla(${o.hue},70%,65%,${o.a})`);
      g.addColorStop(1, 'transparent');
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(o.x,o.y,o.r,0,Math.PI*2); cx.fill();
      o.x += o.dx; o.y += o.dy;
      if (o.x < -o.r) o.x = W+o.r; if (o.x > W+o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = H+o.r; if (o.y > H+o.r) o.y = -o.r;
    });

    // Stars
    stars.forEach(s => {
      s.tw += s.sp;
      const a = s.a * (.58+.42*Math.sin(s.tw));
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2);
      cx.fillStyle = s.warm
        ? `rgba(255,230,155,${a})`
        : `rgba(185,165,255,${a})`;
      cx.fill();
    });

    requestAnimationFrame(frame);
  }

  resize(); init(); frame();
  window.addEventListener('resize', () => { resize(); init(); });
})();

/* =============================================================

initKW();
