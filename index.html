<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enube Arcade — 無料で遊べるゲーム・診断・ツール</title>
<meta name="description" content="ブラウザですぐ遊べるゲーム・クイズ・診断・便利ツールが60本以上。登録不要・無料。">
<meta property="og:title" content="Enube Arcade">
<meta property="og:description" content="ブラウザですぐ遊べるゲーム・クイズ・診断・ツールが60本以上。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --surface:#fff; --ink:#151515; --sub:#626260; --mute:#a2a29e;
  --line:#e7e6e1; --accent:#ff5a36; --chip:#ecebe6; --radius:16px; --max:1200px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e10; --surface:#18181b; --ink:#f3f3f0; --sub:#a9a9a5; --mute:#6d6d6a;
    --line:#2a2a2e; --accent:#ff7a5c; --chip:#222226;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e10; --surface:#18181b; --ink:#f3f3f0; --sub:#a9a9a5; --mute:#6d6d6a;
  --line:#2a2a2e; --accent:#ff7a5c; --chip:#222226;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans JP",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
@media (max-width:600px){.wrap{padding:0 16px}}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{height:64px;display:flex;align-items:center;gap:16px}
.logo{font-weight:900;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.logo i{font-style:normal;color:var(--accent)}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 40px;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
.theme-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}

/* hero */
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:36px}}
.hero h1{font-size:clamp(32px,5.5vw,56px);font-weight:900;line-height:1.2;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--sub);margin:16px 0 28px;font-size:16px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:50px;padding:0 24px;border-radius:999px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn-main{background:var(--ink);color:var(--bg)}
.btn-main:hover{transform:translateY(-1px)}
.btn-sub{border:1px solid var(--line);background:var(--surface)}
.btn-sub:hover{border-color:var(--ink)}
.hero-art{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hero-art span{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:clamp(22px,3.4vw,34px);transition:.3s}
.hero-art span:hover{transform:rotate(-6deg) scale(1.06)}
@media (max-width:860px){.hero-art{display:none}}

/* sections */
.sec{padding:28px 0}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sec-title h2{font-size:20px;font-weight:800}
.sec-title small{color:var(--mute);font-size:13px}

/* featured */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.feat{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.feat{grid-template-columns:1fr}}
.fcard{border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);transition:.2s;display:block}
.fcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.08)}
.fcard .art{aspect-ratio:16/9;display:grid;place-items:center;font-size:64px;position:relative}
.fcard .art b{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;letter-spacing:.08em;background:rgba(0,0,0,.55);color:#fff;padding:4px 9px;border-radius:999px}
.fcard .txt{padding:16px 18px 18px}
.fcard h3{font-size:16px;font-weight:800}
.fcard p{font-size:13.5px;color:var(--sub);margin-top:4px}

/* recent */
.recent{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rchip{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-size:14px;font-weight:600}
.rchip span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{height:38px;padding:0 16px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;color:var(--sub);transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
.tab sup{font-size:11px;opacity:.6;margin-left:4px;vertical-align:baseline}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .ic{aspect-ratio:1.4;border-radius:12px;display:grid;place-items:center;font-size:40px;position:relative}
.badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;background:var(--accent);color:#fff;padding:2px 7px;border-radius:999px}
.card h3{font-size:14.5px;font-weight:700;line-height:1.35}
.card p{font-size:12.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cat{font-size:11px;color:var(--mute);font-weight:600;margin-top:auto}
.empty{text-align:center;padding:60px 0;color:var(--sub)}
.empty b{display:block;font-size:40px;margin-bottom:8px}

footer{border-top:1px solid var(--line);margin-top:56px;padding:32px 0 48px;font-size:13px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a href="#" class="logo">Enube<i>Arcade</i></a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ゲームや診断を探す" aria-label="検索">
    </label>
    <button class="theme-btn" id="themeBtn" aria-label="テーマ切り替え">◐</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <div>
      <h1>すぐ遊べる、<br><em id="total">60</em>本のミニゲーム。</h1>
      <p>ゲーム・クイズ・診断・便利ツール。登録なし、無料、ブラウザだけで遊べます。</p>
      <div class="hero-btns">
        <button class="btn btn-main" id="randomBtn">🎲 ランダムで遊ぶ</button>
        <a href="#all" class="btn btn-sub">すべて見る</a>
      </div>
    </div>
    <div class="hero-art" id="heroArt"></div>
  </section>

  <section class="sec hidden" id="recentSec">
    <div class="sec-title"><h2>最近遊んだ</h2></div>
    <div class="recent" id="recent"></div>
  </section>

  <section class="sec" id="featSec">
    <div class="sec-title"><h2>おすすめ</h2><small>まずはこれから</small></div>
    <div class="feat" id="feat"></div>
  </section>

  <section class="sec" id="all">
    <div class="sec-title"><h2>すべての作品</h2><small id="count"></small></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
    <div class="empty hidden" id="empty"><b>🔍</b>見つかりませんでした。別のキーワードで試してみてください。</div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Enube Arcade · Made by えぬべえ with Claude Code</span>
    <span><a href="privacy.html">プライバシーポリシー</a> · <a href="terms.html">利用規約</a> · <a href="https://x.com/Enube_1115" target="_blank" rel="noopener">X @Enube_1115</a></span>
  </div>
</footer>

<script>
const CATS = {

// [file, emoji, name, desc, cat, isNew]
const APPS = [

  ["colorwordle","🎨","ColorWordle","毎日1つのカラーコードを当てる。","quiz"],

  ["country_quiz","🌍","国当てクイズ","国旗・首都・ヒントから80カ国以上を当てる。","quiz"],
  ["quick_quiz","🔔","早押しクイズ","素早く答えて高得点を狙おう。","quiz"],
  ["korean_quiz","🇰🇷","韓国語クイズ","ハングル・単語・フレーズを4択で学ぶ。","quiz"],
  ["hiragana_quiz","🈶","50音クイズ","ひらがな・カタカナ・ローマ字の4択。","quiz"],

  ["mbti_compatibility","🧩","MBTI相性診断","20問でタイプ特定、256パターンの相性分析。","shindan"],
  ["personality_quiz","🪞","性格タイプ診断","16タイプの性格診断と詳しい解説。","shindan"],
  ["enneagram","🔮","エニアグラム診断","20問で9タイプの性格を診断。","shindan"],
  ["career_diagnosis","🔭","将来職業診断","15問で向いている職業を22種から診断。","shindan"],
  ["love_language","💕","恋愛スタイル診断","5つの愛情言語を診断。カップル相性も。","shindan"],

  ["stress_resilience","🧘","ストレス耐性診断","15問で適応力を分析、改善アドバイス付き。","shindan"],
  ["psychology_test","🌸","心理テスト","自尊心・共感力・メンタル強度など4種類。","shindan"],

  ["koi_mikuji","🎋","恋みくじ","今日の恋愛運をおみくじで。","shindan"],
  ["yume_uranai","🌙","夢占い","夢に出てきたものから意味を占う。","shindan"],
  ["biorhythm","📈","バイオリズム診断","身体・感情・知性のリズムを確認。","shindan"],

  ["meal_planner_v2","🍱","AI献立プランナー v2","1週間分の献立を食材・予算まで考えて自動生成。","tool"],
  ["meal_planner","🥗","献立プランナー","今日の献立をランダム提案。","tool"],
  ["oshi_budget","💜","推し活 家計簿","推し活の出費をカテゴリ別に記録・可視化。","tool"],

  ["report-tracker","📋","レポート提出管理","通信制高校生向けの、提出期限と状態を管理するツール。","tool",1],
  ["pomodoro","🍅","Pomodoro Timer","25分集中×5分休憩のタイマー。","tool"],
  ["calendar","📅","カレンダー","予定を登録できるブラウザカレンダー。","tool"],
  ["book_tracker","📚","読書記録","読んだ本・読みたい本を管理。","tool"],
  ["health_tracker","💪","健康管理","体重・睡眠などをグラフで記録。","tool"],
  ["workout_planner","🏋️","ワークアウトプランナー","目標と部位から筋トレメニューを自動生成。","tool"],
  ["daily_challenge","🎯","今日のチャレンジ","毎日のミッションをクリアしよう。","tool"],
  ["travel_planner","✈️","ランダム旅行プランナー","次の旅行先をランダムで提案。","tool"],
  ["color_palette","🖌️","カラーパレット生成","配色理論からパレットを作ってHEXをコピー。","tool"],
  ["world_clock","🕰️","世界時計","主要都市の時刻とタイムゾーン変換。","tool"],
  ["calculator_app","🧾","電卓","キーボード操作対応のシンプル電卓。","tool"],
  ["quote_generator","💬","QUOTOPIA","偉人の名言をランダム表示。","tool"],
  ["quote_gacha","🎁","名言ガチャ","偉人の名言をガチャで引こう。","tool"],
  ["report-tracker","📋","レポート提出管理","提出期限と状態を管理するツール。","tool"],
  ["shinai-calculator","🧮","内申点計算ツール","通知表の評定から内申点の目安を計算するツール。","tool"],
].map(([file,emoji,name,desc,cat,isNew])=>({file,emoji,name,desc,cat,isNew:!!isNew,url:file+".html"}));

const FEATURED = ["vocab_survivor","game_engine","tetris","mbti_compatibility","prefecture_quiz","meal_planner_v2"];

const $ = s=>document.querySelector(s);
const dark = ()=>{
  const t=document.documentElement.dataset.theme;
  return t ? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};
const bg = cat => CATS[cat].color[dark()?1:0];
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let state = {cat:"all", q:""};

function remember(file){
  const r = store.get("recent",[]).filter(f=>f!==file);
  r.unshift(file); store.set("recent",r.slice(0,8));
}
function link(a, inner, cls){
  return `<a class="${cls}" href="${a.url}" data-file="${a.file}">${inner}</a>`;
}

function renderHero(){
  $("#total").textContent = APPS.length;
  const picks = ["🎮","🧟","🟦","🔮","🗾","🍱","🎰","♟️","🧩","🚢","🌙","🐍"];
  const cats = ["game","game","game","shindan","quiz","tool","game","game","shindan","game","shindan","game"];
  $("#heroArt").innerHTML = picks.map((e,i)=>`<span style="background:${bg(cats[i])}">${e}</span>`).join("");
}
function renderFeatured(){
  $("#feat").innerHTML = FEATURED.map(f=>APPS.find(a=>a.file===f)).map(a=>link(a,
    `<div class="art" style="background:${bg(a.cat)}"><b>${CATS[a.cat].name}</b>${a.emoji}</div>
     <div class="txt"><h3>${a.name}</h3><p>${a.desc}</p></div>`,"fcard")).join("");
}
function renderRecent(){
  const r = store.get("recent",[]).map(f=>APPS.find(a=>a.file===f)).filter(Boolean);
  $("#recentSec").classList.toggle("hidden", !r.length || !!state.q);
  $("#recent").innerHTML = r.map(a=>link(a,`<span style="background:${bg(a.cat)}">${a.emoji}</span>${a.name}`,"rchip")).join("");
}
function renderTabs(){
  const tabs = [["all","すべて",APPS.length], ...Object.entries(CATS).map(([k,v])=>[k,v.name,APPS.filter(a=>a.cat===k).length])];
  $("#tabs").innerHTML = tabs.map(([k,n,c])=>`<button class="tab ${state.cat===k?"on":""}" data-cat="${k}">${n}<sup>${c}</sup></button>`).join("");
}
function renderGrid(){
  const q = state.q.trim().toLowerCase();
  const list = APPS.filter(a=>(state.cat==="all"||a.cat===state.cat) &&
    (!q || (a.name+a.desc+CATS[a.cat].name).toLowerCase().includes(q)));
  $("#grid").innerHTML = list.map(a=>link(a,
    `<div class="ic" style="background:${bg(a.cat)}">${a.isNew?'<span class="badge">NEW</span>':""}${a.emoji}</div>
     <h3>${a.name}</h3><p>${a.desc}</p><span class="cat">${CATS[a.cat].name}</span>`,"card")).join("");
  $("#count").textContent = list.length+"件";
  $("#empty").classList.toggle("hidden", list.length>0);
  const searching = !!q;
  $("#hero").classList.toggle("hidden", searching);
  $("#featSec").classList.toggle("hidden", searching);
}
function renderAll(){renderHero();renderFeatured();renderRecent();renderTabs();renderGrid();}

document.addEventListener("click",e=>{
  const a = e.target.closest("a[data-file]"); if(a) remember(a.dataset.file);
  const t = e.target.closest(".tab"); if(t){state.cat=t.dataset.cat;renderTabs();renderGrid();}
});
$("#q").addEventListener("input",e=>{
  state.q=e.target.value; renderGrid(); renderRecent();
  if(state.q) $("#all").scrollIntoView({block:"start"});
});
$("#randomBtn").addEventListener("click",()=>{
  const a = APPS[Math.floor(Math.random()*APPS.length)];
  remember(a.file); location.href=a.url;
});
$("#themeBtn").addEventListener("click",()=>{
  const next = dark()?"light":"dark";
  document.documentElement.dataset.theme=next; store.set("theme",next); renderAll();
});
const saved = store.get("theme",null); if(saved) document.documentElement.dataset.theme=saved;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",renderAll);
renderAll();
</script>
</body>
</html>
