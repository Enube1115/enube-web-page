<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔭 将来職業診断</title>
<style>
:root{
  --bg:#07090f;--surf:#0e1220;--surf2:#151c2e;--surf3:#1c2540;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.13);
  --text:#eceff8;--muted:#6472a0;--muted2:#8494c0;
  --p:#7c6ffc;--p2:#e963c8;--p3:#38c9f5;--gold:#f6a623;--green:#22d3a0;--red:#f66;
  --glow:rgba(124,111,252,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* BG */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.16;animation:float 16s ease-in-out infinite}
.o1{width:700px;height:700px;background:radial-gradient(#7c6ffc,transparent 70%);top:-200px;left:-150px}
.o2{width:550px;height:550px;background:radial-gradient(#e963c8,transparent 70%);bottom:-150px;right:-100px;animation-delay:-6s}
.o3{width:450px;height:450px;background:radial-gradient(#38c9f5,transparent 70%);top:35%;left:50%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(25px,-35px) scale(1.04)}66%{transform:translate(-20px,18px) scale(.97)}}

/* LAYOUT */
.wrap{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:20px 18px}
.screen{display:none}
.screen.active{display:block;animation:up .45s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ── WELCOME ── */
.w-hero{
  background:linear-gradient(145deg,var(--surf),var(--surf2));
  border:1px solid var(--border2);border-radius:28px;
  padding:60px 36px 48px;text-align:center;margin-top:36px;
  position:relative;overflow:hidden;
}
.w-hero::before{
  content:'';position:absolute;inset:0;
  background:conic-gradient(from 0deg at 50% 0%,rgba(124,111,252,.04),rgba(233,99,200,.04),rgba(56,201,245,.04),transparent 60%);
  pointer-events:none;
}
.w-glyph{font-size:5rem;display:block;margin-bottom:14px;line-height:1;animation:glyph 4s ease-in-out infinite}
@keyframes glyph{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.w-title{
  font-size:2.4rem;font-weight:900;letter-spacing:-.04em;margin-bottom:12px;
  background:linear-gradient(130deg,#b0b8ff 0%,#f0a8fa 50%,#7ee8ff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.w-sub{color:var(--muted2);font-size:1rem;line-height:1.75;max-width:420px;margin:0 auto 30px}
.w-chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:38px}
.w-chip{
  background:var(--surf3);border:1px solid var(--border2);
  border-radius:50px;padding:7px 18px;font-size:.82rem;color:var(--muted2);
  display:inline-flex;align-items:center;gap:7px;
}
.w-chip b{color:var(--p3)}
.btn-start{
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;border:none;border-radius:15px;padding:18px 58px;
  font-size:1.1rem;font-weight:800;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 8px 36px rgba(124,111,252,.45);
  transition:transform .2s,box-shadow .2s;
}
.btn-start:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 48px rgba(124,111,252,.55)}

/* ── PROGRESS HEADER ── */
.prog-hd{
  display:flex;align-items:center;gap:14px;
  padding:18px 0 14px;
}
.prog-info{font-size:.82rem;color:var(--muted);font-weight:600;flex-shrink:0;min-width:56px}
.prog-info b{color:var(--p3)}
.prog-track{flex:1;height:6px;background:var(--surf2);border-radius:10px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:10px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── QUESTION CARD ── */
.q-wrap{
  background:linear-gradient(150deg,var(--surf),var(--surf2));
  border:1px solid var(--border2);border-radius:22px;
  padding:34px 30px 26px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.q-wrap::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--p),var(--p2),var(--p3));
}
.q-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(124,111,252,.1);border:1px solid rgba(124,111,252,.22);
  color:#b0b8ff;border-radius:50px;padding:4px 14px;
  font-size:.76rem;font-weight:700;letter-spacing:.04em;margin-bottom:16px;
}
.q-text{font-size:1.28rem;font-weight:700;line-height:1.5;color:var(--text)}
.q-hint{font-size:.84rem;color:var(--muted);margin-top:6px}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  background:var(--surf2);border:1.5px solid var(--border);
  border-radius:14px;padding:15px 18px;cursor:pointer;
  font-size:.96rem;color:var(--text);text-align:left;
  display:flex;align-items:center;gap:14px;
  transition:all .18s;position:relative;overflow:hidden;
}
.opt::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(124,111,252,.07),transparent 60%);
  opacity:0;transition:opacity .18s;pointer-events:none;
}
.opt:hover::before{opacity:1}
.opt:hover{border-color:rgba(124,111,252,.4);transform:translateX(4px);background:rgba(124,111,252,.07)}
.opt:active{transform:scale(.99)}
.opt.chosen{
  border-color:var(--p);background:rgba(124,111,252,.14);
  animation:bounce .25s ease;
}
@keyframes bounce{0%{transform:scale(.98)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.opt-em{font-size:1.45rem;width:36px;text-align:center;flex-shrink:0}
.opt-label{line-height:1.4}

/* ── LOADING ── */
.ld-center{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:68vh;gap:22px;text-align:center;
}
.ld-ring{
  width:76px;height:76px;border-radius:50%;
  border:3px solid transparent;
  border-top-color:var(--p);
  border-right-color:var(--p3);
  animation:spin 1s linear infinite;
  position:relative;
}
.ld-ring::after{
  content:'🔭';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;animation:spin 1s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-title{font-size:1.15rem;font-weight:700;color:var(--text)}
.ld-track{width:280px;height:7px;background:var(--surf2);border-radius:10px;overflow:hidden}
.ld-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--p2),var(--p3));width:0;border-radius:10px;transition:width .05s}
.ld-steps{width:280px;display:flex;flex-direction:column;gap:9px}
.ld-step{
  display:flex;align-items:center;gap:10px;
  font-size:.85rem;color:var(--muted);opacity:0;
  transition:opacity .4s,color .4s;
}
.ld-step.on{opacity:1;color:var(--muted2)}
.ld-step.done{color:var(--green)}
.ld-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .4s}
.ld-step.on .ld-dot{background:var(--p3)}
.ld-step.done .ld-dot{background:var(--green)}

/* ── RESULT ── */
/* Hero */
.r-hero{
  background:linear-gradient(150deg,var(--surf),var(--surf2));
  border:1px solid var(--border2);border-radius:26px;
  padding:38px 30px 30px;margin-bottom:16px;
  position:relative;overflow:hidden;text-align:center;
}
.r-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(124,111,252,.12),transparent 65%);
  pointer-events:none;
}
.r-crown{
  display:inline-block;
  background:linear-gradient(135deg,var(--gold),#fa7c1b);
  color:#fff;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 18px;border-radius:50px;margin-bottom:14px;
}
.r-icon{font-size:5.5rem;display:block;line-height:1;margin-bottom:8px;animation:r-float 4s ease-in-out infinite}
@keyframes r-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.r-name{
  font-size:2.5rem;font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(130deg,#c4caff,#f5b0fa,#90e8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:10px;
}
.r-tagline{color:var(--muted2);font-size:.96rem;line-height:1.7;max-width:500px;margin:0 auto 22px}
.r-salary{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(246,166,35,.1);border:1px solid rgba(246,166,35,.28);
  color:var(--gold);border-radius:14px;padding:11px 24px;
  font-size:1.15rem;font-weight:800;margin-bottom:26px;
}

/* Radar */
.radar-box{display:flex;justify-content:center;margin:4px 0 18px}
.radar-box canvas{max-width:300px;width:100%}

/* Trait bars */
.tbars{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
.tbar{}
.tbar-head{
  font-size:.74rem;color:var(--muted);margin-bottom:4px;
  display:flex;justify-content:space-between;
}
.tbar-track{height:6px;background:var(--surf3);border-radius:3px;overflow:hidden}
.tbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--p),var(--p3));transition:width 1.2s cubic-bezier(.22,1,.36,1)}

/* Info row */
.info-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.info-card{
  background:var(--surf);border:1px solid var(--border);
  border-radius:18px;padding:22px;
}
.info-card.full{grid-column:1/-1}
.ic-head{
  font-size:.73rem;color:var(--muted);font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:13px;display:flex;align-items:center;gap:7px;
}
.ic-text{font-size:.9rem;color:var(--text);line-height:1.8}
.tag-s{
  display:inline-block;
  background:rgba(124,111,252,.1);border:1px solid rgba(124,111,252,.22);
  color:#b8bcff;border-radius:7px;padding:4px 11px;
  font-size:.78rem;font-weight:600;margin:3px 3px 3px 0;
}
.tag-p{
  display:inline-block;
  background:rgba(233,99,200,.1);border:1px solid rgba(233,99,200,.22);
  color:#f5b0e8;border-radius:7px;padding:4px 11px;
  font-size:.78rem;font-weight:600;margin:3px 3px 3px 0;
}

/* Match score */
.match-score{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(34,211,160,.08);border:1px solid rgba(34,211,160,.2);
  color:var(--green);border-radius:8px;padding:3px 12px;font-size:.8rem;font-weight:700;
  margin-bottom:8px;
}

/* Alternatives */
.alt-head{font-size:.88rem;font-weight:700;color:var(--muted2);margin-bottom:13px;padding-left:2px}
.alt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}
.alt-card{
  background:var(--surf);border:1px solid var(--border);
  border-radius:16px;padding:18px 12px;text-align:center;
  cursor:pointer;transition:all .2s;
}
.alt-card:hover{border-color:var(--border2);transform:translateY(-4px);background:var(--surf2);box-shadow:0 12px 32px rgba(0,0,0,.3)}
.alt-em{font-size:2rem;margin-bottom:7px}
.alt-name{font-size:.8rem;font-weight:700;line-height:1.3;color:var(--text);margin-bottom:5px}
.alt-pct{font-size:.72rem;font-weight:700;color:var(--p3)}
.alt-salary{font-size:.7rem;color:var(--muted);margin-top:3px}

/* Modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(6px);
  animation:fadeIn .2s ease;
}
.modal-bg.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surf2);border:1px solid var(--border2);
  border-radius:22px;padding:32px 28px;max-width:480px;width:100%;
  position:relative;max-height:90vh;overflow-y:auto;
  animation:up .3s cubic-bezier(.22,1,.36,1);
}
.modal-close{
  position:absolute;top:16px;right:16px;
  background:var(--surf3);border:1px solid var(--border2);
  color:var(--muted2);border-radius:8px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1rem;transition:all .2s;
}
.modal-close:hover{color:var(--text);background:var(--surf)}
.modal-icon{font-size:3rem;margin-bottom:8px;text-align:center;display:block}
.modal-name{font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:5px}
.modal-salary{text-align:center;margin-bottom:16px}
.modal-section{margin-bottom:14px}
.modal-sh{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.modal-desc{font-size:.88rem;color:var(--muted2);line-height:1.75}

/* Retry */
.btn-retry{
  width:100%;
  background:linear-gradient(135deg,var(--p),var(--p2));
  color:#fff;border:none;border-radius:15px;padding:17px;
  font-size:1rem;font-weight:800;cursor:pointer;letter-spacing:.3px;
  transition:transform .2s,opacity .2s;margin-bottom:44px;
  box-shadow:0 6px 28px rgba(124,111,252,.3);
}
.btn-retry:hover{transform:translateY(-2px);opacity:.9}

/* Responsive */
@media(max-width:540px){
  .info-row{grid-template-columns:1fr}
  .w-hero{padding:44px 18px 38px}
  .q-wrap{padding:24px 16px 20px}
  .r-hero{padding:28px 16px 24px}
  .tbars{grid-template-columns:1fr}
  .modal{padding:24px 18px}
}
</style>
</head>
<body>
<div class="bg">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>

<div class="wrap">

  <!-- ─────── WELCOME ─────── -->
  <div class="screen active" id="s-welcome">
    <div class="w-hero">
      <span class="w-glyph">🔭</span>
      <div class="w-title">将来職業診断</div>
      <div class="w-sub">15問の質問に答えるだけで、<br>あなたの強みにぴったりな職業がわかる。</div>
      <div class="w-chips">
        <div class="w-chip">⏱️ 所要時間 <b>約3分</b></div>
        <div class="w-chip">💼 全 <b>22種類</b> の職業</div>
        <div class="w-chip">📊 <b>8つ</b> の特性分析</div>
        <div class="w-chip">💰 <b>平均年収</b> も表示</div>
      </div>
      <button class="btn-start" onclick="startQuiz()">診断スタート →</button>
    </div>
  </div>

  <!-- ─────── QUIZ ─────── -->
  <div class="screen" id="s-quiz">
    <div class="prog-hd">
      <span class="prog-info">Q<b id="qN">1</b>/15</span>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:6.6%"></div></div>
      <span class="prog-info" id="progPct" style="text-align:right">7%</span>
    </div>
    <div class="q-wrap" id="qCard">
      <div class="q-badge" id="qBadge">Q1</div>
      <div class="q-text" id="qText"></div>
      <div class="q-hint">直感で選んでみよう</div>
    </div>
    <div class="opts" id="opts"></div>
  </div>

  <!-- ─────── LOADING ─────── -->
  <div class="screen" id="s-loading">
    <div class="ld-center">
      <div class="ld-ring"></div>
      <div class="ld-title">22種類の職業と照合中…</div>
      <div class="ld-track"><div class="ld-fill" id="ldFill"></div></div>
      <div class="ld-steps" id="ldSteps"></div>
    </div>
  </div>

  <!-- ─────── RESULT ─────── -->
  <div class="screen" id="s-result">
    <div class="r-hero">
      <div class="r-crown">🏆 あなたに最も向いている職業</div>
      <span class="r-icon" id="rIcon"></span>
      <div class="r-name" id="rName"></div>
      <div class="r-tagline" id="rTagline"></div>
      <div><span class="r-salary">💴 平均年収 <span id="rSalary"></span></span></div>
      <div class="radar-box"><canvas id="radar" width="300" height="260"></canvas></div>
      <div class="tbars" id="tbars"></div>
    </div>

    <div class="info-row">
      <div class="info-card">
        <div class="ic-head">⚙️ 必要なスキル</div>
        <div id="rSkills"></div>
      </div>
      <div class="info-card">
        <div class="ic-head">🌟 向いている性格</div>
        <div id="rPersonality"></div>
      </div>
      <div class="info-card full">
        <div class="ic-head">📋 仕事の特徴</div>
        <div class="ic-text" id="rDesc"></div>
      </div>
    </div>

    <div class="alt-head">✨ 他にも向いている職業（タップで詳細）</div>
    <div class="alt-grid" id="altGrid"></div>

    <button class="btn-retry" onclick="restart()">🔄 もう一度診断する</button>
  </div>

</div>

<!-- ─────── MODAL ─────── -->
<div class="modal-bg hidden" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <span class="modal-icon" id="mIcon"></span>
    <div class="modal-name" id="mName"></div>
    <div class="modal-salary"><span class="r-salary" style="font-size:.95rem">💴 <span id="mSalary"></span></span></div>
    <div class="modal-section">
      <div class="modal-sh">📋 仕事の特徴</div>
      <div class="modal-desc" id="mDesc"></div>
    </div>
    <div class="modal-section">
      <div class="modal-sh">⚙️ 必要なスキル</div>
      <div id="mSkills"></div>
    </div>
    <div class="modal-section">
      <div class="modal-sh">🌟 向いている性格</div>
      <div id="mPersonality"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DATA
═══════════════════════════════════════════ */
const TRAITS=['logical','creative','social','leadership','stable','technical','empathy','research'];
const TL={
  logical:'分析・論理',creative:'創造・表現',social:'対人・社交',
  leadership:'リーダー',stable:'安定志向',technical:'技術・専門',
  empathy:'共感・感受',research:'探求・研究'
};

const CAREERS=[
  {id:'se',name:'ソフトウェアエンジニア',icon:'💻',
   tagline:'コードで世界を動かす、デジタル社会の建築家。',
   desc:'システム設計からプログラミング・テスト・運用まで幅広く担当。Web・アプリ・AI・クラウドなど活躍領域は無限大。リモートワーク率が高く、成果重視で働けるのが魅力。常に最新技術を追いかける刺激的なキャリア。',
   skills:['プログラミング','システム設計','アルゴリズム','クラウド','チームコラボ'],
   personality:['論理的','探求心がある','集中力が高い','問題解決が好き'],
   salary:'550〜950万円',
   profile:{logical:9,creative:5,social:3,leadership:4,stable:6,technical:10,empathy:3,research:8}},

  {id:'uxd',name:'UX/UIデザイナー',icon:'🎨',
   tagline:'美しさと使いやすさを両立させるユーザー体験の職人。',
   desc:'アプリやWebのインターフェース設計全般を担当。ユーザーリサーチ・ワイヤーフレーム・プロトタイプから最終デザインまで幅広い。クリエイティブと論理の両方が求められる人気職種。需要が急増中。',
   skills:['Figma/XD','ビジュアルデザイン','UXリサーチ','プロトタイピング','CSS基礎'],
   personality:['感性が豊か','ユーザー思考','細部へのこだわり','トレンド感覚'],
   salary:'450〜800万円',
   profile:{logical:5,creative:10,social:6,leadership:4,stable:5,technical:6,empathy:8,research:5}},

  {id:'doctor',name:'医師',icon:'🩺',

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let scores={},cur=0,busy=false;
const initScores=()=>TRAITS.forEach(t=>scores[t]=0);

/* ═══════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════ */
const show=id=>{
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
};
function startQuiz(){initScores();cur=0;busy=false;renderQ();show('quiz')}
function restart(){show('welcome')}

/* ═══════════════════════════════════════════
   QUIZ
═══════════════════════════════════════════ */
function renderQ(){
  const q=QUESTIONS[cur];
  const n=cur+1;
  const pct=Math.round(n/QUESTIONS.length*100);
  document.getElementById('qN').textContent=n;
  document.getElementById('qBadge').textContent='Q'+n;
  document.getElementById('qText').textContent=q.text;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
  const ol=document.getElementById('opts');
  ol.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="opt-em">${o.e}</span><span class="opt-label">${o.l}</span>`;
    b.style.cssText=`animation:up .4s ${i*.06}s ease both`;
    b.onclick=()=>pick(i,b,o);
    ol.appendChild(b);
  });
}

function pick(i,btn,opt){
  if(busy)return;busy=true;
  btn.classList.add('chosen');
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.style.pointerEvents='none'});
  for(const[t,v]of Object.entries(opt.t))scores[t]=(scores[t]||0)+v;
  setTimeout(()=>{
    cur++;
    if(cur>=QUESTIONS.length){runLoad()}
    else{busy=false;renderQ()}
  },320);
}

/* ═══════════════════════════════════════════
   LOADING
═══════════════════════════════════════════ */
const LD_MSGS=['回答データを解析中…','特性プロファイルを構築中…','22職業とマッチング中…','スキルマップを生成中…','診断結果をまとめています…'];
function runLoad(){
  show('loading');
  const fill=document.getElementById('ldFill');
  const stepsEl=document.getElementById('ldSteps');
  stepsEl.innerHTML=LD_MSGS.map(m=>`<div class="ld-step"><div class="ld-dot"></div>${m}</div>`).join('');
  const steps=[...stepsEl.querySelectorAll('.ld-step')];
  const thresholds=[0,20,45,68,88];
  let w=0,si=0;
  const iv=setInterval(()=>{
    w=Math.min(w+1.4,100);
    fill.style.width=w+'%';
    while(si<thresholds.length&&w>=thresholds[si]){
      if(steps[si-1])steps[si-1].classList.add('done');
      if(steps[si])steps[si].classList.add('on');
      si++;
    }
    if(w>=100){
      clearInterval(iv);
      steps.forEach(s=>s.classList.add('done'));
      setTimeout(showResult,500);
    }
  },28);
}

/* ═══════════════════════════════════════════
   MATCHING
═══════════════════════════════════════════ */
function matchCareers(){
  const uv=TRAITS.map(t=>scores[t]||0);
  const mx=Math.max(...uv)||1;
  const nu=uv.map(v=>v/mx);
  return CAREERS.map(c=>{
    const cv=TRAITS.map(t=>c.profile[t]/10);
    let d=0,um=0,cm=0;
    for(let i=0;i<TRAITS.length;i++){d+=nu[i]*cv[i];um+=nu[i]**2;cm+=cv[i]**2}
    return{career:c,score:d/(Math.sqrt(um)*Math.sqrt(cm)+1e-9)};
  }).sort((a,b)=>b.score-a.score);
}

═══════════════════════════════════════════ */

  const matches=matchCareers();

    return`<div class="tbar">

      <div class="tbar-track"><div class="tbar-fill" id="tf${i}" style="width:0%" data-w="${pct}"></div></div>
    </div>`;
  }).join('');

  // Alt careers
  const ag=document.getElementById('altGrid');
  ag.innerHTML=matches.slice(1,4).map(m=>`
    <div class="alt-card" onclick="openModal('${m.career.id}',${Math.round(m.score*100)})">
      <div class="alt-em">${m.career.icon}</div>
      <div class="alt-name">${m.career.name}</div>
      <div class="alt-pct">適合度 ${Math.round(m.score*100)}%</div>
      <div class="alt-salary">${m.career.salary}</div>
    </div>`).join('');

  show('result');

  // Animate after render
  requestAnimationFrame(()=>setTimeout(()=>{
    TRAITS.forEach((_,i)=>{
      const el=document.getElementById('tf'+i);
      if(el)el.style.width=el.dataset.w+'%';
    });
    drawRadar(uv,mx);
  },150));
}

/* ═══════════════════════════════════════════
   RADAR CHART
═══════════════════════════════════════════ */
function drawRadar(uv,mx){
  const c=document.getElementById('radar');
  if(!c)return;
  const ctx=c.getContext('2d');
  const W=c.width,H=c.height,cx=W/2,cy=H/2+8,R=Math.min(W,H)*.33;
  const N=TRAITS.length;
  ctx.clearRect(0,0,W,H);
  const ang=i=>Math.PI*2*i/N-Math.PI/2;
  const pt=(i,r)=>({x:cx+r*Math.cos(ang(i)),y:cy+r*Math.sin(ang(i))});

  // Grid
  for(let ring=1;ring<=4;ring++){
    const r=R*ring/4;
    ctx.beginPath();
    for(let i=0;i<N;i++){const p=pt(i,r);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
    ctx.closePath();
    ctx.strokeStyle=`rgba(255,255,255,${ring===4?.12:.06})`;
    ctx.lineWidth=1;ctx.stroke();
  }
  // Spokes
  for(let i=0;i<N;i++){
    const p=pt(i,R);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.stroke();
  }
  // Data fill
  const vals=uv.map(v=>v/mx);
  ctx.beginPath();
  for(let i=0;i<N;i++){const p=pt(i,R*vals[i]);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
  ctx.closePath();
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  grad.addColorStop(0,'rgba(124,111,252,.5)');
  grad.addColorStop(1,'rgba(233,99,200,.25)');
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='rgba(176,184,255,.7)';ctx.lineWidth=2;ctx.stroke();
  // Dots
  for(let i=0;i<N;i++){
    const p=pt(i,R*vals[i]);
    ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,Math.PI*2);
    ctx.fillStyle='#c4caff';ctx.fill();
  }
  // Labels
  ctx.font='11.5px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle='rgba(196,210,240,.82)';
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<N;i++){
    const p=pt(i,R+26);
    ctx.fillText(TL[TRAITS[i]],p.x,p.y);
  }
}
