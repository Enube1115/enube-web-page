<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音楽ジャンル診断</title>
<style>
  :root {
    --bg: #080810;
    --bg2: #0f0f1a;
    --surface: rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8e8f4;
    --text-sub: #7878a8;
    --accent: #a855f7;
    --accent2: #ec4899;
    --accent3: #06b6d4;
    --glow: rgba(168,85,247,0.35);
    --radius: 16px;
    --tr: 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG */
  .bg-wrap {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .orb {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.18;
    animation: drift 14s ease-in-out infinite;
  }
  .o1 { width:500px;height:500px;background:#a855f7;top:-150px;left:-100px;animation-delay:0s; }
  .o2 { width:400px;height:400px;background:#ec4899;bottom:-100px;right:-80px;animation-delay:-5s; }
  .o3 { width:350px;height:350px;background:#06b6d4;top:45%;left:55%;animation-delay:-10s; }
  @keyframes drift {
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(25px,-25px) scale(1.04);}
    66%{transform:translate(-18px,18px) scale(0.96);}
  }

  /* LAYOUT */
  .page { position:relative; z-index:1; max-width:680px; margin:0 auto; padding:24px 20px 60px; }

  /* HEADER */
  .header { text-align:center; padding:48px 0 36px; }
  .header-badge {
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:100px;padding:6px 18px;font-size:11px;
    color:var(--text-sub);letter-spacing:.12em;text-transform:uppercase;
    margin-bottom:18px;backdrop-filter:blur(12px);
  }
  .header-badge span{color:var(--accent);}
  h1 {
    font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.03em;
    line-height:1.1;margin-bottom:12px;
    background:linear-gradient(135deg,var(--text) 0%,var(--accent) 55%,var(--accent2) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .subtitle { color:var(--text-sub);font-size:.95rem;line-height:1.6; }

  /* PROGRESS */
  .progress-bar-wrap {
    background:var(--surface);border:1px solid var(--border);
    border-radius:100px;height:6px;margin-bottom:24px;overflow:hidden;
  }
  .progress-bar {
    height:100%;border-radius:100px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .5s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px var(--glow);
  }
  .progress-text { text-align:center;font-size:.8rem;color:var(--text-sub);margin-bottom:28px; }
  .progress-text span { color:var(--text);font-weight:700; }

  /* QUESTION CARD */
  .q-card {
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px;margin-bottom:20px;
    backdrop-filter:blur(16px);
    animation:slideUp .4s ease both;
  }
  @keyframes slideUp {
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
  .q-num {
    font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--accent);font-weight:700;margin-bottom:10px;
  }
  .q-text { font-size:1.1rem;font-weight:700;line-height:1.5;color:var(--text); }

  /* OPTIONS */
  .options { display:flex;flex-direction:column;gap:10px;margin-top:20px; }
  .opt {
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:14px 18px;cursor:pointer;
    display:flex;align-items:center;gap:14px;
    font-size:.9rem;color:var(--text);
    transition:all var(--tr);text-align:left;
    position:relative;overflow:hidden;
  }
  .opt:hover {
    border-color:var(--border2);background:var(--surface2);
    transform:translateX(4px);
  }
  .opt.selected {
    border-color:var(--accent);background:rgba(168,85,247,.12);
    box-shadow:0 0 0 1px rgba(168,85,247,.3);
  }
  .opt-icon {
    font-size:1.4rem;flex-shrink:0;width:36px;text-align:center;
    transition:transform var(--tr);
  }
  .opt:hover .opt-icon,.opt.selected .opt-icon { transform:scale(1.15); }
  .opt-check {
    margin-left:auto;width:20px;height:20px;border-radius:50%;
    border:2px solid var(--border2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:all var(--tr);font-size:.7rem;
  }
  .opt.selected .opt-check {
    background:var(--accent);border-color:var(--accent);color:#fff;
  }

  /* NAV */
  .nav-row { display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:24px; }
  .btn {
    padding:12px 28px;border-radius:12px;font-size:.9rem;font-weight:700;
    cursor:pointer;border:none;transition:all var(--tr);
    display:flex;align-items:center;gap:8px;
  }
  .btn-ghost {
    background:var(--surface);border:1px solid var(--border);color:var(--text-sub);
  }
  .btn-ghost:hover { border-color:var(--border2);color:var(--text);background:var(--surface2); }
  .btn-primary {
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;box-shadow:0 8px 24px var(--glow);flex:1;justify-content:center;
  }
  .btn-primary:hover { transform:translateY(-2px);box-shadow:0 12px 32px var(--glow); }
  .btn-primary:disabled { opacity:.4;cursor:not-allowed;transform:none; }

  /* RESULT */
  .result { display:none;animation:slideUp .5s ease both; }
  .result.show { display:block; }

  .genre-hero {
    border-radius:20px;padding:36px 28px;margin-bottom:24px;
    position:relative;overflow:hidden;text-align:center;
    border:1px solid rgba(255,255,255,.1);
  }
  .genre-hero::before {
    content:'';position:absolute;inset:0;
    background:var(--genre-grad);opacity:.2;
  }
  .genre-hero-bg {
    position:absolute;inset:0;
    background:var(--genre-grad);opacity:.08;
    filter:blur(40px);
  }
  .genre-emoji { font-size:4rem;margin-bottom:12px;display:block;position:relative;z-index:1; }
  .genre-label {
    font-size:.75rem;text-transform:uppercase;letter-spacing:.15em;
    color:rgba(255,255,255,.5);margin-bottom:6px;position:relative;z-index:1;
  }
  .genre-name {
    font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;
    letter-spacing:-.02em;position:relative;z-index:1;
    background:var(--genre-grad);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .genre-sub {
    font-size:.9rem;color:rgba(255,255,255,.55);margin-top:8px;position:relative;z-index:1;
  }

  /* MATCH BAR */
  .match-row { display:flex;align-items:center;gap:10px;margin-top:16px;position:relative;z-index:1; }
  .match-label { font-size:.75rem;color:rgba(255,255,255,.5);white-space:nowrap; }
  .match-track { flex:1;background:rgba(255,255,255,.1);border-radius:100px;height:8px;overflow:hidden; }
  .match-fill { height:100%;border-radius:100px;background:var(--genre-grad);transition:width 1s ease; }
  .match-pct { font-size:.9rem;font-weight:800;color:#fff;white-space:nowrap; }

  /* RESULT SECTIONS */
  .res-section {
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px;margin-bottom:16px;
    backdrop-filter:blur(12px);
  }
  .res-section h3 {
    font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;
    color:var(--text-sub);margin-bottom:14px;
    display:flex;align-items:center;gap:7px;
  }
  .res-section h3::before {
    content:'';width:3px;height:14px;border-radius:2px;
    background:var(--genre-grad);display:block;
  }

  /* TRAITS */
  .traits { display:flex;flex-wrap:wrap;gap:8px; }
  .trait {
    background:var(--surface2);border:1px solid var(--border);
    border-radius:100px;padding:6px 14px;font-size:.8rem;
    color:var(--text);
  }

  /* ARTISTS */
  .artists { display:flex;flex-direction:column;gap:10px; }
  .artist {
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;background:var(--surface2);
    border-radius:10px;border:1px solid var(--border);
  }
  .artist-icon {
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;background:var(--surface);
    border:1px solid var(--border);flex-shrink:0;
  }
  .artist-info { flex:1; }
  .artist-name { font-size:.88rem;font-weight:700; }
  .artist-desc { font-size:.75rem;color:var(--text-sub);margin-top:2px; }

  /* PLAYLIST VIBES */
  .vibes { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
  .vibe {
    padding:14px;border-radius:12px;
    background:var(--surface2);border:1px solid var(--border);
    text-align:center;
  }
  .vibe-emoji { font-size:1.6rem;margin-bottom:6px;display:block; }
  .vibe-title { font-size:.8rem;font-weight:700; }
  .vibe-desc { font-size:.7rem;color:var(--text-sub);margin-top:3px; }

  /* SECONDARY GENRES */
  .secondary { display:flex;flex-direction:column;gap:8px; }
  .sec-row {
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:var(--surface2);
    border-radius:10px;border:1px solid var(--border);
  }
  .sec-emoji { font-size:1.2rem;width:28px;text-align:center;flex-shrink:0; }
  .sec-name { font-size:.85rem;font-weight:700;flex:1; }
  .sec-bar-wrap { width:80px;background:var(--surface);border-radius:100px;height:5px;overflow:hidden; }
  .sec-bar { height:100%;border-radius:100px;background:var(--genre-grad); }
  .sec-pct { font-size:.78rem;color:var(--text-sub);width:32px;text-align:right; }

  /* RETRY */
  .retry-row { display:flex;gap:12px;margin-top:28px; }
  .btn-retry {
    flex:1;padding:14px;border-radius:12px;font-size:.9rem;font-weight:700;
    cursor:pointer;border:none;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    transition:all var(--tr);
  }
  .btn-retry:hover { background:var(--surface2);border-color:var(--border2); }
  .btn-home {
    flex:1;padding:14px;border-radius:12px;font-size:.9rem;font-weight:700;
    cursor:pointer;border:none;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 24px var(--glow);
    transition:all var(--tr);text-decoration:none;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-home:hover { transform:translateY(-2px);box-shadow:0 12px 32px var(--glow); }

  /* INTRO */
  .intro-card {
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:28px;margin-bottom:20px;
    backdrop-filter:blur(16px);text-align:center;
  }
  .intro-emoji { font-size:3.5rem;margin-bottom:16px;display:block; }
  .intro-card h2 { font-size:1.3rem;font-weight:800;margin-bottom:10px; }
  .intro-card p { font-size:.9rem;color:var(--text-sub);line-height:1.7; }
  .genre-chips { display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 0; }
  .chip {
    padding:5px 14px;border-radius:100px;font-size:.75rem;font-weight:700;
    border:1px solid var(--border);background:var(--surface2);color:var(--text-sub);
  }

  @media(max-width:480px){
    .vibes{grid-template-columns:1fr;}
    .nav-row{flex-direction:column;}
    .btn-primary,.btn-ghost{width:100%;justify-content:center;}
  }
</style>
</head>

      </div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()" style="width:100%;justify-content:center;padding:16px;">
      診断スタート →
    </button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" style="display:none;">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-text">質問 <span id="qCurrent">1</span> / <span id="qTotal">15</span></div>

    <div class="q-card" id="qCard">

      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()" style="display:none;">← 戻る</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQ()" disabled>次へ →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="result" id="result"></div>
</div>

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQ(0);
}

function renderQ(idx) {
  current = idx;
  const q = QUESTIONS[idx];
  const total = QUESTIONS.length;
  const pct = (idx / total) * 100;

  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('qCurrent').textContent = idx + 1;
  document.getElementById('qTotal').textContent = total;
  document.getElementById('qNum').textContent = `Q${idx + 1}  ${q.icon}`;
  document.getElementById('qText').textContent = q.text;

  const card = document.getElementById('qCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'slideUp .35s ease both';

  const optDiv = document.getElementById('options');
  optDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[idx] === i ? ' selected' : '');
    btn.innerHTML = `
      <span class="opt-icon">${opt.icon}</span>
      <span>${opt.text}</span>
      <span class="opt-check">${answers[idx] === i ? '✓' : ''}</span>
    `;
    btn.addEventListener('click', () => selectOpt(i));
    optDiv.appendChild(btn);
  });

  document.getElementById('prevBtn').style.display = idx > 0 ? 'flex' : 'none';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = answers[idx] === null;
  nextBtn.textContent = idx === total - 1 ? '結果を見る →' : '次へ →';
}

function selectOpt(i) {
  answers[current] = i;
  document.querySelectorAll('.opt').forEach((b, j) => {
    b.classList.toggle('selected', j === i);
    b.querySelector('.opt-check').textContent = j === i ? '✓' : '';
  });
  document.getElementById('nextBtn').disabled = false;
}

function nextQ() {
  if (answers[current] === null) return;
  if (current + 1 >= QUESTIONS.length) {
    showResult();
  } else {
    renderQ(current + 1);
  }
}

function prevQ() {
  if (current > 0) renderQ(current - 1);
}

function calcScores() {
  const scores = {};
  Object.keys(GENRES).forEach(g => scores[g] = 0);
  QUESTIONS.forEach((q, qi) => {
    const ans = answers[qi];
    if (ans === null) return;
    const s = q.options[ans].scores;
    Object.entries(s).forEach(([g, v]) => { scores[g] = (scores[g] || 0) + v; });
  });
  return scores;
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const resultDiv = document.getElementById('result');
  resultDiv.classList.add('show');

  const scores = calcScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const [topKey, topScore] = sorted[0];
  const genre = GENRES[topKey];
  const maxPossible = QUESTIONS.length * 3;

            <div class="artist-info">
              <div class="artist-name">${a.name}</div>
              <div class="artist-desc">${a.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- PLAYLIST VIBES -->
    <div class="res-section">
      <h3>プレイリストのイメージ</h3>
      <div class="vibes">
        ${genre.vibes.map(v => `
          <div class="vibe">
            <span class="vibe-emoji">${v.emoji}</span>
            <div class="vibe-title">${v.title}</div>
            <div class="vibe-desc">${v.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- SECONDARY -->
    <div class="res-section">
      <h3>他のジャンル相性</h3>
      <div class="secondary">
        ${secondaries.map(([k, sc]) => {
          const g = GENRES[k];
          const sp = secMax > 0 ? Math.round((sc / secMax) * 100) : 0;
          return `
            <div class="sec-row">
              <span class="sec-emoji">${g.emoji}</span>
              <span class="sec-name">${g.name}</span>
              <div class="sec-bar-wrap"><div class="sec-bar" style="width:${sp}%;background:${g.grad}"></div></div>
              <span class="sec-pct">${sp}%</span>
            </div>`;
        }).join('')}
      </div>
    </div>

    <div class="retry-row">
      <button class="btn-retry" onclick="retryQuiz()">🔄 もう一度診断する</button>
      <a class="btn-home" href="index.html">🏠 ホームへ戻る</a>
    </div>
  `;

  // animate match bar
  setTimeout(() => {
    const fill = document.getElementById('matchFill');
    if (fill) fill.style.width = pct + '%';
  }, 100);
}

function retryQuiz() {
  answers = new Array(QUESTIONS.length).fill(null);
  current = 0;
  document.getElementById('result').classList.remove('show');
  document.getElementById('result').innerHTML = '';
  document.getElementById('intro').style.display = 'block';
}
</script>
</body>
</html>
